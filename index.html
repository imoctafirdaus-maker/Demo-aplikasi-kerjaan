<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Board Game Collection - 1888</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="icon" type="image/png" href="1000041752.png">
    <link rel="apple-touch-icon" href="1000041752.png">

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Special+Elite&display=swap');

        :root {
            --wood-dark: #3d2b1f; --wood-light: #5d4037; --brass: #b7950b;
            --paper: #d7ccc8; --gold-fire: linear-gradient(90deg, #ff4500, #ffd700, #ffffff, #ffd700, #ff4500);
            --shadow-out: 4px 4px 8px rgba(0,0,0,0.4); --shadow-in: inset 4px 4px 8px rgba(0,0,0,0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: radial-gradient(circle, #2c1e16 0%, #1a0f0a 100%);
            color: var(--paper); font-family: 'Special Elite', cursive;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow: hidden;
        }

        /* --- LOBBY --- */
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(8px); }
        .card-vintage { background: var(--wood-light); padding: 25px; border: 8px double var(--brass); border-radius: 5px; text-align: center; width: 90%; max-width: 400px; }
        .app-logo { width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--brass); margin-bottom: 10px; object-fit: cover; }
        
        .name-input { width: 100%; padding: 10px; background: #2a1b12; color: var(--paper); border: none; margin-bottom: 15px; text-align: center; font-family: 'Special Elite'; }
        .btn-choice { padding: 10px 15px; border: 1px solid var(--brass); background: var(--wood-light); color: var(--brass); font-weight: bold; cursor: pointer; border-radius: 8px; font-family: 'Cinzel'; width: 100%; margin-top: 10px; }
        .btn-choice:disabled { opacity: 0.5; cursor: not-allowed; }

        /* --- GAME BOARD --- */
        .board-wrapper { transform: rotateX(25deg); perspective: 1200px; background: var(--wood-dark); padding: 10px; border-radius: 8px; box-shadow: 0 15px 35px rgba(0,0,0,0.8); }
        .board-xoxo { display: grid; grid-template-columns: repeat(10, 8.5vw); grid-template-rows: repeat(10, 8.5vw); gap: 2px; }
        .block { background: var(--wood-light); display: flex; justify-content: center; align-items: center; font-family: 'Cinzel'; cursor: pointer; box-shadow: var(--shadow-out); }
        .x-icon { color: #d32f2f; font-size: 5vw; } .o-icon { color: var(--brass); font-size: 5vw; }
        .win-line { position: absolute; z-index: 100; background: var(--gold-fire); height: 6px; border-radius: 10px; transform-origin: left center; }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="card-vintage">
            <img src="1000041752.png" alt="Logo" class="app-logo">
            <h1 style="color: var(--brass); margin-bottom: 15px;">GRAND LOBBY</h1>
            <input type="text" id="inputNama" class="name-input" placeholder="GELAR ANDA..." maxlength="10">
            <button class="btn-choice" onclick="selectGame('XOXO')">TIC-TAC-TOE (10x10)</button>
            <div id="role-select" style="display:none; margin-top: 15px;">
                <button id="btn1" class="btn-choice" onclick="confirmStart(1)"></button>
                <button id="btn2" class="btn-choice" onclick="confirmStart(2)"></button>
            </div>
        </div>
    </div>

    <div id="status" style="margin: 20px 0;">PILIH GAME DI MENU</div>

    <div class="board-wrapper">
        <div id="main-board" class="board-xoxo"></div>
        <div id="line-container" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;"></div>
    </div>

    <script>
        // Registrasi Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); });
        }

        const firebaseConfig = {
            apiKey: "AIzaSyBlL2HCkJYw_wNTMvJpDUpmJzw1-plQTm0",
            databaseURL: "https://tic-tac-toe-api-5a2c0-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "tic-tac-toe-api-5a2c0",
        };
        firebase.initializeApp(firebaseConfig);
        let db = null;

        // --- AUDIO SYSTEM ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, duration, type = 'sine') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        function playWinSound() {
            [440, 554, 659, 880].forEach((f, i) => {
                setTimeout(() => playSound(f, 0.4, 'square'), i * 150);
            });
        }

        // --- GAME LOGIC ---
        let myRole = "", turn = "", isGameOver = false;

        function selectGame(game) {
            const n = document.getElementById('inputNama').value;
            if(!n) return alert("MASUKKAN NAMA!");
            db = firebase.database().ref('multi_game_v1/' + game);
            document.getElementById('role-select').style.display = 'block';
            document.getElementById('btn1').innerText = "PIHAK X";
            document.getElementById('btn2').innerText = "PIHAK O";
        }

        function confirmStart(choice) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            myRole = choice === 1 ? 'X' : 'O';
            document.getElementById('overlay').style.display = 'none';
            initBoard();
            syncGame();
        }

        function initBoard() {
            const board = document.getElementById('main-board');
            for(let i=0; i<100; i++) {
                const b = document.createElement('div'); b.className = 'block';
                b.onclick = () => {
                    if(turn === myRole && !isGameOver) {
                        db.child('cells/' + i).set(myRole);
                        db.child('turn').set(myRole === 'X' ? 'O' : 'X');
                        playSound(600, 0.1);
                    }
                };
                board.appendChild(b);
            }
        }

        function syncGame() {
            db.child('cells').on('value', s => {
                const cells = s.val() || {};
                Object.keys(cells).forEach(idx => {
                    const el = document.getElementById('main-board').children[idx];
                    el.innerHTML = `<span class="${cells[idx]==='X'?'x-icon':'o-icon'}">${cells[idx]}</span>`;
                });
            });
            db.child('turn').on('value', s => turn = s.val() || 'X');
            db.child('winner').on('value', s => {
                if(s.exists()) {
                    isGameOver = true;
                    playWinSound();
                    document.getElementById('status').innerText = s.val().name + " MENANG!";
                }
            });
        }
    </script>
</body>
</html>
