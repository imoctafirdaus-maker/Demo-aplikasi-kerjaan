<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Board Game Collection - 1888</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    
    <link rel="icon" type="image/png" href="1777546745740.png">
    <link rel="apple-touch-icon" href="1777546745740.png">

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Special+Elite&display=swap');

        :root {
            --wood-dark: #3d2b1f; --wood-light: #5d4037; --brass: #b7950b;
            --paper: #d7ccc8; --shadow-out: 4px 4px 8px rgba(0,0,0,0.4); --shadow-in: inset 4px 4px 8px rgba(0,0,0,0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
        body { 
            background: radial-gradient(circle, #2c1e16 0%, #1a0f0a 100%);
            color: var(--paper); font-family: 'Special Elite', cursive;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow: hidden;
        }

        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(10px); }
        .card-vintage { background: var(--wood-light); padding: 25px; border: 8px double var(--brass); border-radius: 5px; text-align: center; width: 90%; max-width: 350px; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
        
        /* Logo Fix */
        .app-logo { width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--brass); margin-bottom: 10px; object-fit: cover; }
        
        .name-input { width: 100%; padding: 12px; background: #2a1b12; color: var(--paper); border: none; margin-bottom: 15px; text-align: center; font-family: 'Special Elite'; box-shadow: var(--shadow-in); outline: none; border-bottom: 2px solid var(--brass); }
        .btn-choice { padding: 12px; border: 1px solid var(--brass); background: var(--wood-light); color: var(--brass); font-weight: bold; cursor: pointer; border-radius: 5px; font-family: 'Cinzel'; width: 100%; margin-top: 10px; box-shadow: var(--shadow-out); }
        .btn-choice:disabled { opacity: 0.4; filter: grayscale(1); cursor: not-allowed; }
        
        .role-container { display: flex; gap: 10px; margin-top: 10px; }
        .role-container button { flex: 1; font-size: 0.7rem; }

        #btn-refresh { position: fixed; top: 15px; right: 15px; width: 40px; height: 40px; background: var(--wood-light); border: 2px solid var(--brass); color: var(--brass); border-radius: 50%; z-index: 100; font-size: 20px; cursor: pointer; }

        #status { margin: 60px 0 10px 0; font-size: 0.75rem; color: var(--brass); letter-spacing: 1px; font-weight: bold; text-transform: uppercase; }
        .board-wrapper { transform: rotateX(15deg); perspective: 1000px; background: var(--wood-dark); padding: 8px; border-radius: 5px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
        .board-xoxo { display: grid; grid-template-columns: repeat(10, 8.8vw); grid-template-rows: repeat(10, 8.8vw); gap: 1px; background: var(--brass); border: 1px solid var(--brass); }
        .block { background: var(--wood-light); display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .x-icon { color: #ff4444; font-size: 5vw; font-weight: bold; } 
        .o-icon { color: var(--brass); font-size: 5vw; font-weight: bold; }
    </style>
</head>
<body>

    <button id="btn-refresh" onclick="resetGame()">↻</button>

    <div id="overlay">
        <div class="card-vintage">
            <img src="1777546745740.png" alt="Logo" class="app-logo">
            <h1 style="color: var(--brass); font-size: 1.2rem; margin-bottom: 15px; font-family: 'Cinzel';">GRAND LOBBY</h1>
            <input type="text" id="inputNama" class="name-input" placeholder="Gelar Anda..." maxlength="10">
            <button class="btn-choice" id="main-select-btn" onclick="selectGame('XOXO')">MASUK PERMAINAN</button>
            <div id="role-select" style="display:none; margin-top: 15px; border-top: 1px solid var(--brass); padding-top: 10px;">
                <p style="font-size: 0.6rem; color: var(--brass);">PILIH PIHAK:</p>
                <div class="role-container">
                    <button id="btn1" class="btn-choice" onclick="confirmStart(1)">PIHAK X</button>
                    <button id="btn2" class="btn-choice" onclick="confirmStart(2)">PIHAK O</button>
                </div>
            </div>
        </div>
    </div>

    <div id="status">PILIH PERAN DI LOBBY</div>
    <div class="board-wrapper"><div id="main-board" class="board-xoxo"></div></div>

    <script>
        if ('serviceWorker' in navigator) { 
            window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); }); 
        }

        const firebaseConfig = {
            apiKey: "AIzaSyBlL2HCkJYw_wNTMvJpDUpmJzw1-plQTm0",
            databaseURL: "https://tic-tac-toe-api-5a2c0-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "tic-tac-toe-api-5a2c0",
        };
        firebase.initializeApp(firebaseConfig);
        let db = null;
        let myRole = "", turn = "", myName = "", isGameOver = false;

        function selectGame(game) {
            const n = document.getElementById('inputNama').value;
            if(!n) return alert("Masukan Nama!");
            myName = n;
            db = firebase.database().ref('multi_game_v1/' + game);
            document.getElementById('main-select-btn').style.display = 'none';
            document.getElementById('role-select').style.display = 'block';
            db.child('names').on('value', s => {
                const names = s.val() || {};
                document.getElementById('btn1').disabled = !!names.X;
                document.getElementById('btn2').disabled = !!names.O;
            });
        }

        function confirmStart(choice) {
            myRole = choice === 1 ? 'X' : 'O';
            db.child('names/' + myRole).set(myName);
            document.getElementById('overlay').style.display = 'none';
            initBoard();
            syncGame();
        }

        function initBoard() {
            const board = document.getElementById('main-board');
            board.innerHTML = "";
            for(let i=0; i<100; i++) {
                const b = document.createElement('div'); 
                b.className = 'block'; b.id = `block-${i}`;
                b.onclick = () => {
                    if(turn === myRole && !isGameOver) {
                        db.child('cells/' + i).transaction(c => c === null ? myRole : undefined);
                        db.child('turn').set(myRole === 'X' ? 'O' : 'X');
                    }
                };
                board.appendChild(b);
            }
        }

        function resetGame() {
            if(db && confirm("Reset Papan?")) {
                db.child('cells').remove();
                db.child('winner').remove();
                db.child('turn').set('X');
                isGameOver = false;
            }
        }

        function syncGame() {
            db.child('cells').on('value', s => {
                const cells = s.val() || {};
                document.querySelectorAll('.block').forEach(b => b.innerHTML = "");
                Object.keys(cells).forEach(idx => {
                    const el = document.getElementById(`block-${idx}`);
                    if(el) el.innerHTML = `<span class="${cells[idx]==='X'?'x-icon':'o-icon'}">${cells[idx]}</span>`;
                });
            });
            db.child('turn').on('value', s => {
                turn = s.val() || 'X';
                document.getElementById('status').innerText = (turn === myRole) ? "GILIRAN ANDA" : "LAWAN BERPIKIR...";
            });
        }
    </script>
</body>
</html>
