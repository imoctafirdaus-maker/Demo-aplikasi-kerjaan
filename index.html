<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tic-Tac-Toe Pro: Name & Score Edition</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #e0e5ec;
            --shadow-dark: #a3b1c6;
            --shadow-light: #ffffff;
            --gold-fire: linear-gradient(90deg, #ff4500, #ff8c00, #ffd700, #ffffff, #ffd700, #ff8c00, #ff4500);
            --x-color: #ff4757;
            --o-color: #2ed573;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 10px; color: #444; }

        /* --- MENU AWAL (INPUT NAMA) --- */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); z-index: 1000; display: flex; justify-content: center; align-items: center;
        }
        .card-3d {
            background: var(--bg-color); padding: 30px; border-radius: 30px;
            box-shadow: 20px 20px 60px var(--shadow-dark), -20px -20px 60px var(--shadow-light);
            text-align: center; width: 90%; max-width: 380px;
        }
        input.name-input {
            width: 100%; padding: 15px; border: none; border-radius: 15px;
            background: var(--bg-color); margin-bottom: 20px; outline: none;
            box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
            font-size: 1rem; text-align: center; font-weight: bold;
        }

        /* --- SCOREBOARD --- */
        .scoreboard {
            display: flex; gap: 15px; margin-bottom: 20px; width: 100%; max-width: 400px;
        }
        .score-box {
            flex: 1; padding: 10px; border-radius: 20px; text-align: center;
            background: var(--bg-color); box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
        }
        .score-val { font-size: 1.5rem; font-weight: 900; display: block; }
        .player-name { font-size: 0.7rem; text-transform: uppercase; font-weight: 800; color: #777; }

        /* --- GAME BOARD --- */
        .viewport-container { width: 100%; overflow-x: auto; padding: 10px 0; display: flex; justify-content: center; }
        .board-wrapper { position: relative; padding: 20px; background: var(--bg-color); border-radius: 30px; box-shadow: 10px 10px 20px var(--shadow-dark); }
        .board { display: grid; grid-template-columns: repeat(10, 45px); gap: 8px; }
        .block {
            width: 45px; height: 45px; background: var(--bg-color); border-radius: 10px;
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            display: flex; justify-content: center; align-items: center; font-size: 1.3rem; font-weight: 900;
        }
        .block.taken { box-shadow: inset 3px 3px 6px var(--shadow-dark); }

        /* --- ANIMASI EMAS API --- */
        .win-line {
            position: absolute; z-index: 100; background: var(--gold-fire); background-size: 200% auto;
            height: 10px; border-radius: 10px; transform-origin: 0 50%; pointer-events: none;
            box-shadow: 0 0 20px #ff4500; animation: draw 0.6s forwards, shimmer 1.5s infinite linear;
        }
        @keyframes draw { from { width: 0; } }
        @keyframes shimmer { to { background-position: 200% center; } }

        .btn-action {
            margin-top: 20px; padding: 12px 25px; border: none; border-radius: 50px;
            background: var(--bg-color); box-shadow: 5px 5px 10px var(--shadow-dark);
            font-weight: 800; cursor: pointer; color: #555;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="card-3d">
            <h2 style="margin-bottom: 20px;">MASUKKAN NAMA</h2>
            <input type="text" id="inputNama" class="name-input" placeholder="Nama Anda..." maxlength="12">
            <p style="font-size: 0.8rem; margin-bottom: 15px; color: #888;">Pilih simbol untuk mulai bermain</p>
            <div style="display: flex; gap: 15px; justify-content: center;">
                <button class="btn-action" style="color: var(--x-color);" onclick="pickRole('X')">PILIH X</button>
                <button class="btn-action" style="color: var(--o-color);" onclick="pickRole('O')">PILIH O</button>
            </div>
        </div>
    </div>

    <div class="scoreboard">
        <div class="score-box">
            <span class="player-name" id="nameX">Player X</span>
            <span class="score-val" id="scoreX" style="color: var(--x-color);">0</span>
        </div>
        <div class="score-box">
            <span class="player-name" id="nameO">Player O</span>
            <span class="score-val" id="scoreO" style="color: var(--o-color);">0</span>
        </div>
    </div>

    <div id="status-info" style="font-weight: 800; margin-bottom: 15px;">Menghubungkan...</div>

    <div class="viewport-container">
        <div class="board-wrapper">
            <div class="board" id="game-board"></div>
            <div id="line-container"></div>
        </div>
    </div>

    <button class="btn-action" onclick="resetBoard()" style="color: #e53e3e;">RESET PAPAN</button>

    <script>
        // --- CONFIG FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyBlL2HCkJYw_wNTMvJpDUpmJzw1-plQTm0",
            authDomain: "tic-tac-toe-api-5a2c0.firebaseapp.com",
            databaseURL: "https://tic-tac-toe-api-5a2c0-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "tic-tac-toe-api-5a2c0",
            storageBucket: "tic-tac-toe-api-5a2c0.firebasestorage.app",
            messagingSenderId: "820709850876",
            appId: "1:820709850876:web:e07700750b3faccb412179"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref('game_v3');

        let myRole = null, myName = "", currentTurn = 'X', gameActive = true, grid = Array(100).fill("");

        function pickRole(role) {
            const input = document.getElementById('inputNama').value;
            myName = input || "Anonim";
            myRole = role;

            // Simpan nama ke Firebase agar lawan tahu siapa kita
            db.child('names/' + role).set(myName);
            
            document.getElementById('overlay').style.display = 'none';
            initUI();
            syncData();
        }

        function initUI() {
            const board = document.getElementById('game-board');
            board.innerHTML = "";
            for (let i = 0; i < 100; i++) {
                const b = document.createElement('div');
                b.className = 'block'; b.id = `b-${i}`;
                b.onclick = () => {
                    if(gameActive && currentTurn === myRole && grid[i] === "") {
                        db.child('cells/' + i).set(myRole);
                        db.child('turn').set(myRole === 'X' ? 'O' : 'X');
                    }
                };
                board.appendChild(b);
            }
        }

        function syncData() {
            // Pantau Giliran
            db.child('turn').on('value', s => {
                currentTurn = s.val() || 'X';
                document.getElementById('status-info').innerText = currentTurn === myRole ? "GILIRAN ANDA!" : "Menunggu Lawan...";
            });

            // Pantau Nama Pemain
            db.child('names').on('value', s => {
                const names = s.val() || {};
                document.getElementById('nameX').innerText = names.X || "Player X";
                document.getElementById('nameO').innerText = names.O || "Player O";
            });

            // Pantau Skor
            db.child('scores').on('value', s => {
                const scores = s.val() || {X: 0, O: 0};
                document.getElementById('scoreX').innerText = scores.X;
                document.getElementById('scoreO').innerText = scores.O;
            });

            // Pantau Papan
            db.child('cells').on('value', s => {
                const data = s.val() || {};
                grid = Array(100).fill("");
                Object.keys(data).forEach(i => {
                    grid[i] = data[i];
                    const el = document.getElementById(`b-${i}`);
                    if(el) {
                        el.innerHTML = `<span style="color:${grid[i]==='X'?'var(--x-color)':'var(--o-color)'}">${grid[i]}</span>`;
                        el.classList.add('taken');
                    }
                });
                checkWin();
            });

            // Pantau Reset
            db.on('value', s => { if(!s.hasChild('cells')) { gameActive = true; document.getElementById('line-container').innerHTML = ""; initUI(); } });
        }

        function checkWin() {
            for (let i = 0; i < 100; i++) {
                if (grid[i] === "") continue;
                const win = getCombo(i);
                if (win) {
                    gameActive = false;
                    drawWin(win.cells, grid[i]);
                    // Hanya satu player yang update skor agar tidak dobel
                    if(myRole === grid[i]) {
                        db.child('scores/' + grid[i]).transaction(curr => (curr || 0) + 1);
                    }
                    break;
                }
            }
        }

        function getCombo(i) {
            const r = Math.floor(i / 10), c = i % 10, char = grid[i];
            const dirs = [{x:1,y:0}, {x:0,y:1}, {x:1,y:1}, {x:1,y:-1}];
            for (let d of dirs) {
                let combo = [i];
                [1, -1].forEach(s => {
                    let nr = r + d.y*s, nc = c + d.x*s;
                    while(nr>=0 && nr<10 && nc>=0 && nc<10 && grid[nr*10+nc] === char) {
                        combo.push(nr*10+nc); nr += d.y*s; nc += d.x*s;
                    }
                });
                if (combo.length >= 5) return { cells: combo };
            }
            return null;
        }

        function drawWin(cells, p) {
            cells.sort((a,b) => a-b);
            const b = document.getElementById('game-board').getBoundingClientRect();
            const s = document.getElementById(`b-${cells[0]}`).getBoundingClientRect();
            const e = document.getElementById(`b-${cells[cells.length-1]}`).getBoundingClientRect();
            const x1 = (s.left+s.width/2)-b.left, y1 = (s.top+s.height/2)-b.top;
            const x2 = (e.left+e.width/2)-b.left, y2 = (e.top+e.height/2)-b.top;
            const dist = Math.sqrt(Math.pow(x2-x1, 2) + Math.pow(y2-y1, 2));
            const angle = Math.atan2(y2-y1, x2-x1) * 180 / Math.PI;

            const line = document.createElement('div');
            line.className = 'win-line';
            line.style.cssText = `left:${x1}px; top:${y1}px; width:${dist}px; transform:rotate(${angle}deg);`;
            document.getElementById('line-container').appendChild(line);
            document.getElementById('status-info').innerHTML = `PEMENANG: ${p}! 🔥`;
        }

        function resetBoard() { if(confirm("Reset Papan?")) db.child('cells').remove(); }
    </script>
</body>
</html>
