<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-color=1.0, user-scalable=no">
    <title>TrackCust JTM - Official</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
    
    <style>
        .dominos-blue { background-color: #006491; }
        .dominos-red { background-color: #e31837; }
        ::-webkit-scrollbar { width: 0; background: transparent; }
        
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; align-items: center; padding: 10px 0; border-top: 2px solid #f1f5f9; z-index: 1000; padding-bottom: env(safe-area-inset-bottom); height: 70px; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #94a3b8; font-size: 10px; font-weight: 800; text-transform: uppercase; width: 20%; cursor: pointer; transition: all 0.2s; }
        .nav-item.active { color: #006491; }
        .nav-add { background: #006491 !important; color: white !important; width: 55px !important; height: 55px !important; border-radius: 50% !important; margin-top: -35px; justify-content: center; border: 4px solid white; box-shadow: 0 4px 15px rgba(0,100,145,0.3); position: relative; z-index: 1001; }
        
        .page { display: none; height: 100%; flex-direction: column; }
        .page.active { display: flex; }
        
        .wa-card { background: white; padding: 1.5rem; border-radius: 2rem; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 350px; text-align: center; }
        .driver-badge { background: #ebf5ff; color: #006491; padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: 900; border: 1px solid #006491; }
        
        .status-item { padding: 2px 0; border-bottom: 1px dashed rgba(0,100,145,0.1); }
        .animate-blink { animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.2; } 100% { opacity: 1; } }

        .profile-bubble { background: white; border-radius: 1.5rem; padding: 1rem 1.25rem; box-shadow: 0 4px 15px rgba(0,0,0,0.03); display: flex; align-items: center; gap: 12px; cursor: pointer; transition: all 0.2s; border: 1px solid #f1f5f9; }
        .profile-bubble:active { transform: scale(0.98); background: #f8fafc; }
        .profile-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 16px; }

        .header-avatar { width: 28px; height: 28px; border-radius: 50%; border: 2px solid white; object-fit: cover; cursor: pointer; }
        .online-avatar { width: 14px; height: 14px; border-radius: 50%; object-fit: cover; }
        .antaran-photo { cursor: pointer; transition: transform 0.2s; }
        .antaran-photo:active { transform: scale(0.92); }

        #modalContent { overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; }
        #fullImg { transition: transform 0.05s ease-out; touch-action: none; pointer-events: auto; }

        .checkbox-custom { appearance: none; -webkit-appearance: none; width: 20px; height: 20px; border: 2px solid #22c55e; border-radius: 4px; background-color: white; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; position: relative; }
        .checkbox-custom:checked::after { content: "\f00c"; font-family: "Font Awesome 5 Free"; font-weight: 900; color: #22c55e; font-size: 12px; }

        /* Tema Papan Catur Profesional: Putih (Krem) & Cokelat */
        .chess-container { width: 100%; max-width: 450px; aspect-ratio: 1; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); box-sizing: border-box; margin: 0 auto; border: 4px solid #4a2e1b; border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); background-color: #4a2e1b; overflow: hidden; }
        .chess-sq { position: relative; display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; user-select: none; box-sizing: border-box; }
        .chess-light { background-color: #f0d9b5; color: #b58863; }
        .chess-dark { background-color: #b58863; color: #f0d9b5; }
        .chess-piece { width: 95%; height: 95%; z-index: 10; cursor: pointer; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.3)); transition: transform 0.15s ease-out; object-fit: contain; }
        .chess-piece.dragging { transform: scale(1.2); z-index: 100; cursor: grabbing; filter: drop-shadow(0 15px 20px rgba(0,0,0,0.5)); }
        .chess-hl { position: absolute; inset: 0; background-color: rgba(246, 246, 105, 0.5); z-index: 5; }
        .chess-last-move { position: absolute; inset: 0; background-color: rgba(255, 255, 51, 0.4); z-index: 4; }
        .chess-legal-dot { position: absolute; width: 25%; height: 25%; background-color: rgba(0,0,0,0.2); border-radius: 50%; z-index: 6; pointer-events: none; }
        .chess-legal-cap { position: absolute; width: 90%; height: 90%; border: 6px solid rgba(0,0,0,0.2); border-radius: 50%; z-index: 6; pointer-events: none; }
        .chess-check-hl { position: absolute; inset: 0; background: radial-gradient(circle, rgba(255,0,0,0.8) 0%, rgba(255,0,0,0) 80%); z-index: 4; }
        .chess-rank-lbl, .chess-file-lbl { position: absolute; font-size: 10px; font-weight: 800; z-index: 1; font-family: sans-serif; pointer-events: none; }
        .chess-rank-lbl { top: 2px; left: 3px; }
        .chess-file-lbl { bottom: 0px; right: 3px; }
        
        .timer-active { background-color: #ffffff !important; color: #16a34a !important; box-shadow: 0 0 15px rgba(22, 163, 74, 0.5); }
        .timer-inactive { background-color: #374151 !important; color: #9ca3af !important; }
    </style>
</head>
<body class="bg-gray-50 h-screen font-sans text-gray-800 flex flex-col overflow-hidden">

    <div id="promoModal" class="fixed inset-0 bg-black/80 z-[10020] hidden flex-col items-center justify-center p-4 backdrop-blur-sm">

    <div id="pinOverlay" class="fixed inset-0 dominos-blue z-[10000] flex flex-col items-center justify-center p-6">
        <div class="text-center mb-8 text-white">
            <h1 class="font-black italic text-4xl uppercase">Domino's</h1>
            <p class="text-red-400 font-bold uppercase tracking-widest text-sm">JTM Track System</p>
        </div>
        <div class="bg-white p-8 rounded-[2.5rem] shadow-2xl w-full max-w-sm text-center">
            <select id="selectUser" class="w-full p-4 bg-gray-100 rounded-2xl mb-4 font-bold text-blue-900 outline-none uppercase text-xs"></select>
            <input type="password" id="inputPin" maxlength="4" placeholder="PIN 4 DIGIT" inputmode="numeric" class="w-full text-center text-2xl font-black p-4 bg-gray-100 rounded-2xl mb-6 outline-none">
            <button onclick="prosesLogin()" class="w-full dominos-red text-white py-4 rounded-2xl font-black uppercase shadow-lg">Masuk</button>

    <div id="mainContent" style="display:none;" class="flex flex-col h-full">
        <nav class="dominos-blue p-4 text-white shadow-md flex justify-between items-center">

                        <div class="flex flex-col flex-1">

                            <span class="text-[8px] font-bold text-gray-400 uppercase">Multiplayer Engine</span>

                    <div class="w-10"></div>

            <div id="page-chess-game" class="page bg-[#161512] flex-col pb-20 justify-center">
                <div class="flex-1 flex flex-col justify-center items-center px-4 max-w-lg mx-auto w-full relative">
                    <div class="w-full flex justify-between items-center mb-3">
                        <div class="flex items-center gap-3">
                            <img id="chessOpponentAvatar" class="w-10 h-10 rounded bg-gray-700 object-cover">
                            <span id="chessOpponentName" class="font-black text-gray-200 text-sm">Opponent</span>
                        </div>
                        <div id="chessOpponentTimerBox" class="timer-inactive px-4 py-2 rounded font-mono font-bold text-lg">

                    <div id="chessBoard" class="chess-container shadow-2xl"></div>

                    <div class="w-full flex justify-between items-center mt-3">
                        <div class="flex items-center gap-3">
                            <img id="chessMyAvatar" class="w-10 h-10 rounded bg-emerald-600 object-cover">
                            <div class="flex flex-col">
                                <span class="font-black text-white text-sm" id="myChessNameDisplay">Anda</span>
                                <span class="text-[9px] text-gray-500 font-bold" id="myChessColorLabel">White</span>
                            </div>
                        </div>
                        <div id="chessMyTimerBox" class="timer-inactive px-4 py-2 rounded font-mono font-bold text-lg">
                            <span id="chessMyTime">10:00</span>
                        </div>
                    </div>

            </div>
        </main>

    <script>
        const pieceIcons = {
            'w': { 
                'p': 'https://chessboardjs.com/img/chesspieces/wikipedia/wP.png', 
                'n': 'https://chessboardjs.com/img/chesspieces/wikipedia/wN.png', 
                'b': 'https://chessboardjs.com/img/chesspieces/wikipedia/wB.png', 
                'r': 'https://chessboardjs.com/img/chesspieces/wikipedia/wR.png', 
                'q': 'https://chessboardjs.com/img/chesspieces/wikipedia/wQ.png', 
                'k': 'https://chessboardjs.com/img/chesspieces/wikipedia/wK.png' 
            },
            'b': { 
                'p': 'https://chessboardjs.com/img/chesspieces/wikipedia/bP.png', 
                'n': 'https://chessboardjs.com/img/chesspieces/wikipedia/bN.png', 
                'b': 'https://chessboardjs.com/img/chesspieces/wikipedia/bB.png', 
                'r': 'https://chessboardjs.com/img/chesspieces/wikipedia/bR.png', 
                'q': 'https://chessboardjs.com/img/chesspieces/wikipedia/bQ.png', 
                'k': 'https://chessboardjs.com/img/chesspieces/wikipedia/bK.png' 
            }
        };

        let chess = new Chess();
        let currentChessGameId = null;
        let myChessColor = 'w';
        let chessOpponent = "";
        let selectedSquare = null;
        let chessSyncListener = null;
        let chessTimerInterval = null;
        
        let wTime = 10 * 60;
        let bTime = 10 * 60;
        let lastTimestamp = 0;

        const firebaseConfig = { 
            apiKey: "AIzaSyAZ7twf8SbcK-HqniDmVqT6k8IM3ehFtgc", 
            databaseURL: "https://trackcust-jtm-default-rtdb.asia-southeast1.firebasedatabase.app", 
            projectId: "trackcust-jtm" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        let currentUser = localStorage.getItem('jtm_user') || "";
        let sessionID = Math.random().toString(36).substring(2, 15);

        window.onload = () => {
            if(currentUser) bukaApp(currentUser);
            listenToChessChallenges();
        };

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-'+id));
            if(id === 'chess-lobby') renderChessOnlineList();
            if(id !== 'chess-game' && chessTimerInterval) clearInterval(chessTimerInterval);
        }

        function bukaApp(n) {
            currentUser = n; localStorage.setItem('jtm_user', n);
            document.getElementById('userDisplay').innerText = n;
            document.getElementById('userNameFull').innerText = n;
            document.getElementById('pinOverlay').style.display = "none"; 
            document.getElementById('mainContent').style.display = "flex";
            
            const savedPic = localStorage.getItem('profile_pic_' + currentUser) || `https://ui-avatars.com/api/?name=${n}&background=006491&color=fff`;
            document.getElementById('userAvatar').src = savedPic;
            document.getElementById('navUserAvatar').src = savedPic; 
            document.getElementById('navUserAvatar').classList.remove('hidden');

            db.ref('presence/' + n).set({ online: true, session: sessionID, lastActive: Date.now(), photo: savedPic });
            db.ref('presence/' + n).onDisconnect().remove();
        }

        function renderChessOnlineList() {
            db.ref('presence').once('value', snapshot => {
                const list = document.getElementById('chessOnlineList');
                list.innerHTML = "";
                snapshot.forEach(child => {
                    const usr = child.key;
                    if(usr !== currentUser) {
                        const avatar = child.val().photo || `https://ui-avatars.com/api/?name=${usr}&background=16a34a&color=fff`;
                        list.innerHTML += `
                            <div class="flex justify-between items-center bg-gray-700/50 p-3 rounded-2xl border border-gray-600">
                                <div class="flex items-center gap-3">
                                    <img src="${avatar}" class="w-10 h-10 rounded-full object-cover">
                                    <span class="font-bold text-white text-sm">${usr}</span>
                                </div>
                                <button onclick="sendChessChallenge('${usr}')" class="bg-emerald-600 text-white px-4 py-2 rounded-xl text-xs font-black">Tantang</button>
                            </div>
                        `;
                    }
                });
            });
        }

        function sendChessChallenge(opponent) {
            const challengeId = `chal_${currentUser}_${Date.now()}`;
            db.ref(`chess_challenges/${opponent}`).set({ from: currentUser, id: challengeId, timestamp: Date.now() });
            showAlert(`Menunggu ${opponent}...`, "blue");
            
            db.ref(`chess_challenges/${opponent}`).on('value', snap => {
                const val = snap.val();
                if(val && val.status === 'accepted') {
                    db.ref(`chess_challenges/${opponent}`).off();
                    initChessGame(val.gameId, 'w', opponent);
                }
            });
        }

        function listenToChessChallenges() {
            if(!currentUser) return;
            db.ref(`chess_challenges/${currentUser}`).on('value', snap => {
                const chal = snap.val();
                if(chal && !chal.status && (Date.now() - chal.timestamp < 30000)) {
                    document.getElementById('challengerName').innerText = chal.from;
                    document.getElementById('challengeModal').style.display = 'flex';
                } else {
                    document.getElementById('challengeModal').style.display = 'none';
                }
            });
        }

        function acceptChallenge() {
            db.ref(`chess_challenges/${currentUser}`).once('value', snap => {
                const chal = snap.val();
                if(chal) {
                    const gameId = `game_${Date.now()}`;
                    db.ref(`chess_games/${gameId}`).set({
                        fen: 'start', turn: 'w', white: chal.from, black: currentUser,
                        lastMove: null, wTime: 600, bTime: 600, lastUpdate: Date.now(), status: 'active'
                    }).then(() => {
                        db.ref(`chess_challenges/${currentUser}`).update({ status: 'accepted', gameId: gameId });
                        initChessGame(gameId, 'b', chal.from);
                    });
                }
            });
        }

        function initChessGame(gameId, color, opponentName) {
            currentChessGameId = gameId; myChessColor = color; chessOpponent = opponentName;
            chess = new Chess();
            selectedSquare = null; wTime = 600; bTime = 600; lastTimestamp = Date.now();
            if (chessTimerInterval) clearInterval(chessTimerInterval);
            
            document.getElementById('myChessNameDisplay').innerText = currentUser;
            document.getElementById('myChessColorLabel').innerText = color === 'w' ? 'WHITE' : 'BLACK';
            document.getElementById('chessOpponentName').innerText = opponentName;
            document.getElementById('chessMyAvatar').src = localStorage.getItem('profile_pic_' + currentUser) || `https://ui-avatars.com/api/?name=${currentUser}&background=16a34a&color=fff`;
            
            showPage('chess-game');
            
            if(chessSyncListener) db.ref(`chess_games/${currentChessGameId}`).off('value', chessSyncListener);
            
            chessSyncListener = db.ref(`chess_games/${currentChessGameId}`).on('value', snap => {
                const game = snap.val();
                if(!game) return;
                
                if(game.status === 'ended') {
                    if (chessTimerInterval) clearInterval(chessTimerInterval);
                    const pemenang = game.winner ? (game.winner === 'w' ? game.white : game.black) : 'Seri';
                    showAlert(`Game Selesai! Pemenang: ${pemenang} (${game.reason || 'Selesai'})`, "blue");
                    return;
                }

                if(game.fen !== 'start' && game.fen !== chess.fen()) {
                    chess.load(game.fen);
                }
                
                wTime = game.wTime; bTime = game.bTime; lastTimestamp = game.lastUpdate;
                renderChessBoard(game.lastMove);
                updateTurnIndicators();
                startLocalTimer(); 
            });
        }

        // Fungsi Hitung Mundur Waktu Aktif & Responsif
        function startLocalTimer() {
            if (chessTimerInterval) clearInterval(chessTimerInterval);
            
            chessTimerInterval = setInterval(() => {
                if (!currentChessGameId) {
                    clearInterval(chessTimerInterval);
                    return;
                }
                
                const elapsed = Math.floor((Date.now() - lastTimestamp) / 1000);
                let liveWTime = wTime;
                let liveBTime = bTime;
                
                if (chess.turn() === 'w') {
                    liveWTime = Math.max(0, wTime - elapsed);
                    if (liveWTime === 0 && chess.turn() === myChessColor) {
                        handleTimeOut('w');
                    }
                } else {
                    liveBTime = Math.max(0, bTime - elapsed);
                    if (liveBTime === 0 && chess.turn() === myChessColor) {
                        handleTimeOut('b');
                    }
                }
                
                displayTimes(liveWTime, liveBTime);
            }, 250);
        }

        function displayTimes(whiteSecs, blackSecs) {
            const format = (s) => {
                const mins = Math.floor(s / 60);
                const secs = s % 60;
                return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            };
            
            const myTimeEl = document.getElementById('chessMyTime');
            const oppTimeEl = document.getElementById('chessOpponentTime');
            
            if (myChessColor === 'w') {
                myTimeEl.innerText = format(whiteSecs);
                oppTimeEl.innerText = format(blackSecs);
            } else {
                myTimeEl.innerText = format(blackSecs);
                oppTimeEl.innerText = format(whiteSecs);
            }
        }

        function handleTimeOut(loserColor) {
            clearInterval(chessTimerInterval);
            db.ref(`chess_games/${currentChessGameId}`).update({
                status: 'ended',
                winner: loserColor === 'w' ? 'b' : 'w',
                reason: 'Waktu Habis (Timeout)'
            });
        }

        function renderChessBoard(lastMoveObj = null) {
            const boardEl = document.getElementById('chessBoard');
            boardEl.innerHTML = '';
            const board = chess.board();
            
            const rows = myChessColor === 'w' ? [0,1,2,3,4,5,6,7] : [7,6,5,4,3,2,1,0];
            const cols = myChessColor === 'w' ? [0,1,2,3,4,5,6,7] : [7,6,5,4,3,2,1,0];
            
            const legalMoves = selectedSquare ? chess.moves({ square: selectedSquare, verbose: true }) : [];

            rows.forEach((r) => {
                cols.forEach((c) => {
                    const sq = String.fromCharCode(97 + c) + (8 - r);
                    const piece = board[r][c];
                    const isLight = (r + c) % 2 === 0;
                    
                    const sqEl = document.createElement('div');
                    sqEl.className = `chess-sq ${isLight ? 'chess-light' : 'chess-dark'}`;
                    sqEl.onclick = () => handleSquareClick(sq);
                    
                    if(selectedSquare === sq) sqEl.innerHTML += `<div class="chess-hl"></div>`;
                    
                    const moveMatch = legalMoves.find(m => m.to === sq);
                    if(moveMatch) sqEl.innerHTML += `<div class="chess-legal-dot"></div>`;

                    if (piece) {
                        const img = document.createElement('img');
                        img.src = pieceIcons[piece.color][piece.type];
                        img.className = 'chess-piece';
                        sqEl.appendChild(img);
                    }
                    boardEl.appendChild(sqEl);
                });
            });
        }

        function handleSquareClick(sq) {
            if(chess.turn() !== myChessColor) return;
            const piece = chess.get(sq);
            
            if(piece && piece.color === myChessColor) {
                selectedSquare = sq;
                renderChessBoard();
                return;
            }
            
            if(selectedSquare) {
                const moves = chess.moves({ square: selectedSquare, verbose: true });
                const move = moves.find(m => m.to === sq);
                if(move) {
                    const elapsed = Math.floor((Date.now() - lastTimestamp) / 1000);
                    if (myChessColor === 'w') {
                        wTime = Math.max(0, wTime - elapsed);
                    } else {
                        bTime = Math.max(0, bTime - elapsed);
                    }

                    chess.move(move);
                    
                    let gameStatus = 'active';
                    let winner = null;
                    let reason = null;
                    
                    if (chess.in_checkmate()) {
                        gameStatus = 'ended';
                        winner = myChessColor;
                        reason = 'Skakmat (Checkmate)';
                    } else if (chess.in_draw() || chess.in_stalemate()) {
                        gameStatus = 'ended';
                        reason = 'Remis (Draw)';
                    }

                    db.ref(`chess_games/${currentChessGameId}`).update({
                        fen: chess.fen(), turn: chess.turn(), lastMove: move,
                        wTime: wTime, bTime: bTime, lastUpdate: Date.now(),
                        status: gameStatus, winner: winner, reason: reason
                    });
                    selectedSquare = null;
                }
            }
        }

        function updateTurnIndicators() {
            const isMyTurn = chess.turn() === myChessColor;
            const myTimer = document.getElementById('chessMyTimerBox');
            const oppTimer = document.getElementById('chessOpponentTimerBox');
            if(isMyTurn) {
                myTimer.className = 'timer-active px-4 py-2 rounded font-mono font-bold text-lg';
                oppTimer.className = 'timer-inactive px-4 py-2 rounded font-mono font-bold text-lg';
            } else {
                myTimer.className = 'timer-inactive px-4 py-2 rounded font-mono font-bold text-lg';
                oppTimer.className = 'timer-active px-4 py-2 rounded font-mono font-bold text-lg';
            }
        }

        function showAlert(msg, color) {
            const alertBox = document.getElementById('chessAlert');
            alertBox.innerText = msg;
            alertBox.style.display = 'flex';
            setTimeout(() => { alertBox.style.display = 'none'; }, 3000);
        }
    </script>
</body>
</html>
