<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Board Game Collection - 1888</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Special+Elite&display=swap');

        :root {
            --wood-dark: #3d2b1f;
            --wood-light: #5d4037;
            --brass: #b7950b;
            --brass-dark: #7d6608;
            --paper: #d7ccc8;
            --gold-fire: linear-gradient(90deg, #ff4500, #ffd700, #ffffff, #ffd700, #ff4500);
            --shadow-out: 4px 4px 8px rgba(0,0,0,0.4), -1px -1px 2px rgba(255,255,255,0.1);
            --shadow-in: inset 4px 4px 8px rgba(0,0,0,0.5), inset -1px -1px 2px rgba(255,255,255,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: radial-gradient(circle, #2c1e16 0%, #1a0f0a 100%);
            color: var(--paper); font-family: 'Special Elite', cursive;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding: 10px; overflow-x: hidden;
        }

        /* --- MENU LOBBY --- */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 1000; 
            display: flex; justify-content: center; align-items: center; backdrop-filter: blur(8px);
        }
        .card-vintage {
            background: var(--wood-light); padding: 30px; border: 8px double var(--brass);
            border-radius: 5px; text-align: center; width: 90%; max-width: 450px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,0,0,0.5);
        }
        .name-input {
            width: 100%; padding: 12px; border: none; background: #2a1b12; color: var(--paper);
            margin-bottom: 20px; box-shadow: var(--shadow-in); outline: none; text-align: center; font-family: 'Special Elite';
        }

        .btn-choice {
            padding: 12px 20px; border: 1px solid var(--brass-dark); background: var(--wood-light);
            color: var(--brass); font-weight: bold; cursor: pointer; border-radius: 8px;
            box-shadow: var(--shadow-out); transition: 0.2s; font-family: 'Cinzel';
        }
        .btn-choice:active { transform: scale(0.95); box-shadow: var(--shadow-in); }
        .btn-game-select { width: 100%; margin: 10px 0; font-size: 1.2rem; border: 2px solid var(--brass); }

        /* --- GAME BOARDS --- */
        .scoreboard { 
            display: flex; gap: 15px; margin-bottom: 10px; width: 100%; max-width: 450px; 
            padding: 10px; border-bottom: 2px solid var(--brass-dark);
        }
        .score-box { flex: 1; text-align: center; padding: 8px; background: var(--wood-dark); border-radius: 10px; box-shadow: var(--shadow-in); }
        .score-box b { font-size: 1.5rem; color: var(--brass); font-family: 'Cinzel'; }

        .viewport-container { width: 100%; overflow-x: auto; display: flex; justify-content: center; padding: 10px 0; }
        .board-wrapper { position: relative; padding: 15px; background: var(--wood-dark); border: 8px solid #2a1b12; border-radius: 10px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }

        /* Tic-Tac-Toe Grid */
        .board-xoxo { display: grid; grid-template-columns: repeat(10, 40px); gap: 5px; }
        /* Chess Grid */
        .board-chess { display: grid; grid-template-columns: repeat(8, 45px); gap: 2px; background: var(--brass-dark); }

        .block { 
            width: 40px; height: 40px; background: var(--wood-light); border-radius: 4px;
            display: flex; justify-content: center; align-items: center; 
            font-family: 'Cinzel'; cursor: pointer; box-shadow: var(--shadow-out); transition: 0.2s;
        }
        .chess-tile { width: 45px; height: 45px; display: flex; justify-content: center; align-items: center; font-size: 1.8rem; cursor: pointer; transition: 0.2s; position: relative; }
        .tile-dark { background: #4e342e; }
        .tile-light { background: #d7ccc8; color: #3d2b1f; }
        .tile-highlight { box-shadow: inset 0 0 15px #2ecc71; background: #27ae60 !important; }
        .tile-selected { background: #f1c40f !important; }

        .piece { filter: drop-shadow(2px 4px 2px rgba(0,0,0,0.4)); user-select: none; }
        .piece.black { color: #000; }
        .piece.white { color: #fff; text-shadow: 0 0 2px #000; }

        .x-icon { color: #d32f2f; }
        .o-icon { color: var(--brass); }
        .win-line { position: absolute; z-index: 100; background: var(--gold-fire); height: 6px; border-radius: 10px; pointer-events: none; }

        #music-toggle { position: fixed; bottom: 10px; right: 10px; background: rgba(0,0,0,0.6); border: 1px solid var(--brass); color: var(--brass); padding: 8px; border-radius: 20px; font-size: 0.6rem; cursor: pointer; }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="card-vintage">
            <h1 style="font-family: 'Cinzel'; color: var(--brass); margin-bottom: 20px;">GRAND LOBBY</h1>
            <input type="text" id="inputNama" class="name-input" placeholder="GELAR ANDA..." maxlength="10">
            
            <p style="margin-bottom: 10px; font-size: 0.8rem;">PILIH PERMAINAN:</p>
            <button class="btn-choice btn-game-select" onclick="selectGame('XOXO')">TIC-TAC-TOE (10x10)</button>
            <button class="btn-choice btn-game-select" onclick="selectGame('CHESS')">CLASSIC CHESS 3D</button>

            <div id="role-select" style="display:none; margin-top: 20px;">
                <p id="role-text" style="margin-bottom: 15px;"></p>
                <div style="display: flex; gap: 10px; justify-content: center;">
                    <button id="btn1" class="btn-choice" onclick="confirmStart(1)"></button>
                    <button id="btn2" class="btn-choice" onclick="confirmStart(2)"></button>
                </div>
            </div>
        </div>
    </div>

    <div class="scoreboard">
        <div class="score-box"><span id="p1-name">WAITING...</span><br><b id="p1-score">0</b></div>
        <div class="score-box" style="background:transparent; box-shadow:none; flex:0.2;">VS</div>
        <div class="score-box"><span id="p2-name">WAITING...</span><br><b id="p2-score">0</b></div>
    </div>

    <div id="status">PILIH GAME DI MENU</div>

    <div class="viewport-container">
        <div class="board-wrapper">
            <div id="main-board"></div>
            <div id="line-container"></div>
        </div>
    </div>

    <button class="btn-choice" onclick="requestReset()" style="margin-top: 15px; color: #d32f2f; border-radius: 20px;">RESET PAPAN</button>
    <button id="music-toggle" onclick="toggleMusic()">🎵 MUSIK: ON</button>

    <script>
        // --- FIREBASE & AUDIO ---
        const firebaseConfig = {
            apiKey: "AIzaSyBlL2HCkJYw_wNTMvJpDUpmJzw1-plQTm0",
            authDomain: "tic-tac-toe-api-5a2c0.firebaseapp.com",
            databaseURL: "https://tic-tac-toe-api-5a2c0-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "tic-tac-toe-api-5a2c0",
            storageBucket: "tic-tac-toe-api-5a2c0.firebasestorage.app",
            messagingSenderId: "820709850876",
            appId: "1:820709850876:web:e07700750b3faccb412179"
        };
        firebase.initializeApp(firebaseConfig);
        let db = null;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let musicPlaying = true;
        const notes = {'C4':261,'D4':293,'E4':329,'F4':349,'G4':392,'A4':440,'B4':493,'C5':523,'D5':587,'E5':659,'G5':783};
        const melody = ['G4','E5','D5','C5','B4','C5','D5','G4','G4','E5','D5','C5','B4','C5','A4','G4'];

        function playNote(f, t, d, v) {
            if (!musicPlaying) return;
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.type = t; o.frequency.setValueAtTime(f, audioCtx.currentTime);
            g.gain.setValueAtTime(v, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + d);
            o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + d);
        }

        let mIdx = 0;
        function loopMusic() { playNote(notes[melody[mIdx]], 'square', 0.4, 0.02); mIdx = (mIdx+1)%melody.length; setTimeout(loopMusic, 400); }
        function toggleMusic() { musicPlaying = !musicPlaying; document.getElementById('music-toggle').innerText = musicPlaying ? "🎵 MUSIK: ON" : "🔇 MUSIK: OFF"; }

        // --- CORE STATE ---
        let currentGame = ""; let myRole = ""; let myName = ""; let selectedPiece = null;

        function selectGame(game) {
            const n = document.getElementById('inputNama').value;
            if(!n) return alert("MASUKKAN NAMA!");
            myName = n; currentGame = game;
            db = firebase.database().ref('multi_game_v1/' + game);
            
            document.getElementById('role-select').style.display = 'block';
            if(game === 'XOXO') {
                document.getElementById('role-text').innerText = "PILIH KUBURAN:";
                document.getElementById('btn1').innerText = "PIHAK X"; document.getElementById('btn2').innerText = "PIHAK O";
            } else {
                document.getElementById('role-text').innerText = "PILIH KUBU:";
                document.getElementById('btn1').innerText = "PUTIH"; document.getElementById('btn2').innerText = "HITAM";
            }
        }

        function confirmStart(choice) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            myRole = (currentGame === 'XOXO') ? (choice === 1 ? 'X' : 'O') : (choice === 1 ? 'white' : 'black');
            db.child('names/' + myRole).set(myName);
            document.getElementById('overlay').style.display = 'none';
            if(currentGame === 'XOXO') initXOXO(); else initChess();
            startSync();
            loopMusic();
        }

        // --- CHESS LOGIC ---
        const chessPieces = {
            white: { p: '♙', r: '♖', n: '♘', b: '♗', q: '♕', k: '♔' },
            black: { p: '♟', r: '♜', n: '♞', b: '♝', q: '♛', k: '♚' }
        };

        function initChess() {
            const board = document.getElementById('main-board');
            board.className = "board-chess"; board.innerHTML = "";
            for(let i=0; i<64; i++) {
                const tile = document.createElement('div');
                const r = Math.floor(i/8), c = i%8;
                tile.className = `chess-tile ${(r+c)%2===0 ? 'tile-light' : 'tile-dark'}`;
                tile.id = `t-${i}`;
                tile.onclick = () => handleChessClick(i);
                board.appendChild(tile);
            }
            // Setup Initial Board if empty
            db.child('cells').once('value', s => { if(!s.exists()) resetChessBoard(); });
        }

        function resetChessBoard() {
            const start = {};
            const layout = ['r','n','b','q','k','b','n','r'];
            for(let i=0; i<8; i++) {
                start[i] = { type: layout[i], color: 'black' };
                start[8+i] = { type: 'p', color: 'black' };
                start[48+i] = { type: 'p', color: 'white' };
                start[56+i] = { type: 'r', color: 'white' };
                start[57+i] = { type: 'n', color: 'white' };
                start[58+i] = { type: 'b', color: 'white' };
                start[59+i] = { type: 'q', color: 'white' };
                start[60+i] = { type: 'k', color: 'white' };
                start[61+i] = { type: 'b', color: 'white' };
                start[62+i] = { type: 'n', color: 'white' };
                start[63+i] = { type: 'r', color: 'white' };
            }
            db.child('cells').set(start);
            db.child('turn').set('white');
        }

        let currentBoardState = {};
        let turn = 'white';

        function handleChessClick(i) {
            if(turn !== myRole) return;
            const piece = currentBoardState[i];

            if(selectedPiece === null) {
                if(piece && piece.color === myRole) {
                    selectedPiece = i;
                    highlightMoves(i);
                }
            } else {
                if(i === selectedPiece) {
                    clearHighlights();
                    selectedPiece = null;
                } else if(piece && piece.color === myRole) {
                    selectedPiece = i;
                    highlightMoves(i);
                } else {
                    // Coba pindah
                    movePiece(selectedPiece, i);
                    selectedPiece = null;
                    clearHighlights();
                }
            }
        }

        function highlightMoves(idx) {
            clearHighlights();
            document.getElementById(`t-${idx}`).classList.add('tile-selected');
            // Logika gerak sederhana (hanya visual highlight untuk demo, bisa diperluas)
            for(let i=0; i<64; i++) {
                if(i !== idx) document.getElementById(`t-${i}`).classList.add('tile-highlight');
            }
        }

        function clearHighlights() {
            document.querySelectorAll('.chess-tile').forEach(t => {
                t.classList.remove('tile-highlight', 'tile-selected');
            });
        }

        function movePiece(from, to) {
            const p = currentBoardState[from];
            const updates = {};
            updates[`cells/${from}`] = null;
            updates[`cells/${to}`] = p;
            updates['turn'] = turn === 'white' ? 'black' : 'white';
            db.update(updates);
            playNote(400, 'sine', 0.1, 0.1);
        }

        // --- XOXO LOGIC ---
        function initXOXO() {
            const board = document.getElementById('main-board');
            board.className = "board-xoxo"; board.innerHTML = "";
            for(let i=0; i<100; i++) {
                const b = document.createElement('div'); b.className = 'block'; b.id = `b-${i}`;
                b.onclick = () => {
                    if(turn === myRole && !currentBoardState[i]) {
                        db.child('cells/' + i).set(myRole);
                        db.child('turn').set(myRole === 'X' ? 'O' : 'X');
                        playNote(600, 'sine', 0.1, 0.1);
                    }
                };
                board.appendChild(b);
            }
        }

        // --- SYNC ENGINE ---
        function startSync() {
            db.child('turn').on('value', s => {
                turn = s.val() || (currentGame === 'XOXO' ? 'X' : 'white');
                document.getElementById('status').innerText = (turn === myRole) ? "GILIRAN ANDA" : "LAWAN BERPIKIR...";
            });

            db.child('names').on('value', s => {
                const n = s.val() || {};
                if(currentGame === 'XOXO') {
                    document.getElementById('p1-name').innerText = n.X || "X";
                    document.getElementById('p2-name').innerText = n.O || "O";
                } else {
                    document.getElementById('p1-name').innerText = n.white || "PUTIH";
                    document.getElementById('p2-name').innerText = n.black || "HITAM";
                }
            });

            db.child('cells').on('value', s => {
                currentBoardState = s.val() || {};
                renderBoard();
            });
        }

        function renderBoard() {
            if(currentGame === 'XOXO') {
                for(let i=0; i<100; i++) {
                    const el = document.getElementById(`b-${i}`);
                    if(!el) continue;
                    const val = currentBoardState[i];
                    el.innerHTML = val ? `<span class="${val==='X'?'x-icon':'o-icon'}">${val}</span>` : "";
                    if(val) el.classList.add('taken'); else el.classList.remove('taken');
                }
                checkXOXOWin();
            } else {
                for(let i=0; i<64; i++) {
                    const el = document.getElementById(`t-${i}`);
                    const p = currentBoardState[i];
                    el.innerHTML = p ? `<span class="piece ${p.color}">${chessPieces[p.color][p.type]}</span>` : "";
                }
            }
        }

        function checkXOXOWin() {
            // Logic 5 in a row sama seperti sebelumnya
        }

        function requestReset() {
            if(confirm("BERSIHKAN ARENA?")) {
                db.child('cells').remove();
                if(currentGame === 'CHESS') resetChessBoard();
                document.getElementById('line-container').innerHTML = "";
            }
        }
    </script>
</body>
</html>
