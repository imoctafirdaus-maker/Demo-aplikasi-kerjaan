<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Gold Edition - Audio</title>
    <style>
        :root {
            --bg-color: #e6e9ef;
            --text-color: #2d3748;
            --shadow-dark: #cbd5e0;
            --shadow-light: #ffffff;
            --border-blue: #3182ce;
            --x-grad: linear-gradient(135deg, #ff6b6b, #ee5253);
            --o-grad: linear-gradient(135deg, #48bb78, #38a169);
            --gold-grad: linear-gradient(90deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --grid-count: 10;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        /* --- OVERLAY PEMILIHAN --- */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: 0.5s;
        }

        .selection-card {
            background: var(--bg-color);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 15px 15px 30px var(--shadow-dark), -15px -15px 30px var(--shadow-light);
            text-align: center;
        }

        .choice-btns { display: flex; gap: 20px; margin-top: 30px; }
        .btn-choice {
            width: 80px; height: 80px; border-radius: 20px;
            font-size: 2rem; font-weight: 900; cursor: pointer;
            border: 3px solid var(--border-blue); background: var(--bg-color);
            box-shadow: 5px 5px 10px var(--shadow-dark);
            transition: 0.2s;
        }

        /* --- SCOREBOARD --- */
        .scoreboard { display: flex; gap: 20px; margin-bottom: 20px; width: 100%; max-width: 400px; }
        .score-item {
            flex: 1; background: var(--bg-color); padding: 15px; border-radius: 20px;
            text-align: center; box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
        }
        .score-val { font-size: 1.5rem; font-weight: 900; display: block; }

        .status-card {
            background: var(--bg-color); padding: 10px 30px; border-radius: 50px;
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            margin-bottom: 20px; font-weight: 800;
        }

        /* --- BOARD --- */
        .viewport-container {
            width: 100%; overflow-x: auto; padding: 10px 0;
            display: flex; justify-content: flex-start;
            -webkit-overflow-scrolling: touch;
        }
        @media (min-width: 650px) { .viewport-container { justify-content: center; } }

        .board-wrapper { perspective: 1500px; position: relative; padding: 20px; }
        .board {
            display: grid; grid-template-columns: repeat(var(--grid-count), 1fr);
            gap: 10px; padding: 20px; background: var(--bg-color); border-radius: 25px;
            box-shadow: 15px 15px 30px var(--shadow-dark), -15px -15px 30px var(--shadow-light);
            width: calc((50px * var(--grid-count)) + (10px * (var(--grid-count) - 1)) + 40px);
            transform: rotateX(5deg);
        }

        .block {
            width: 50px; height: 50px; background: var(--bg-color); border-radius: 10px;
            border: 2px solid var(--border-blue); display: flex; justify-content: center;
            align-items: center; font-size: 1.5rem; font-weight: 900;
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            cursor: pointer; transition: 0.1s; -webkit-tap-highlight-color: transparent;
        }
        .block:active { transform: scale(0.9); }
        .block.taken { box-shadow: inset 3px 3px 6px var(--shadow-dark); border-color: #cbd5e0; }

        .x-color { background: var(--x-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .o-color { background: var(--o-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* WIN LINE */
        .win-line {
            position: absolute; z-index: 10; background: var(--gold-grad);
            height: 10px; border-radius: 10px; box-shadow: 0 0 15px rgba(184, 134, 11, 0.6);
            transform-origin: 0 50%; pointer-events: none;
            animation: draw 0.8s ease-out forwards, shimmer 2s infinite linear;
            background-size: 200% auto;
        }
        @keyframes draw { from { width: 0; } }
        @keyframes shimmer { to { background-position: 200% center; } }
        .winner-cell { background: #fffdf0 !important; border-color: #ffd700 !important; transform: scale(1.05); }

        button.reset {
            margin-top: 20px; padding: 15px 40px; border: none; border-radius: 50px;
            background: var(--bg-color); box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            color: var(--border-blue); font-weight: 800; cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="selection-card">
            <h2>PILIH SIMBOL</h2>
            <div class="choice-btns">
                <button class="btn-choice x-color" onclick="startGame('X')">X</button>
                <button class="btn-choice o-color" onclick="startGame('O')">O</button>
            </div>
        </div>
    </div>

    <div class="scoreboard">
        <div class="score-item">
            <small>PLAYER 1 (X)</small>
            <span class="score-val x-color" id="score1">0</span>
        </div>
        <div class="score-item">
            <small>PLAYER 2 (O)</small>
            <span class="score-val o-color" id="score2">0</span>
        </div>
    </div>

    <div class="status-card" id="status-box">
        Giliran: <span class="x-color" id="active-player">X</span>
    </div>

    <div class="viewport-container">
        <div class="board-wrapper">
            <div class="board" id="game-board"></div>
            <div id="line-container"></div>
        </div>
    </div>

    <button class="reset" onclick="resetBoard()">Ulang Game</button>

    <script>
        // --- AUDIO ENGINE ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(freq, type, duration, vol) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playClickSound() {
            playSound(400, 'sine', 0.1, 0.1);
        }

        function playWinSound() {
            const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
            notes.forEach((freq, i) => {
                setTimeout(() => playSound(freq, 'triangle', 0.5, 0.1), i * 150);
            });
        }

        // --- GAME LOGIC ---
        const GRID_SIZE = 10;
        const WIN_COUNT = 5;
        let currentPlayer = 'X';
        let gameState = [];
        let gameActive = false;
        let scores = { X: 0, O: 0 };

        const boardElement = document.getElementById('game-board');
        const lineContainer = document.getElementById('line-container');
        const overlay = document.getElementById('overlay');

        document.documentElement.style.setProperty('--grid-count', GRID_SIZE);

        function startGame(choice) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            playClickSound();
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 500);
            resetBoard();
        }

        function resetBoard() {
            gameActive = true;
            currentPlayer = 'X';
            gameState = Array(GRID_SIZE * GRID_SIZE).fill("");
            document.getElementById('status-box').innerHTML = `Giliran: <span class="x-color" id="active-player">X</span>`;
            updateStatus();
            lineContainer.innerHTML = "";
            boardElement.innerHTML = "";
            for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
                const block = document.createElement('div');
                block.classList.add('block');
                block.setAttribute('data-index', i);
                block.onclick = () => handleMove(i, block);
                boardElement.appendChild(block);
            }
        }

        function handleMove(index, el) {
            if (gameState[index] !== "" || !gameActive) return;

            playClickSound();
            gameState[index] = currentPlayer;
            el.innerHTML = `<span class="${currentPlayer === 'X' ? 'x-color' : 'o-color'}">${currentPlayer}</span>`;
            el.classList.add('taken');

            const winData = checkWin(index);
            if (winData) {
                gameActive = false;
                scores[currentPlayer]++;
                updateScoreDisplay();
                playWinSound();
                drawWin(winData.cells);
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            updateStatus();
        }

        function updateStatus() {
            const activeSpan = document.getElementById('active-player');
            if(activeSpan) {
                activeSpan.textContent = currentPlayer;
                activeSpan.className = currentPlayer === 'X' ? 'x-color' : 'o-color';
            }
        }

        function updateScoreDisplay() {
            document.getElementById('score1').textContent = scores['X'];
            document.getElementById('score2').textContent = scores['O'];
        }

        function checkWin(index) {
            const row = Math.floor(index / GRID_SIZE);
            const col = index % GRID_SIZE;
            const dirs = [{x:1,y:0},{x:0,y:1},{x:1,y:1},{x:1,y:-1}];
            for (let d of dirs) {
                let cells = [index];
                [1, -1].forEach(s => {
                    let r = row+(d.y*s), c = col+(d.x*s);
                    while(r>=0 && r<GRID_SIZE && c>=0 && c<GRID_SIZE && gameState[r*GRID_SIZE+c] === currentPlayer) {
                        cells.push(r*GRID_SIZE+c);
                        r+=(d.y*s); c+=(d.x*s);
                    }
                });
                if (cells.length >= WIN_COUNT) return { cells };
            }
            return null;
        }

        function drawWin(cells) {
            cells.sort((a,b) => a-b);
            cells.forEach(idx => document.querySelector(`[data-index="${idx}"]`).classList.add('winner-cell'));
            const bRect = boardElement.getBoundingClientRect();
            const start = document.querySelector(`[data-index="${cells[0]}"]`).getBoundingClientRect();
            const end = document.querySelector(`[data-index="${cells[cells.length-1]}"]`).getBoundingClientRect();
            const x1 = (start.left + start.width/2) - bRect.left;
            const y1 = (start.top + start.height/2) - bRect.top;
            const x2 = (end.left + end.width/2) - bRect.left;
            const y2 = (end.top + end.height/2) - bRect.top;
            const dist = Math.sqrt(Math.pow(x2-x1, 2) + Math.pow(y2-y1, 2));
            const angle = Math.atan2(y2-y1, x2-x1) * 180 / Math.PI;
            const line = document.createElement('div');
            line.className = 'win-line';
            line.style.left = `${x1}px`; line.style.top = `${y1}px`;
            line.style.width = `${dist}px`; line.style.transform = `rotate(${angle}deg)`;
            lineContainer.appendChild(line);
            document.getElementById('status-box').innerHTML = `<span style="background:var(--gold-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent">${currentPlayer} MENANG!</span>`;
        }
    </script>
</body>
</html>
