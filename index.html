<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tic-Tac-Toe: Antique Edition</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Special+Elite&display=swap');

        :root {
            --wood-dark: #3d2b1f;
            --wood-light: #5d4037;
            --brass: #b7950b;
            --brass-dark: #7d6608;
            --paper: #d7ccc8;
            --gold-fire: linear-gradient(90deg, #ff4500, #ffd700, #ffffff, #ffd700, #ff4500);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: radial-gradient(circle, #2c1e16 0%, #1a0f0a 100%);
            color: var(--paper);
            font-family: 'Special Elite', cursive;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding: 10px;
            overflow-x: hidden;
        }

        /* --- VINTAGE OVERLAY --- */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 1000; 
            display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }
        .card-vintage {
            background: var(--wood-light);
            padding: 30px; border: 8px double var(--brass);
            border-radius: 5px; text-align: center; width: 90%; max-width: 400px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,0,0,0.5);
        }
        .card-vintage h2 { font-family: 'Cinzel', serif; color: var(--brass); margin-bottom: 20px; }

        input.name-input {
            width: 100%; padding: 12px; border: 2px solid var(--brass-dark);
            background: #2a1b12; color: var(--paper); margin-bottom: 20px;
            outline: none; font-family: 'Special Elite'; text-align: center;
        }

        .btn-choice {
            padding: 15px; border: 2px solid var(--brass);
            background: linear-gradient(145deg, #7d6608, #b7950b);
            color: #2c1e16; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px #4d3d04; transition: 0.2s; width: 110px;
        }
        .btn-choice:active:not(.disabled) { transform: translateY(4px); box-shadow: none; }
        .btn-choice.disabled { background: #333; color: #666; border-color: #444; cursor: not-allowed; box-shadow: none; }
        .taken-label { font-size: 0.7rem; margin-top: 8px; color: var(--paper); opacity: 0.7; }

        /* --- UI COMPONENTS --- */
        .scoreboard { 
            display: flex; gap: 15px; margin-bottom: 20px; width: 100%; max-width: 450px; 
            padding: 10px; border-bottom: 2px solid var(--brass-dark);
        }
        .score-box { 
            flex: 1; text-align: center; padding: 10px;
            background: rgba(0,0,0,0.3); border: 1px solid var(--brass-dark);
        }
        .score-box b { font-size: 1.8rem; color: var(--brass); font-family: 'Cinzel', serif; }

        .viewport-container { width: 100%; overflow-x: auto; display: flex; justify-content: center; padding: 15px 0; }
        
        .board-wrapper { 
            position: relative; padding: 15px; 
            background: var(--wood-dark);
            border: 12px solid #2a1b12;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 0 30px rgba(0,0,0,0.5);
        }
        
        .board { 
            display: grid; grid-template-columns: repeat(10, 42px); gap: 2px;
            background: var(--brass-dark); /* Grid lines color */
            border: 2px solid var(--brass-dark);
        }

        .block { 
            width: 42px; height: 42px; 
            background: var(--wood-light);
            display: flex; justify-content: center; align-items: center; 
            font-family: 'Cinzel', serif; font-weight: 900; font-size: 1.4rem;
            cursor: pointer; transition: 0.1s;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }
        .block:hover { background: #6d4c41; }
        .block.taken { background: #4e342e; }

        .x-icon { color: #d32f2f; text-shadow: 0 0 5px rgba(0,0,0,0.5); }
        .o-icon { color: var(--brass); text-shadow: 0 0 5px rgba(0,0,0,0.5); }

        /* --- EFFECTS --- */
        .win-line { 
            position: absolute; z-index: 100; background: var(--gold-fire); 
            height: 10px; border-radius: 5px; transform-origin: 0 50%; 
            pointer-events: none; box-shadow: 0 0 25px #ff4500;
            animation: draw 0.6s forwards, shimmer 1.5s infinite linear;
        }
        @keyframes draw { from { width: 0; } }
        @keyframes shimmer { to { background-position: 200% center; } }

        .reset-btn {
            margin-top: 20px; padding: 12px 25px; 
            background: transparent; border: 2px solid #d32f2f;
            color: #d32f2f; font-family: 'Special Elite'; cursor: pointer;
            transition: 0.3s;
        }
        .reset-btn:hover { background: #d32f2f; color: white; }

        #status { font-family: 'Cinzel', serif; color: var(--brass); letter-spacing: 2px; text-shadow: 0 2px 4px black; }

    </style>
</head>
<body>

    <div id="overlay">
        <div class="card-vintage">
            <h2>BOARD GAME - 1888</h2>
            <input type="text" id="inputNama" class="name-input" placeholder="NAMA ANDA..." maxlength="10">
            <div style="display: flex; gap: 20px; justify-content: center;">
                <div>
                    <button id="btnX" class="btn-choice" onclick="pickRole('X')">PILIH X</button>
                    <span id="labelX" class="taken-label">TERSEDIA</span>
                </div>
                <div>
                    <button id="btnO" class="btn-choice" onclick="pickRole('O')">PILIH O</button>
                    <span id="labelO" class="taken-label">TERSEDIA</span>
                </div>
            </div>
        </div>
    </div>

    <div class="scoreboard">
        <div class="score-box">
            <span id="nameX" style="font-size:0.8rem; color:var(--paper)">PEMAIN X</span><br>
            <b id="scoreX">0</b>
        </div>
        <div class="score-box" style="border-color: #d32f2f; opacity: 0.5;">
            <span style="font-size: 0.6rem;">VS</span>
        </div>
        <div class="score-box">
            <span id="nameO" style="font-size:0.8rem; color:var(--paper)">PEMAIN O</span><br>
            <b id="scoreO">0</b>
        </div>
    </div>

    <div id="status">SINKRONISASI...</div>

    <div class="viewport-container">
        <div class="board-wrapper">
            <div class="board" id="game-board"></div>
            <div id="line-container"></div>
        </div>
    </div>

    <button class="reset-btn" onclick="resetBoard()">MEMBERSIHKAN PAPAN</button>

    <script>
        // LOGIKA TETAP SAMA (FIREBASE CONFIG)
        const firebaseConfig = {
            apiKey: "AIzaSyBlL2HCkJYw_wNTMvJpDUpmJzw1-plQTm0",
            authDomain: "tic-tac-toe-api-5a2c0.firebaseapp.com",
            databaseURL: "https://tic-tac-toe-api-5a2c0-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "tic-tac-toe-api-5a2c0",
            storageBucket: "tic-tac-toe-api-5a2c0.firebasestorage.app",
            messagingSenderId: "820709850876",
            appId: "1:820709850876:web:e07700750b3faccb412179"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref('game_v4');

        let myRole = null, myName = "", currentTurn = 'X', gameActive = true, grid = Array(100).fill("");
        let xTaken = false, oTaken = false;

        db.child('names').on('value', s => {
            const names = s.val() || {};
            xTaken = !!names.X; oTaken = !!names.O;
            const bX = document.getElementById('btnX'), bO = document.getElementById('btnO');
            const lX = document.getElementById('labelX'), lO = document.getElementById('labelO');

            if(xTaken) { bX.classList.add('disabled'); bX.innerText = "PENUH"; lX.innerText = names.X; }
            else { bX.classList.remove('disabled'); bX.innerText = "PILIH X"; lX.innerText = "TERSEDIA"; }

            if(oTaken) { bO.classList.add('disabled'); bO.innerText = "PENUH"; lO.innerText = names.O; }
            else { bO.classList.remove('disabled'); bO.innerText = "PILIH O"; lO.innerText = "TERSEDIA"; }
            
            document.getElementById('nameX').innerText = names.X || "PEMAIN X";
            document.getElementById('nameO').innerText = names.O || "PEMAIN O";
        });

        function pickRole(role) {
            if((role === 'X' && xTaken) || (role === 'O' && oTaken)) { alert("Role Taken!"); return; }
            const nameIn = document.getElementById('inputNama').value;
            if(!nameIn) { alert("NAMA!"); return; }
            myName = nameIn; myRole = role;
            db.child('names/' + role).set(myName);
            document.getElementById('overlay').style.display = 'none';
            initUI(); startSync();
        }

        function initUI() {
            const board = document.getElementById('game-board');
            board.innerHTML = "";
            for (let i = 0; i < 100; i++) {
                const b = document.createElement('div');
                b.className = 'block'; b.id = `b-${i}`;
                b.onclick = () => {
                    if(gameActive && currentTurn === myRole && grid[i] === "") {
                        db.child('cells/' + i).set(myRole);
                        db.child('turn').set(myRole === 'X' ? 'O' : 'X');
                    }
                };
                board.appendChild(b);
            }
        }

        function startSync() {
            db.child('turn').on('value', s => {
                currentTurn = s.val() || 'X';
                document.getElementById('status').innerText = currentTurn === myRole ? "GILIRAN ANDA" : "LAWAN BERPIKIR...";
            });

            db.child('scores').on('value', s => {
                const sc = s.val() || {X:0, O:0};
                document.getElementById('scoreX').innerText = sc.X;
                document.getElementById('scoreO').innerText = sc.O;
            });

            db.child('cells').on('value', s => {
                const data = s.val() || {};
                grid = Array(100).fill("");
                Object.keys(data).forEach(i => {
                    grid[i] = data[i];
                    const el = document.getElementById(`b-${i}`);
                    if(el) el.innerHTML = `<span class="${grid[i]==='X'?'x-icon':'o-icon'}">${grid[i]}</span>`;
                });
                checkWin();
            });

            db.on('value', s => { if(!s.hasChild('cells')) { gameActive = true; document.getElementById('line-container').innerHTML = ""; initUI(); } });
        }

        function checkWin() {
            for (let i = 0; i < 100; i++) {
                if (grid[i] === "") continue;
                const win = getCombo(i);
                if (win) {
                    gameActive = false;
                    drawWinLine(win.cells, grid[i]);
                    if(myRole === grid[i]) db.child('scores/' + grid[i]).transaction(c => (c || 0) + 1);
                    break;
                }
            }
        }

        function getCombo(i) {
            const r = Math.floor(i / 10), c = i % 10, char = grid[i];
            const dirs = [{x:1,y:0}, {x:0,y:1}, {x:1,y:1}, {x:1,y:-1}];
            for (let d of dirs) {
                let combo = [i];
                [1, -1].forEach(s => {
                    let nr = r+d.y*s, nc = c+d.x*s;
                    while(nr>=0 && nr<10 && nc>=0 && nc<10 && grid[nr*10+nc] === char) {
                        combo.push(nr*10+nc); nr += d.y*s; nc += d.x*s;
                    }
                });
                if (combo.length >= 5) return { cells: combo };
            }
            return null;
        }

        function drawWinLine(cells, p) {
            cells.sort((a,b) => a-b);
            const b = document.getElementById('game-board').getBoundingClientRect();
            const s = document.getElementById(`b-${cells[0]}`).getBoundingClientRect();
            const e = document.getElementById(`b-${cells[cells.length-1]}`).getBoundingClientRect();
            const x1 = (s.left+s.width/2)-b.left, y1 = (s.top+s.height/2)-b.top;
            const x2 = (e.left+e.width/2)-b.left, y2 = (e.top+e.height/2)-b.top;
            const dist = Math.sqrt(Math.pow(x2-x1, 2) + Math.pow(y2-y1, 2));
            const angle = Math.atan2(y2-y1, x2-x1) * 180 / Math.PI;

            const line = document.createElement('div');
            line.className = 'win-line';
            line.style.cssText = `left:${x1}px; top:${y1}px; width:${dist}px; transform:rotate(${angle}deg);`;
            document.getElementById('line-container').appendChild(line);
            document.getElementById('status').innerHTML = `${p} BERJAYA! 🔥`;
        }

        function resetBoard() { if(confirm("MEMBERSIHKAN MEJA?")) db.child('cells').remove(); }
    </script>
</body>
</html>
