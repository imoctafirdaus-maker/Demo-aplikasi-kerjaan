<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Gold & Blue Edition</title>
    <style>
        :root {
            /* Palette: Soft Blue-Grey Neumorphism */
            --bg-color: #e6e9ef;
            --text-color: #4a5568;
            --shadow-dark: #cbd5e0;
            --shadow-light: #ffffff;
            
            /* Blue Accent */
            --border-blue: #3182ce;
            --border-blue-glow: rgba(66, 153, 225, 0.6);
            
            /* Player Gradients */
            --x-grad: linear-gradient(135deg, #ff6b6b, #ee5253);
            --o-grad: linear-gradient(135deg, #48bb78, #38a169);
            
            /* Gold Gradient */
            --gold-grad: linear-gradient(90deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            
            --grid-size: 10; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .header h1 {
            font-weight: 800;
            letter-spacing: -1px;
            color: #2d3748;
            margin-bottom: 5px;
            text-align: center;
        }

        .header p { opacity: 0.7; margin-bottom: 30px; text-align: center; }

        .status-card {
            background: var(--bg-color);
            padding: 15px 40px;
            border-radius: 50px;
            box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
            margin-bottom: 40px;
            font-weight: 700;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .board-wrapper {
            perspective: 2000px;
            position: relative;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(var(--grid-size), 1fr);
            gap: 10px;
            padding: 25px;
            background: var(--bg-color);
            border-radius: 30px;
            box-shadow: 20px 20px 40px var(--shadow-dark), -20px -20px 40px var(--shadow-light);
            transform: rotateX(10deg);
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .board:hover { transform: rotateX(0deg) scale(1.02); }

        /* Grid Blocks dengan Border Biru */
        .block {
            width: 48px;
            height: 48px;
            background: var(--bg-color);
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.4rem;
            font-weight: 900;
            
            /* Tambahan Border Biru */
            border: 2px solid var(--border-blue);
            /* Efek bayangan ganda: Neumorphic + Blue Glow */
            box-shadow: 
                4px 4px 8px var(--shadow-dark), 
                -4px -4px 8px var(--shadow-light),
                0 0 5px var(--border-blue-glow);
                
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
        }

        .block:not(.taken):hover {
            border-color: #63b3ed; /* Biru lebih terang saat hover */
            box-shadow: 
                2px 2px 4px var(--shadow-dark), 
                -2px -2px 4px var(--shadow-light),
                0 0 12px var(--border-blue-glow);
            transform: translateY(-2px);
        }

        .block.taken {
            border-color: #a0aec0; /* Warna border memudar saat terisi */
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            cursor: default;
        }

        .x-color { background: var(--x-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .o-color { background: var(--o-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .win-line {
            position: absolute;
            z-index: 10;
            background: var(--gold-grad);
            background-size: 200% auto;
            height: 10px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(184, 134, 11, 0.6);
            transform-origin: left center;
            pointer-events: none;
            animation: growLine 0.8s ease-out forwards, shimmer 3s infinite linear;
        }

        @keyframes growLine { from { opacity: 0; width: 0; } to { opacity: 1; } }
        @keyframes shimmer { to { background-position: 200% center; } }

        .winner-cell {
            background: #fffdf0 !important;
            border-color: #ffd700 !important; /* Border jadi emas saat menang */
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5) !important;
        }

        button {
            margin-top: 50px;
            padding: 16px 40px;
            border: 2px solid var(--border-blue);
            border-radius: 50px;
            background: var(--bg-color);
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            color: var(--border-blue);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            background: var(--border-blue);
            color: white;
            box-shadow: 0 0 15px var(--border-blue-glow);
        }

        @media (max-width: 600px) {
            .block { width: 32px; height: 32px; font-size: 1rem; border-radius: 6px; border-width: 1px; }
            .board { gap: 5px; padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Tic-Tac-Toe <span style="background: var(--gold-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Premium</span></h1>
        <p>Garis tepi biru untuk tampilan lebih presisi</p>
    </div>

    <div class="status-card" id="status">
        Giliran: <span class="x-color" id="player-label">X</span>
    </div>

    <div class="board-wrapper">
        <div class="board" id="game-board"></div>
        <div id="line-container"></div>
    </div>

    <button onclick="initGame()">Reset Permainan</button>

    <script>
        const GRID_SIZE = 10;
        const WIN_COUNT = 5;
        let currentPlayer = 'X';
        let gameState = [];
        let gameActive = true;

        const boardElement = document.getElementById('game-board');
        const statusLabel = document.getElementById('player-label');
        const lineContainer = document.getElementById('line-container');

        document.documentElement.style.setProperty('--grid-size', GRID_SIZE);

        function initGame() {
            gameActive = true;
            currentPlayer = 'X';
            gameState = Array(GRID_SIZE * GRID_SIZE).fill("");
            statusLabel.textContent = 'X';
            statusLabel.className = 'x-color';
            lineContainer.innerHTML = "";
            
            boardElement.innerHTML = "";
            for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
                const block = document.createElement('div');
                block.classList.add('block');
                block.setAttribute('data-index', i);
                block.addEventListener('click', handleCellClick);
                boardElement.appendChild(block);
            }
        }

        function handleCellClick(e) {
            const index = parseInt(e.target.getAttribute('data-index'));
            if (gameState[index] !== "" || !gameActive) return;

            gameState[index] = currentPlayer;
            e.target.textContent = currentPlayer;
            e.target.classList.add('taken', currentPlayer === 'X' ? 'x-color' : 'o-color');

            const winData = checkWin(index);
            if (winData) {
                drawGoldLine(winData.cells);
                document.getElementById('status').innerHTML = `WINNER: <span style="background: var(--gold-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">${currentPlayer}</span>`;
                gameActive = false;
                return;
            }

            if (!gameState.includes("")) {
                document.getElementById('status').textContent = "Hasil: Seri!";
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            statusLabel.textContent = currentPlayer;
            statusLabel.className = currentPlayer === 'X' ? 'x-color' : 'o-color';
        }

        function checkWin(index) {
            const row = Math.floor(index / GRID_SIZE);
            const col = index % GRID_SIZE;
            const directions = [{ x: 1, y: 0 }, { x: 0, y: 1 }, { x: 1, y: 1 }, { x: 1, y: -1 }];

            for (let dir of directions) {
                let winningCells = [index];
                [1, -1].forEach(sign => {
                    let r = row + (dir.y * sign), c = col + (dir.x * sign);
                    while (r >= 0 && r < GRID_SIZE && c >= 0 && c < GRID_SIZE && gameState[r * GRID_SIZE + c] === currentPlayer) {
                        winningCells.push(r * GRID_SIZE + c);
                        r += (dir.y * sign); c += (dir.x * sign);
                    }
                });
                if (winningCells.length >= WIN_COUNT) return { cells: winningCells };
            }
            return null;
        }

        function drawGoldLine(cells) {
            cells.sort((a, b) => a - b);
            const first = cells[0], last = cells[cells.length - 1];
            const firstEl = document.querySelector(`[data-index="${first}"]`);
            const lastEl = document.querySelector(`[data-index="${last}"]`);
            
            cells.forEach(idx => document.querySelector(`[data-index="${idx}"]`).classList.add('winner-cell'));

            const rectStart = firstEl.getBoundingClientRect(), rectEnd = lastEl.getBoundingClientRect(), boardRect = boardElement.getBoundingClientRect();
            const x1 = rectStart.left + rectStart.width / 2 - boardRect.left, y1 = rectStart.top + rectStart.height / 2 - boardRect.top;
            const x2 = rectEnd.left + rectEnd.width / 2 - boardRect.left, y2 = rectEnd.top + rectEnd.height / 2 - boardRect.top;

            const distance = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
            const angle = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;

            const line = document.createElement('div');
            line.className = 'win-line';
            line.style.width = `${distance}px`;
            line.style.left = `${x1}px`; line.style.top = `${y1}px`;
            line.style.transform = `rotate(${angle}deg)`;
            lineContainer.appendChild(line);
        }

        initGame();
    </script>
</body>
</html>
