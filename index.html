<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tic-Tac-Toe Online Gold Fire</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #e6e9ef;
            --text-color: #2d3748;
            --shadow-dark: #cbd5e0;
            --shadow-light: #ffffff;
            --border-blue: #3182ce;
            --x-grad: linear-gradient(135deg, #ff6b6b, #ee5253);
            --o-grad: linear-gradient(135deg, #48bb78, #38a169);
            --gold-fire: linear-gradient(90deg, #ff4500, #ff8c00, #ffd700, #ffffff, #ffd700, #ff8c00, #ff4500);
            --grid-count: 10;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background-color: var(--bg-color); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px 10px; overflow-x: hidden; }

        /* SELECTION OVERLAY */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); z-index: 100; display: flex; justify-content: center; align-items: center;
        }
        .selection-card {
            background: var(--bg-color); padding: 30px; border-radius: 30px;
            box-shadow: 15px 15px 30px var(--shadow-dark), -15px -15px 30px var(--shadow-light);
            text-align: center; width: 90%; max-width: 350px;
        }
        .choice-btns { display: flex; gap: 20px; justify-content: center; margin-top: 25px; }
        .btn-choice {
            width: 70px; height: 70px; border-radius: 20px; border: 3px solid var(--border-blue);
            font-size: 2rem; font-weight: 900; background: var(--bg-color);
            box-shadow: 5px 5px 10px var(--shadow-dark); cursor: pointer;
        }

        /* SCORE & STATUS */
        .status-card {
            background: var(--bg-color); padding: 12px 25px; border-radius: 50px;
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            margin-bottom: 20px; font-weight: 800; font-size: 0.9rem;
        }

        .viewport-container { width: 100%; overflow-x: auto; padding-bottom: 20px; -webkit-overflow-scrolling: touch; }
        .board-wrapper { position: relative; padding: 20px; display: inline-block; }
        .board {
            display: grid; grid-template-columns: repeat(var(--grid-count), 1fr);
            gap: 8px; padding: 15px; background: var(--bg-color); border-radius: 20px;
            box-shadow: 10px 10px 20px var(--shadow-dark);
            width: calc((50px * var(--grid-count)) + (8px * (var(--grid-count) - 1)) + 30px);
        }

        .block {
            width: 50px; height: 50px; background: var(--bg-color); border-radius: 10px;
            border: 2px solid var(--border-blue); display: flex; justify-content: center;
            align-items: center; font-size: 1.4rem; font-weight: 900;
            box-shadow: 3px 3px 6px var(--shadow-dark); -webkit-tap-highlight-color: transparent;
        }
        .block.taken { box-shadow: inset 2px 2px 5px var(--shadow-dark); border-color: #cbd5e0; }

        .x-color { background: var(--x-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .o-color { background: var(--o-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* FIRE WIN LINE */
        .win-line {
            position: absolute; z-index: 10; background: var(--gold-fire);
            background-size: 200% auto; height: 10px; border-radius: 10px;
            transform-origin: 0 50%; pointer-events: none;
            box-shadow: 0 0 15px #ff4500, 0 0 5px #ffd700;
            animation: draw 0.6s ease-out forwards, shimmer 1.5s infinite linear;
        }
        @keyframes draw { from { width: 0; } }
        @keyframes shimmer { to { background-position: 200% center; } }

        button.reset-btn {
            margin-top: 10px; padding: 12px 30px; border: none; border-radius: 50px;
            background: var(--bg-color); box-shadow: 5px 5px 10px var(--shadow-dark);
            color: #e53e3e; font-weight: 800; cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="selection-card">
            <h2>PILIH PERAN</h2>
            <p style="font-size: 0.8rem; color: #718096; margin-top: 5px;">Pilih X atau O untuk mulai</p>
            <div class="choice-btns">
                <button class="btn-choice x-color" onclick="pickRole('X')">X</button>
                <button class="btn-choice o-color" onclick="pickRole('O')">O</button>
            </div>
        </div>
    </div>

    <div class="status-card" id="info-status">Menghubungkan ke server...</div>

    <div class="viewport-container">
        <div class="board-wrapper">
            <div class="board" id="game-board"></div>
            <div id="line-container"></div>
        </div>
    </div>

    <button class="reset-btn" onclick="resetGame()">RESET PAPAN</button>

    <script>
        // --- KONFIGURASI FIREBASE MILIKMU ---
        const firebaseConfig = {
            apiKey: "AIzaSyBlL2HCkJYw_wNTMvJpDUpmJzw1-plQTm0",
            authDomain: "tic-tac-toe-api-5a2c0.firebaseapp.com",
            databaseURL: "https://tic-tac-toe-api-5a2c0-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "tic-tac-toe-api-5a2c0",
            storageBucket: "tic-tac-toe-api-5a2c0.firebasestorage.app",
            messagingSenderId: "820709850876",
            appId: "1:820709850876:web:e07700750b3faccb412179",
            measurementId: "G-DS69D453Z1"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref('global_room');

        let myRole = null;
        let currentTurn = 'X';
        let gameActive = true;
        const GRID_SIZE = 10;

        // Audio Engine Sederhana
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSfx(f, t, d, v) {
            try {
                const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                o.type = t; o.frequency.setValueAtTime(f, audioCtx.currentTime);
                g.gain.setValueAtTime(v, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + d);
                o.connect(g); g.connect(audioCtx.destination);
                o.start(); o.stop(audioCtx.currentTime + d);
            } catch(e) {}
        }

        function pickRole(role) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            myRole = role;
            document.getElementById('overlay').style.display = 'none';
            playSfx(440, 'sine', 0.2, 0.1);
            initUI();
            listenToServer();
        }

        function initUI() {
            const board = document.getElementById('game-board');
            board.innerHTML = "";
            for (let i = 0; i < 100; i++) {
                const b = document.createElement('div');
                b.className = 'block';
                b.id = `c-${i}`;
                b.onclick = () => handleTap(i);
                board.appendChild(b);
            }
        }

        function handleTap(idx) {
            if (!gameActive || currentTurn !== myRole) return;
            
            db.child('cells/' + idx).once('value', s => {
                if (!s.exists()) {
                    playSfx(600, 'sine', 0.1, 0.1);
                    db.child('cells/' + idx).set(myRole);
                    db.child('turn').set(myRole === 'X' ? 'O' : 'X');
                }
            });
        }

        function listenToServer() {
            // Pantau Giliran
            db.child('turn').on('value', s => {
                currentTurn = s.val() || 'X';
                const info = document.getElementById('info-status');
                if (currentTurn === myRole) {
                    info.innerHTML = `GIRILAN ANDA (<span class="${myRole === 'X' ? 'x-color' : 'o-color'}">${myRole}</span>)`;
                } else {
                    info.innerHTML = `Menunggu lawan (${currentTurn})...`;
                }
            });

            // Pantau Gerakan
            db.child('cells').on('child_added', s => {
                const idx = s.key;
                const val = s.val();
                const el = document.getElementById(`c-${idx}`);
                if (el) {
                    el.innerHTML = `<span class="${val === 'X' ? 'x-color' : 'o-color'}">${val}</span>`;
                    el.classList.add('taken');
                }
                checkWinnerLogic();
            });

            // Pantau Reset
            db.on('value', s => {
                if (!s.hasChild('cells')) {
                    gameActive = true;
                    document.getElementById('line-container').innerHTML = "";
                    initUI();
                }
            });
        }

        function checkWinnerLogic() {
            // Logic diletakkan di sini untuk mengecek 5 baris emas api
            // Jika terdeteksi, panggil animasi drawWin
        }

        function resetGame() {
            if(confirm("Bersihkan papan untuk semua pemain?")) {
                db.remove();
            }
        }
    </script>
</body>
</html>
