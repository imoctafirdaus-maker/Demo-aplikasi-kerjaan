<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Mega 3D Mobile Optimized</title>
    <style>
        :root {
            --bg-color: #e6e9ef;
            --text-color: #2d3748;
            --shadow-dark: #cbd5e0;
            --shadow-light: #ffffff;
            --border-blue: #3182ce;
            --x-grad: linear-gradient(135deg, #ff6b6b, #ee5253);
            --o-grad: linear-gradient(135deg, #48bb78, #38a169);
            --gold-grad: linear-gradient(90deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --grid-count: 10;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        /* Header Tetap Statis */
        .header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
        }

        .status-card {
            display: inline-block;
            background: var(--bg-color);
            padding: 12px 30px;
            border-radius: 50px;
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            font-weight: 800;
        }

        /* Container Scrollable untuk Mobile */
        .viewport-container {
            width: 100%;
            max-width: 100vw;
            overflow-x: auto; /* Mengaktifkan scroll horizontal di HP */
            padding: 20px 0;
            display: flex;
            justify-content: flex-start; /* Default mulai dari kiri */
            -webkit-overflow-scrolling: touch; /* Scroll halus di iOS */
        }

        /* Agar board berada di tengah jika layar lebar */
        @media (min-width: 600px) {
            .viewport-container { justify-content: center; }
        }

        .board-wrapper {
            perspective: 1500px;
            position: relative;
            padding: 20px; /* Ruang untuk bayangan */
        }

        .board {
            display: grid;
            grid-template-columns: repeat(var(--grid-count), 1fr);
            gap: 10px;
            padding: 20px;
            background: var(--bg-color);
            border-radius: 25px;
            box-shadow: 15px 15px 30px var(--shadow-dark), -15px -15px 30px var(--shadow-light);
            /* Ukuran kotak tetap besar (50px) */
            width: calc((50px * var(--grid-count)) + (10px * (var(--grid-count) - 1)) + 40px);
            transform: rotateX(5deg);
            transition: transform 0.4s;
        }

        .board:active { transform: rotateX(0deg); }

        .block {
            width: 50px;
            height: 50px;
            background: var(--bg-color);
            border-radius: 10px;
            border: 2px solid var(--border-blue);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            font-weight: 900;
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            cursor: pointer;
            transition: 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .block.taken {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            border-color: #cbd5e0;
        }

        .x-color { background: var(--x-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .o-color { background: var(--o-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Garis Kemenangan */
        .win-line {
            position: absolute;
            z-index: 10;
            background: var(--gold-grad);
            height: 10px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(184, 134, 11, 0.6);
            transform-origin: 0 50%;
            pointer-events: none;
            animation: draw 0.8s ease-out forwards, shimmer 2s infinite linear;
            background-size: 200% auto;
        }

        @keyframes draw { from { width: 0; } }
        @keyframes shimmer { to { background-position: 200% center; } }

        .winner-cell {
            background: #fffdf0 !important;
            border-color: #ffd700 !important;
            transform: scale(1.05);
        }

        /* Footer */
        .footer {
            margin-top: 30px;
            padding-bottom: 30px;
        }

        button {
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            background: var(--bg-color);
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            color: var(--border-blue);
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
        }

        button:active {
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
            transform: scale(0.98);
        }

        /* Scrollbar Styling */
        .viewport-container::-webkit-scrollbar { height: 6px; }
        .viewport-container::-webkit-scrollbar-thumb { background: var(--shadow-dark); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="status-card" id="status-display">
            Giliran: <span class="x-color" id="player-label">X</span>
        </div>
    </div>

    <div class="viewport-container">
        <div class="board-wrapper">
            <div class="board" id="game-board"></div>
            <div id="line-container"></div>
        </div>
    </div>

    <div class="footer">
        <button onclick="initGame()">Restart Game</button>
    </div>

    <script>
        const GRID_SIZE = 10;
        const WIN_COUNT = 5;
        let currentPlayer = 'X';
        let gameState = [];
        let gameActive = true;

        const boardElement = document.getElementById('game-board');
        const statusDisplay = document.getElementById('status-display');
        const playerLabel = document.getElementById('player-label');
        const lineContainer = document.getElementById('line-container');

        document.documentElement.style.setProperty('--grid-count', GRID_SIZE);

        function initGame() {
            gameActive = true;
            currentPlayer = 'X';
            gameState = Array(GRID_SIZE * GRID_SIZE).fill("");
            statusDisplay.innerHTML = `Giliran: <span class="x-color" id="player-label">X</span>`;
            lineContainer.innerHTML = "";
            boardElement.innerHTML = "";
            
            for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
                const block = document.createElement('div');
                block.classList.add('block');
                block.setAttribute('data-index', i);
                block.addEventListener('click', () => handleMove(i, block));
                boardElement.appendChild(block);
            }
        }

        function handleMove(index, element) {
            if (gameState[index] !== "" || !gameActive) return;

            gameState[index] = currentPlayer;
            element.innerHTML = `<span class="${currentPlayer === 'X' ? 'x-color' : 'o-color'}">${currentPlayer}</span>`;
            element.classList.add('taken');

            const winData = checkWin(index);
            if (winData) {
                gameActive = false;
                drawWin(winData.cells);
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            const label = document.getElementById('player-label');
            label.textContent = currentPlayer;
            label.className = currentPlayer === 'X' ? 'x-color' : 'o-color';
        }

        function checkWin(index) {
            const row = Math.floor(index / GRID_SIZE);
            const col = index % GRID_SIZE;
            const dirs = [{x:1,y:0},{x:0,y:1},{x:1,y:1},{x:1,y:-1}];

            for (let d of dirs) {
                let cells = [index];
                [1, -1].forEach(s => {
                    let r = row+(d.y*s), c = col+(d.x*s);
                    while(r>=0 && r<GRID_SIZE && c>=0 && c<GRID_SIZE && gameState[r*GRID_SIZE+c] === currentPlayer) {
                        cells.push(r*GRID_SIZE+c);
                        r+=(d.y*s); c+=(d.x*s);
                    }
                });
                if (cells.length >= WIN_COUNT) return { cells };
            }
            return null;
        }

        function drawWin(cells) {
            cells.sort((a,b) => a-b);
            cells.forEach(idx => document.querySelector(`[data-index="${idx}"]`).classList.add('winner-cell'));

            const bRect = boardElement.getBoundingClientRect();
            const start = document.querySelector(`[data-index="${cells[0]}"]`).getBoundingClientRect();
            const end = document.querySelector(`[data-index="${cells[cells.length-1]}"]`).getBoundingClientRect();

            const x1 = (start.left + start.width/2) - bRect.left;
            const y1 = (start.top + start.height/2) - bRect.top;
            const x2 = (end.left + end.width/2) - bRect.left;
            const y2 = (end.top + end.height/2) - bRect.top;

            const dist = Math.sqrt(Math.pow(x2-x1, 2) + Math.pow(y2-y1, 2));
            const angle = Math.atan2(y2-y1, x2-x1) * 180 / Math.PI;

            const line = document.createElement('div');
            line.className = 'win-line';
            line.style.left = `${x1}px`;
            line.style.top = `${y1}px`;
            line.style.width = `${dist}px`;
            line.style.transform = `rotate(${angle}deg)`;
            lineContainer.appendChild(line);

            statusDisplay.innerHTML = `<span style="background:var(--gold-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent">${currentPlayer} MENANG!</span>`;
        }

        initGame();
    </script>
</body>
</html>
