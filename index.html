<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Board Game - 1888</title>
    <link rel="manifest" href="manifest.json">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Special+Elite&display=swap');
        :root { --wood: #5d4037; --brass: #b7950b; --paper: #d7ccc8; }
        body { background: #1a0f0a; color: var(--paper); font-family: 'Special Elite', cursive; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
        
        /* Lobby Style Sesuai Foto */
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; display: flex; justify-content: center; align-items: center; }
        .card-vintage { background: var(--wood); padding: 25px; border: 8px double var(--brass); text-align: center; width: 90%; max-width: 400px; border-radius: 5px; }
        .app-logo { width: 80px; border-radius: 50%; border: 2px solid var(--brass); margin-bottom: 10px; }
        .name-input { width: 100%; padding: 12px; background: #2a1b12; border: none; color: var(--paper); margin-bottom: 15px; text-align: center; }
        
        .btn-choice { width: 100%; padding: 12px; border: 2px solid var(--brass); background: var(--wood); color: var(--brass); font-family: 'Cinzel'; cursor: pointer; margin: 5px 0; border-radius: 8px; }
        .btn-choice:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Board 3D Style */
        .viewport { perspective: 1000px; margin-top: 20px; }
        .board-wrapper { background: #3d2b1f; padding: 10px; transform: rotateX(20deg); border: 4px solid var(--brass); box-shadow: 0 20px 40px rgba(0,0,0,0.7); }
        .grid { display: grid; grid-template-columns: repeat(10, 8vw); gap: 2px; }
        .cell { width: 8vw; height: 8vw; background: var(--wood); display: flex; justify-content: center; align-items: center; font-size: 5vw; }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="card-vintage">
            <img src="1777546745740.png" class="app-logo" alt="Logo">
            <h1 style="font-family: 'Cinzel'; color: var(--brass);">GRAND LOBBY</h1>
            <input type="text" id="inputNama" class="name-input" placeholder="Gelar Anda..." maxlength="10">
            
            <button class="btn-choice" onclick="selectGame()">MASUK PERMAINAN (10x10)</button>
            
            <div id="role-select" style="display:none; margin-top:15px;">
                <p style="font-size:0.8rem; color:var(--brass);">PILIH PIHAK:</p>
                <div style="display:flex; gap:10px;">
                    <button id="btnX" class="btn-choice" onclick="join('X')">PIHAK X</button>
                    <button id="btnO" class="btn-choice" onclick="join('O')">PIHAK O</button>
                </div>
            </div>
        </div>
    </div>

    <div id="status">MENUNGGU PEMAIN...</div>
    <div class="viewport">
        <div class="board-wrapper"><div id="board" class="grid"></div></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <script>
        // Masukkan Konfigurasi Firebase Anda di sini
        const firebaseConfig = {
            apiKey: "AIzaSyBlL2HCkJYw_wNTMvJpDUpmJzw1-plQTm0",
            databaseURL: "https://tic-tac-toe-api-5a2c0-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "tic-tac-toe-api-5a2c0",
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref('multi_game_v1/XOXO');

        let myRole = "";
        let myName = "";

        // Fungsi Suara Pop
        function playPop() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.value = 600; gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.1);
            osc.start(); osc.stop(ctx.currentTime + 0.1);
        }

        function selectGame() {
            const n = document.getElementById('inputNama').value;
            if(!n) return alert("Isi Nama!");
            myName = n;
            document.getElementById('role-select').style.display = 'block';
            db.child('names').on('value', s => {
                const data = s.val() || {};
                document.getElementById('btnX').disabled = !!data.X;
                document.getElementById('btnO').disabled = !!data.O;
            });
        }

        function join(role) {
            myRole = role;
            db.child('names/' + role).set(myName);
            document.getElementById('overlay').style.display = 'none';
            playPop();
            buildBoard();
            listen();
        }

        function buildBoard() {
            const b = document.getElementById('board');
            for(let i=0; i<100; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.onclick = () => {
                    db.child('cells/' + i).transaction(val => val === null ? myRole : val);
                    playPop();
                };
                cell.id = 'c' + i;
                b.appendChild(cell);
            }
        }

        function listen() {
            db.child('cells').on('value', s => {
                const cells = s.val() || {};
                Object.keys(cells).forEach(key => {
                    const el = document.getElementById('c' + key);
                    el.innerText = cells[key];
                    el.style.color = cells[key] === 'X' ? '#ff4444' : '#b7950b';
                });
            });
        }

        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
    </script>
</body>
</html>
