<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Board Game 1888 - Advanced Chess</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Special+Elite&display=swap');

        :root {
            --wood-dark: #3d2b1f; --wood-light: #5d4037; --brass: #b7950b;
            --paper: #d7ccc8;
        }

        body { 
            background: radial-gradient(circle, #2c1e16 0%, #000 100%);
            color: var(--paper); font-family: 'Special Elite', cursive;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; margin: 0; overflow-x: hidden;
        }

        /* Overlay & UI */
        #overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; 
            display: flex; justify-content: center; align-items: center; backdrop-filter: blur(10px);
        }
        .card-vintage {
            background: var(--wood-light); padding: 30px; border: 8px double var(--brass);
            border-radius: 5px; text-align: center; width: 90%; max-width: 400px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }
        .btn-choice {
            padding: 12px; border: 1px solid var(--brass); background: var(--wood-dark);
            color: var(--brass); font-family: 'Cinzel'; cursor: pointer; margin: 5px; width: 100%;
            transition: 0.3s; font-weight: bold;
        }
        .btn-choice:hover { background: var(--brass); color: #000; }

        /* Scoreboard */
        .scoreboard { display: flex; gap: 15px; padding: 15px; width: 100%; max-width: 500px; z-index: 10; }
        .score-box { flex: 1; text-align: center; background: rgba(0,0,0,0.6); padding: 8px; border: 1px solid var(--brass); border-radius: 5px; }
        #status { color: var(--brass); margin: 10px; font-weight: bold; text-shadow: 0 0 8px gold; height: 20px; }

        /* 3D Board */
        .viewport-container { 
            perspective: 1500px; padding: 50px 0; 
            width: 100%; display: flex; justify-content: center; align-items: center;
        }
        .board-wrapper { 
            position: relative; transform-style: preserve-3d;
            transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            background: #2a1b12; border: 12px solid #1a0f0a;
            box-shadow: 0 50px 100px rgba(0,0,0,0.9);
        }
        
        .angle-white { transform: rotateX(40deg) rotateZ(0deg); }
        .angle-black { transform: rotateX(40deg) rotateZ(180deg); }

        .board-chess { 
            display: grid; grid-template-columns: repeat(8, 11vw); grid-template-rows: repeat(8, 11vw); 
            background: #000;
        }
        @media (min-width: 600px) { .board-chess { grid-template-columns: repeat(8, 60px); grid-template-rows: repeat(8, 60px); } }

        .chess-tile { 
            width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; 
            font-size: 2.2rem; cursor: pointer; transition: 0.2s;
        }
        .tile-light { background: #ecd9b9; }
        .tile-dark { background: #7d5a44; }
        .tile-selected { background: #f1c40f !important; box-shadow: inset 0 0 15px rgba(0,0,0,0.5); }
        .tile-hint { position: relative; }
        .tile-hint::after { content: ''; width: 15px; height: 15px; background: rgba(0,255,0,0.3); border-radius: 50%; position: absolute; }

        .piece { 
            user-select: none; filter: drop-shadow(0 4px 2px rgba(0,0,0,0.4));
            transition: transform 0.3s; pointer-events: none;
        }
        .piece.black { color: #000; }
        .piece.white { color: #fff; text-shadow: 1px 1px 2px #000; }
        .piece-flipped { transform: rotate(180deg); }
        
        .controls { margin-top: 20px; display: flex; gap: 10px; }
        .btn-tiny { font-size: 0.65rem; width: auto; padding: 5px 15px; }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="card-vintage">
            <h2 style="font-family: 'Cinzel'; color: var(--brass);">1888 CHESS SALOON</h2>
            <input type="text" id="inputNama" style="width:100%; padding:10px; margin:15px 0; background:#1a0f0a; border:1px solid var(--brass); color:white; text-align:center;" placeholder="NAMA ANDA...">
            <button class="btn-choice" onclick="startAs('white')">PIHAK PUTIH</button>
            <button class="btn-choice" onclick="startAs('black')">PIHAK HITAM</button>
        </div>
    </div>

    <div class="scoreboard">
        <div class="score-box"><small>PUTIH</small><br><b id="p1-name">-</b></div>
        <div class="score-box"><small>HITAM</small><br><b id="p2-name">-</b></div>
    </div>

    <div id="status">MENGHUBUNGKAN...</div>

    <div class="viewport-container">
        <div id="board-perspective" class="board-wrapper">
            <div id="main-board" class="board-chess"></div>
        </div>
    </div>

    <div class="controls">
        <button class="btn-choice btn-tiny" onclick="requestReset()">🧹 RESET PAPAN</button>
        <button class="btn-choice btn-tiny" onclick="location.reload()">🔄 REFRESH</button>
    </div>

    <script>
        // CONFIGURASI FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyBlL2HCkJYw_wNTMvJpDUpmJzw1-plQTm0",
            authDomain: "tic-tac-toe-api-5a2c0.firebaseapp.com",
            databaseURL: "https://tic-tac-toe-api-5a2c0-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "tic-tac-toe-api-5a2c0",
            storageBucket: "tic-tac-toe-api-5a2c0.firebasestorage.app",
            messagingSenderId: "820709850876",
            appId: "1:820709850876:web:e07700750b3faccb412179"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref('chess_multiplayer_1888');

        let myRole = ""; 
        let myName = ""; 
        let turn = "white";
        let currentBoard = {}; 
        let selectedTile = null;

        const piecesChar = {
            white: { p: '♙', r: '♖', n: '♘', b: '♗', q: '♕', k: '♔' },
            black: { p: '♟', r: '♜', n: '♞', b: '♝', q: '♛', k: '♚' }
        };

        function startAs(role) {
            const n = document.getElementById('inputNama').value;
            if(!n) return alert("Sebutkan Nama Anda!");
            myName = n; myRole = role;
            
            db.child('names/' + role).set(myName);
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('board-perspective').className = `board-wrapper angle-${role}`;
            
            initBoardUI();
            listenFirebase();
        }

        function initBoardUI() {
            const boardDiv = document.getElementById('main-board');
            boardDiv.innerHTML = "";
            for(let i=0; i<64; i++) {
                const tile = document.createElement('div');
                const isDark = (Math.floor(i/8) + (i%8)) % 2 !== 0;
                tile.className = `chess-tile ${isDark ? 'tile-dark' : 'tile-light'}`;
                tile.id = `t-${i}`;
                tile.onclick = () => handleTileClick(i);
                boardDiv.appendChild(tile);
            }
        }

        function listenFirebase() {
            db.child('cells').on('value', s => { 
                currentBoard = s.val() || {}; 
                if(Object.keys(currentBoard).length === 0) requestReset(); 
                renderPieces(); 
            });
            db.child('turn').on('value', s => { 
                turn = s.val() || 'white';
                updateStatus();
            });
            db.child('names').on('value', s => {
                const n = s.val() || {};
                document.getElementById('p1-name').innerText = n.white || "Menunggu...";
                document.getElementById('p2-name').innerText = n.black || "Menunggu...";
            });
        }

        function updateStatus() {
            const statEl = document.getElementById('status');
            if(turn === myRole) {
                statEl.innerText = "GILIRAN ANDA";
                statEl.style.color = "#2ecc71";
            } else {
                statEl.innerText = "GILIRAN LAWAN (" + turn.toUpperCase() + ")";
                statEl.style.color = "var(--brass)";
            }
        }

        function renderPieces() {
            for(let i=0; i<64; i++) {
                const tile = document.getElementById(`t-${i}`);
                if(!tile) continue;
                const p = currentBoard[i];
                if(p) {
                    const flipClass = (myRole === 'black') ? 'piece-flipped' : '';
                    tile.innerHTML = `<span class="piece ${p.color} ${flipClass}">${piecesChar[p.color][p.type]}</span>`;
                } else {
                    tile.innerHTML = "";
                }
            }
        }

        function handleTileClick(i) {
            if(turn !== myRole) return;

            const piece = currentBoard[i];

            if(selectedTile === null) {
                // Pilih bidak
                if(piece && piece.color === myRole) {
                    selectedTile = i;
                    document.getElementById(`t-${i}`).classList.add('tile-selected');
                }
            } else {
                // Gerakkan bidak
                if(validateMove(selectedTile, i)) {
                    executeMove(selectedTile, i);
                }
                
                // Reset seleksi
                document.getElementById(`t-${selectedTile}`).classList.remove('tile-selected');
                selectedTile = null;
            }
        }

        function validateMove(from, to) {
            const p = currentBoard[from];
            const target = currentBoard[to];
            if(target && target.color === p.color) return false;

            const r1 = Math.floor(from/8), c1 = from % 8;
            const r2 = Math.floor(to/8),   c2 = to % 8;
            const dr = Math.abs(r2 - r1);
            const dc = Math.abs(c2 - c1);

            switch(p.type) {
                case 'p': // Pion
                    const dir = p.color === 'white' ? -1 : 1;
                    if(c1 === c2 && !target) {
                        if(r2 - r1 === dir) return true;
                        if((r1 === 6 || r1 === 1) && r2 - r1 === 2 * dir && !currentBoard[from + 8*dir]) return true;
                    }
                    if(dc === 1 && r2 - r1 === dir && target) return true;
                    return false;
                case 'r': // Benteng
                    if(r1 !== r2 && c1 !== c2) return false;
                    return isPathClear(from, to);
                case 'n': // Kuda
                    return (dr === 2 && dc === 1) || (dr === 1 && dc === 2);
                case 'b': // Gajah
                    if(dr !== dc) return false;
                    return isPathClear(from, to);
                case 'q': // Ratu
                    if(dr !== dc && r1 !== r2 && c1 !== c2) return false;
                    return isPathClear(from, to);
                case 'k': // Raja
                    return dr <= 1 && dc <= 1;
            }
            return false;
        }

        function isPathClear(from, to) {
            const r1 = Math.floor(from/8), c1 = from % 8;
            const r2 = Math.floor(to/8),   c2 = to % 8;
            const stepR = r2 > r1 ? 1 : (r2 < r1 ? -1 : 0);
            const stepC = c2 > c1 ? 1 : (c2 < c1 ? -1 : 0);
            let currR = r1 + stepR;
            let currC = c1 + stepC;
            while(currR !== r2 || currC !== c2) {
                if(currentBoard[currR * 8 + currC]) return false;
                currR += stepR; currC += stepC;
            }
            return true;
        }

        function executeMove(from, to) {
            const p = currentBoard[from];
            const updates = {};
            updates[`cells/${from}`] = null;
            updates[`cells/${to}`] = p;
            updates[`turn`] = (myRole === 'white' ? 'black' : 'white');
            db.update(updates);
        }

        function requestReset() {
            const initial = {};
            const layout = ['r','n','b','q','k','b','n','r'];
            for(let i=0; i<8; i++) {
                initial[i] = { type: layout[i], color: 'black' };
                initial[8+i] = { type: 'p', color: 'black' };
                initial[48+i] = { type: 'p', color: 'white' };
                initial[56+i] = { type: layout[i], color: 'white' };
            }
            db.child('cells').set(initial);
            db.child('turn').set('white');
        }
    </script>
</body>
</html>
