<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tic-Tac-Toe Mobile Gold</title>
    <style>
        :root {
            --bg-color: #e6e9ef;
            --text-color: #2d3748;
            --shadow-dark: #cbd5e0;
            --shadow-light: #ffffff;
            --border-blue: #3182ce;
            --x-grad: linear-gradient(135deg, #ff6b6b, #ee5253);
            --o-grad: linear-gradient(135deg, #48bb78, #38a169);
            --gold-grad: linear-gradient(90deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --grid-count: 10;
        }

        /* Prevent overscroll on mobile */
        html, body {
            overflow: hidden;
            height: 100%;
            position: fixed;
            width: 100%;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 10px;
        }

        /* Top Status Panel */
        .header {
            width: 100%;
            max-width: 400px;
            text-align: center;
            margin-top: 10px;
            margin-bottom: 15px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-color);
            padding: 10px 25px;
            border-radius: 30px;
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            font-weight: 800;
            font-size: 1rem;
        }

        /* Board Area - Mobile Precision */
        .game-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            perspective: 1000px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(var(--grid-count), 1fr);
            gap: 4px; /* Gap kecil untuk layar HP */
            padding: 12px;
            background: var(--bg-color);
            border-radius: 15px;
            box-shadow: 15px 15px 30px var(--shadow-dark), -15px -15px 30px var(--shadow-light);
            /* Responsive Width: 95% dari lebar layar atau max 400px */
            width: 95vw;
            max-width: 420px;
            /* Memastikan aspek rasio kotak tetap square */
            aspect-ratio: 1 / 1;
            transform: rotateX(5deg);
            position: relative;
        }

        .block {
            background: var(--bg-color);
            border-radius: 6px;
            border: 1.5px solid var(--border-blue);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4.5vw; /* Font size dinamis sesuai layar */
            font-weight: 900;
            box-shadow: 2px 2px 4px var(--shadow-dark), -2px -2px 4px var(--shadow-light);
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent; /* Hilangkan highlight biru di Android/iOS */
        }

        @media (min-width: 420px) {
            .block { font-size: 1.2rem; }
        }

        .block.taken {
            box-shadow: inset 2px 2px 4px var(--shadow-dark), inset -2px -2px 4px var(--shadow-light);
            border-color: #cbd5e0;
        }

        /* Text Styles */
        .x-color { background: var(--x-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .o-color { background: var(--o-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Win Line Mobile */
        .win-line {
            position: absolute;
            z-index: 10;
            background: var(--gold-grad);
            height: 6px; /* Sedikit lebih tipis di HP */
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(184, 134, 11, 0.6);
            transform-origin: 0 50%;
            pointer-events: none;
            animation: drawLine 0.6s ease-out forwards;
        }

        @keyframes drawLine { from { width: 0; } }

        .winner-cell {
            background: #fffdf0 !important;
            border-color: #ffd700 !important;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse { from { scale: 1; } to { scale: 1.05; } }

        /* Footer Controls */
        .footer {
            width: 100%;
            display: flex;
            justify-content: center;
            padding-bottom: env(safe-area-inset-bottom, 20px); /* Dukungan notch iPhone */
            margin-top: 10px;
        }

        button {
            padding: 14px 40px;
            border: none;
            border-radius: 25px;
            background: var(--bg-color);
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            color: var(--border-blue);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            active: scale(0.95);
        }

        button:active {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="status-pill" id="status-card">
            Giliran: <span class="x-color" id="player-label">X</span>
        </div>
    </div>

    <div class="game-area">
        <div class="board" id="game-board">
            </div>
        <div id="line-container"></div>
    </div>

    <div class="footer">
        <button onclick="initGame()">Ulang Game</button>
    </div>

    <script>
        const GRID_SIZE = 10;
        const WIN_COUNT = 5;
        let currentPlayer = 'X';
        let gameState = [];
        let gameActive = true;

        const boardElement = document.getElementById('game-board');
        const statusLabel = document.getElementById('player-label');
        const lineContainer = document.getElementById('line-container');

        function initGame() {
            gameActive = true;
            currentPlayer = 'X';
            gameState = Array(GRID_SIZE * GRID_SIZE).fill("");
            statusLabel.textContent = 'X';
            statusLabel.className = 'x-color';
            document.getElementById('status-card').style.color = "var(--text-color)";
            
            lineContainer.innerHTML = "";
            boardElement.innerHTML = "";
            
            for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
                const block = document.createElement('div');
                block.classList.add('block');
                block.setAttribute('data-index', i);
                block.addEventListener('touchstart', function(e) { 
                    // Support touch for mobile
                    handleCellClick(i, e.target);
                }, {passive: true});
                block.addEventListener('click', function(e) {
                    handleCellClick(i, e.target);
                });
                boardElement.appendChild(block);
            }
        }

        function handleCellClick(index, element) {
            if (gameState[index] !== "" || !gameActive) return;

            gameState[index] = currentPlayer;
            element.innerHTML = `<span class="${currentPlayer === 'X' ? 'x-color' : 'o-color'}">${currentPlayer}</span>`;
            element.classList.add('taken');

            const winData = checkWin(index);
            if (winData) {
                drawWin(winData.cells);
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            statusLabel.textContent = currentPlayer;
            statusLabel.className = currentPlayer === 'X' ? 'x-color' : 'o-color';
        }

        function checkWin(index) {
            const row = Math.floor(index / GRID_SIZE);
            const col = index % GRID_SIZE;
            const directions = [{x:1, y:0}, {x:0, y:1}, {x:1, y:1}, {x:1, y:-1}];

            for (let dir of directions) {
                let cells = [index];
                [1, -1].forEach(s => {
                    let r = row + (dir.y*s), c = col + (dir.x*s);
                    while(r>=0 && r<GRID_SIZE && c>=0 && c<GRID_SIZE && gameState[r*GRID_SIZE+c] === currentPlayer) {
                        cells.push(r*GRID_SIZE+c);
                        r+=(dir.y*s); c+=(dir.x*s);
                    }
                });
                if (cells.length >= WIN_COUNT) return { cells };
            }
            return null;
        }

        function drawWin(cells) {
            gameActive = false;
            cells.sort((a,b) => a-b);
            const first = cells[0], last = cells[cells.length-1];
            
            cells.forEach(idx => document.querySelector(`[data-index="${idx}"]`).classList.add('winner-cell'));

            const bRect = boardElement.getBoundingClientRect();
            const startEl = document.querySelector(`[data-index="${first}"]`).getBoundingClientRect();
            const endEl = document.querySelector(`[data-index="${last}"]`).getBoundingClientRect();

            const x1 = (startEl.left + startEl.width/2) - bRect.left;
            const y1 = (startEl.top + startEl.height/2) - bRect.top;
            const x2 = (endEl.left + endEl.width/2) - bRect.left;
            const y2 = (endEl.top + endEl.height/2) - bRect.top;

            const dist = Math.sqrt(Math.pow(x2-x1, 2) + Math.pow(y2-y1, 2));
            const angle = Math.atan2(y2-y1, x2-x1) * 180 / Math.PI;

            const line = document.createElement('div');
            line.className = 'win-line';
            line.style.left = `${x1}px`;
            line.style.top = `${y1}px`;
            line.style.width = `${dist}px`;
            line.style.transform = `rotate(${angle}deg)`;
            lineContainer.appendChild(line);

            document.getElementById('status-card').innerHTML = `<span style="background:var(--gold-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent">${currentPlayer} MENANG!</span>`;
        }

        initGame();
    </script>
</body>
</html>
