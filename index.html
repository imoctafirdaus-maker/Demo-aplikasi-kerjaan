<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>KREAVIO - Desain Apapun, Langsung dari HP</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gray: { 850: '#1f2937', 900: '#111827', 950: '#030712' },
            brand: { 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7' }
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Dancing+Script:wght@700&family=Inter:wght@400;500;600;700&family=Lobster&family=Montserrat:wght@400;700;900&family=Oswald:wght@500;700&family=Playfair+Display:ital,wght@0,600;1,400&family=Righteous&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- html2canvas for Exporting -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    /* Base Mobile Optimizations */
    body {
      overscroll-behavior-y: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-x pan-y;
    }
    
    /* Hide Scrollbar but keep functionality */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Canvas Area Pattern */
    .canvas-bg {
      background-color: #1f2937;
      background-image: radial-gradient(#374151 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* Object & Selection Styles */
    .canvas-object {
      position: absolute;
      transform-origin: top left;
      will-change: transform;
      cursor: pointer;
      pointer-events: auto;
    }
    .canvas-object.locked { pointer-events: none; }
    
    .selection-box {
      position: absolute;
      border: 2px solid #0ea5e9;
      pointer-events: none;
      z-index: 50;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.2);
    }
    .handle {
      position: absolute;
      width: 14px; height: 14px;
      background: #fff;
      border: 2px solid #0ea5e9;
      border-radius: 50%;
      pointer-events: auto;
      z-index: 51;
      transform: translate(-50%, -50%);
    }
    .handle-tl { top: 0; left: 0; cursor: nwse-resize; }
    .handle-tr { top: 0; left: 100%; cursor: nesw-resize; }
    .handle-bl { top: 100%; left: 0; cursor: nesw-resize; }
    .handle-br { top: 100%; left: 100%; cursor: nwse-resize; }
    .handle-rot { top: -30px; left: 50%; cursor: grab; background: #0ea5e9; border: 2px solid #fff;}
    .rot-line {
      position: absolute; top: -30px; left: 50%; width: 2px; height: 30px;
      background: #0ea5e9; transform: translateX(-50%);
    }

    /* Bottom Sheet Animation */
    .bottom-sheet {
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .bottom-sheet.open { transform: translateY(0); }
    .sheet-backdrop {
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
    
    /* Toast Animation */
    @keyframes slideUpFade { from { opacity: 0; transform: translateY(20px) translateX(-50%); } to { opacity: 1; transform: translateY(0) translateX(-50%); } }
    .toast-anim { animation: slideUpFade 0.3s ease-out forwards; }
  </style>
</head>
<body class="bg-gray-950 text-white h-[100dvh] w-full overflow-hidden flex flex-col font-sans relative">

  <!-- ==================== TOAST NOTIFICATION ==================== -->
  <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-gray-800 border border-gray-700 text-white px-4 py-2 rounded-full shadow-lg text-sm font-medium z-[100] hidden flex items-center gap-2">
    <i data-lucide="info" class="w-4 h-4 text-brand-400"></i> <span id="toast-msg">Notifikasi</span>
  </div>

  <!-- ==================== SCREEN: HOME ==================== -->
  <div id="screen-home" class="flex-1 flex flex-col h-full w-full absolute inset-0 z-10 bg-gray-950 transition-opacity duration-300">
    <!-- Header -->
    <header class="pt-10 pb-4 px-5 bg-gray-900 border-b border-gray-800 flex justify-between items-center shrink-0">
      <div>
        <h1 class="text-2xl font-black tracking-tight text-white flex items-center gap-2">
          <span class="bg-brand-500 text-white rounded-lg p-1.5"><i data-lucide="layers" class="w-5 h-5"></i></span>KREAVIO
        </h1>
        <p class="text-gray-400 text-sm mt-1">Halo! Apa yang ingin kamu desain?</p>
      </div>
      <div class="w-10 h-10 bg-gray-800 rounded-full flex items-center justify-center border border-gray-700">
        <i data-lucide="user" class="w-5 h-5 text-gray-400"></i>
      </div>
    </header>

    <!-- Content -->
    <main class="flex-1 overflow-y-auto no-scrollbar pb-24">
      <!-- Search -->
      <div class="px-5 py-4">
        <div class="relative">
          <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
          <input type="text" placeholder="Cari template, mockup, font..." class="w-full bg-gray-900 border border-gray-800 rounded-xl py-3 pl-10 pr-4 text-sm focus:outline-none focus:border-brand-500 transition text-white placeholder-gray-500">
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="px-5 mb-6">
        <div class="grid grid-cols-4 gap-3">
          <button onclick="openNewProjectModal()" class="flex flex-col items-center gap-2 group">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-brand-400 to-brand-600 flex items-center justify-center shadow-lg group-active:scale-95 transition">
              <i data-lucide="plus" class="w-6 h-6 text-white"></i>
            </div>
            <span class="text-[10px] font-medium text-gray-300">Desain Baru</span>
          </button>
          <button onclick="showToast('Segera Hadir: Pusat Mockup')" class="flex flex-col items-center gap-2 group">
            <div class="w-14 h-14 rounded-2xl bg-gray-800 flex items-center justify-center border border-gray-700 group-active:scale-95 transition">
              <i data-lucide="shirt" class="w-6 h-6 text-gray-300"></i>
            </div>
            <span class="text-[10px] font-medium text-gray-300">Mockup</span>
          </button>
          <button onclick="showToast('Segera Hadir: Template')" class="flex flex-col items-center gap-2 group">
            <div class="w-14 h-14 rounded-2xl bg-gray-800 flex items-center justify-center border border-gray-700 group-active:scale-95 transition">
              <i data-lucide="layout-template" class="w-6 h-6 text-gray-300"></i>
            </div>
            <span class="text-[10px] font-medium text-gray-300">Template</span>
          </button>
          <button onclick="showToast('Segera Hadir: AI Studio')" class="flex flex-col items-center gap-2 group">
            <div class="w-14 h-14 rounded-2xl bg-gray-800 flex items-center justify-center border border-gray-700 group-active:scale-95 transition">
              <i data-lucide="sparkles" class="w-6 h-6 text-purple-400"></i>
            </div>
            <span class="text-[10px] font-medium text-gray-300">AI Studio</span>
          </button>
        </div>
      </div>

      <!-- Recent Projects -->
      <div class="px-5 mb-6">
        <div class="flex justify-between items-end mb-3">
          <h2 class="text-sm font-bold text-white">Proyek Terakhir</h2>
          <button class="text-[10px] text-brand-400 font-medium">Lihat Semua</button>
        </div>
        <div id="empty-state-projects" class="bg-gray-900 border border-gray-800 rounded-xl p-6 text-center">
          <div class="w-12 h-12 bg-gray-800 rounded-full flex items-center justify-center mx-auto mb-3">
            <i data-lucide="folder-open" class="w-5 h-5 text-gray-500"></i>
          </div>
          <h3 class="text-sm font-semibold text-gray-200 mb-1">Belum ada proyek</h3>
          <p class="text-xs text-gray-500 mb-4">Mulai desain pertamamu sekarang.</p>
          <button onclick="openNewProjectModal()" class="bg-white text-gray-950 px-4 py-2 rounded-lg text-xs font-bold shadow-md active:scale-95 transition">+ Buat Desain</button>
        </div>
      </div>
    </main>

    <!-- Bottom Nav -->
    <nav class="absolute bottom-0 w-full bg-gray-900 border-t border-gray-800 pb-safe pt-2 px-6 flex justify-between items-center h-16 shrink-0 z-20">
      <button class="flex flex-col items-center gap-1 text-brand-400">
        <i data-lucide="home" class="w-5 h-5"></i><span class="text-[9px] font-semibold">Beranda</span>
      </button>
      <button onclick="showToast('Menu Proyek')" class="flex flex-col items-center gap-1 text-gray-500 hover:text-gray-300 transition">
        <i data-lucide="folder" class="w-5 h-5"></i><span class="text-[9px] font-medium">Proyek</span>
      </button>
      <button onclick="openNewProjectModal()" class="flex flex-col items-center justify-center w-12 h-12 bg-brand-500 text-white rounded-full shadow-lg -translate-y-3 active:scale-95 transition">
        <i data-lucide="plus" class="w-6 h-6"></i>
      </button>
      <button onclick="showToast('Menu Template')" class="flex flex-col items-center gap-1 text-gray-500 hover:text-gray-300 transition">
        <i data-lucide="layout" class="w-5 h-5"></i><span class="text-[9px] font-medium">Template</span>
      </button>
      <button onclick="showToast('Menu Profil')" class="flex flex-col items-center gap-1 text-gray-500 hover:text-gray-300 transition">
        <i data-lucide="user" class="w-5 h-5"></i><span class="text-[9px] font-medium">Profil</span>
      </button>
    </nav>
  </div>

  <!-- MODAL: BUAT DESAIN BARU -->
  <div id="modal-new-project" class="fixed inset-0 bg-black/80 z-50 hidden flex flex-col justify-end backdrop-blur-sm transition-opacity">
    <div class="bg-gray-900 w-full rounded-t-3xl p-5 border-t border-gray-800 transform transition-transform translate-y-full" id="modal-new-project-content">
      <div class="flex justify-between items-center mb-5">
        <h3 class="font-bold text-lg">Pilih Ukuran</h3>
        <button onclick="closeNewProjectModal()" class="w-8 h-8 bg-gray-800 rounded-full flex items-center justify-center"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      <div class="grid grid-cols-2 gap-3 mb-5">
        <button onclick="startProject(1080, 1080, 'Instagram Post')" class="bg-gray-800 border border-gray-700 p-3 rounded-xl text-left active:bg-gray-700 transition">
          <i data-lucide="instagram" class="w-5 h-5 text-pink-500 mb-2"></i>
          <h4 class="text-sm font-bold">Instagram Post</h4><p class="text-[10px] text-gray-400">1080 x 1080 px</p>
        </button>
        <button onclick="startProject(1080, 1920, 'Instagram Story')" class="bg-gray-800 border border-gray-700 p-3 rounded-xl text-left active:bg-gray-700 transition">
          <i data-lucide="smartphone" class="w-5 h-5 text-purple-400 mb-2"></i>
          <h4 class="text-sm font-bold">IG Story / TikTok</h4><p class="text-[10px] text-gray-400">1080 x 1920 px</p>
        </button>
        <button onclick="startProject(2480, 3508, 'Poster A4')" class="bg-gray-800 border border-gray-700 p-3 rounded-xl text-left active:bg-gray-700 transition">
          <i data-lucide="file-text" class="w-5 h-5 text-blue-400 mb-2"></i>
          <h4 class="text-sm font-bold">Poster A4</h4><p class="text-[10px] text-gray-400">2480 x 3508 px</p>
        </button>
        <button onclick="startProject(2000, 2000, 'Desain Kaos')" class="bg-gray-800 border border-gray-700 p-3 rounded-xl text-left active:bg-gray-700 transition">
          <i data-lucide="shirt" class="w-5 h-5 text-green-400 mb-2"></i>
          <h4 class="text-sm font-bold">Desain Apparel</h4><p class="text-[10px] text-gray-400">2000 x 2000 px</p>
        </button>
      </div>
      <div class="border-t border-gray-800 pt-4">
        <p class="text-xs text-gray-400 mb-3 font-medium uppercase tracking-wider">Ukuran Kustom (Px)</p>
        <div class="flex gap-3">
          <input type="number" id="custom-w" placeholder="Lebar" value="1080" class="flex-1 bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-sm text-center focus:border-brand-500 outline-none">
          <div class="flex items-center justify-center text-gray-500"><i data-lucide="x" class="w-3 h-3"></i></div>
          <input type="number" id="custom-h" placeholder="Tinggi" value="1080" class="flex-1 bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-sm text-center focus:border-brand-500 outline-none">
          <button onclick="startCustomProject()" class="bg-white text-gray-900 px-4 py-2 rounded-lg font-bold text-sm shadow">Buat</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== SCREEN: EDITOR ==================== -->
  <div id="screen-editor" class="flex-1 flex flex-col h-full w-full absolute inset-0 z-20 bg-gray-950 hidden opacity-0 transition-opacity duration-300">
    
    <!-- Top Bar -->
    <header class="h-14 bg-gray-900 border-b border-gray-800 flex items-center justify-between px-2 sm:px-4 z-40 shrink-0 pt-safe">
      <div class="flex items-center gap-1">
        <button onclick="closeEditor()" class="p-2 text-gray-400 hover:text-white rounded-lg"><i data-lucide="chevron-left" class="w-6 h-6"></i></button>
        <div class="flex flex-col">
          <span id="project-title" class="text-xs font-bold truncate max-w-[100px] sm:max-w-[150px]">Desain Baru</span>
          <span class="text-[9px] text-gray-500" id="project-size-label">1080 x 1080</span>
        </div>
      </div>
      <div class="flex items-center gap-1">
        <button onclick="undo()" class="p-2 text-gray-400 hover:text-white rounded-lg disabled:opacity-30"><i data-lucide="undo-2" class="w-4 h-4"></i></button>
        <button onclick="redo()" class="p-2 text-gray-400 hover:text-white rounded-lg disabled:opacity-30"><i data-lucide="redo-2" class="w-4 h-4"></i></button>
        <div class="w-[1px] h-4 bg-gray-700 mx-1"></div>
        <button onclick="exportDesign()" class="ml-1 bg-brand-500 hover:bg-brand-400 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition shadow">
          <i data-lucide="download" class="w-3.5 h-3.5"></i> <span class="hidden sm:inline">Ekspor</span>
        </button>
      </div>
    </header>

    <!-- Canvas Area -->
    <main id="canvas-container" class="flex-1 relative overflow-hidden canvas-bg flex items-center justify-center touch-none">
      <!-- Scale Wrapper for Zoom/Pan -->
      <div id="canvas-workspace" class="relative" style="transform: scale(1) translate(0px, 0px); transform-origin: center;">
        <!-- The actual Artboard -->
        <div id="artboard" class="bg-white shadow-2xl relative overflow-hidden ring-1 ring-gray-800" style="width: 1080px; height: 1080px;">
          <!-- Objects injected here -->
        </div>
        <!-- Selection/Transform Overlay -->
        <div id="selection-overlay" class="selection-box hidden">
          <div class="handle handle-tl" data-dir="tl"></div>
          <div class="handle handle-tr" data-dir="tr"></div>
          <div class="handle handle-bl" data-dir="bl"></div>
          <div class="handle handle-br" data-dir="br"></div>
          <div class="rot-line"></div>
          <div class="handle handle-rot" data-dir="rot"><i data-lucide="rotate-cw" class="w-2.5 h-2.5 text-white absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></i></div>
        </div>
      </div>
      
      <!-- Zoom Indicator -->
      <div class="absolute top-4 right-4 bg-gray-900/80 backdrop-blur rounded-full px-3 py-1 border border-gray-800 text-[10px] font-medium text-gray-300 z-30 flex gap-3 items-center shadow-lg">
        <button onclick="adjustCanvasZoom(-0.1)" class="p-1"><i data-lucide="minus" class="w-3 h-3"></i></button>
        <span id="zoom-label">100%</span>
        <button onclick="adjustCanvasZoom(0.1)" class="p-1"><i data-lucide="plus" class="w-3 h-3"></i></button>
      </div>
    </main>

    <!-- Contextual Bottom Toolbar -->
    <footer class="bg-gray-900 border-t border-gray-800 pb-safe z-40 shrink-0">
      <div id="toolbar-default" class="flex overflow-x-auto no-scrollbar items-center px-2 py-3 gap-1">
        <button onclick="addText()" class="flex-none flex flex-col items-center justify-center w-[72px] h-14 bg-gray-800 rounded-xl hover:bg-gray-700 transition">
          <i data-lucide="type" class="w-5 h-5 text-white mb-1"></i><span class="text-[9px] font-medium text-gray-300">Teks</span>
        </button>
        <button onclick="document.getElementById('image-upload').click()" class="flex-none flex flex-col items-center justify-center w-[72px] h-14 bg-gray-800 rounded-xl hover:bg-gray-700 transition">
          <i data-lucide="image" class="w-5 h-5 text-white mb-1"></i><span class="text-[9px] font-medium text-gray-300">Gambar</span>
          <input type="file" id="image-upload" accept="image/*" class="hidden" onchange="addImage(event)">
        </button>
        <button onclick="openSheet('sheet-shape')" class="flex-none flex flex-col items-center justify-center w-[72px] h-14 bg-gray-800 rounded-xl hover:bg-gray-700 transition">
          <i data-lucide="square" class="w-5 h-5 text-white mb-1"></i><span class="text-[9px] font-medium text-gray-300">Bentuk</span>
        </button>
        <button onclick="openSheet('sheet-bg')" class="flex-none flex flex-col items-center justify-center w-[72px] h-14 bg-gray-800 rounded-xl hover:bg-gray-700 transition">
          <i data-lucide="droplet" class="w-5 h-5 text-white mb-1"></i><span class="text-[9px] font-medium text-gray-300">Latar</span>
        </button>
        <div class="w-[1px] h-8 bg-gray-700 mx-1 flex-none"></div>
        <button onclick="openSheet('sheet-layers')" class="flex-none flex flex-col items-center justify-center w-[72px] h-14 bg-gray-800 rounded-xl hover:bg-gray-700 transition">
          <i data-lucide="layers" class="w-5 h-5 text-white mb-1"></i><span class="text-[9px] font-medium text-gray-300">Lapisan</span>
        </button>
      </div>

      <!-- Toolbar for Selected Object -->
      <div id="toolbar-selected" class="flex overflow-x-auto no-scrollbar items-center px-2 py-3 gap-1 hidden bg-brand-900/20">
        <button onclick="deleteSelected()" class="flex-none flex flex-col items-center justify-center w-14 h-14 bg-red-500/20 rounded-xl text-red-400">
          <i data-lucide="trash-2" class="w-5 h-5 mb-1"></i><span class="text-[9px] font-medium">Hapus</span>
        </button>
        <button onclick="duplicateSelected()" class="flex-none flex flex-col items-center justify-center w-14 h-14 bg-gray-800 rounded-xl text-gray-300">
          <i data-lucide="copy" class="w-5 h-5 mb-1"></i><span class="text-[9px] font-medium">Duplikat</span>
        </button>
        <div class="w-[1px] h-8 bg-gray-700 mx-1 flex-none"></div>
        
        <!-- Dynamic based on object type -->
        <div id="tool-options-dynamic" class="flex gap-1 items-center flex-nowrap"></div>
        
        <div class="w-[1px] h-8 bg-gray-700 mx-1 flex-none"></div>
        <button onclick="openSheet('sheet-opacity')" class="flex-none flex flex-col items-center justify-center w-16 h-14 bg-gray-800 rounded-xl text-gray-300">
          <i data-lucide="blend" class="w-5 h-5 mb-1"></i><span class="text-[9px] font-medium">Kejelasan</span>
        </button>
        <button onclick="openSheet('sheet-layers')" class="flex-none flex flex-col items-center justify-center w-16 h-14 bg-gray-800 rounded-xl text-gray-300">
          <i data-lucide="layers" class="w-5 h-5 mb-1"></i><span class="text-[9px] font-medium">Lapisan</span>
        </button>
      </div>
    </footer>
  </div>

  <!-- ==================== BOTTOM SHEETS ==================== -->
  <div id="global-backdrop" class="fixed inset-0 bg-black/60 z-50 sheet-backdrop" onclick="closeAllSheets()"></div>

  <!-- Sheet: Edit Text -->
  <div id="sheet-text-edit" class="fixed inset-x-0 bottom-0 bg-gray-900 border-t border-gray-800 rounded-t-3xl z-50 bottom-sheet pb-safe flex flex-col max-h-[80vh]">
    <div class="p-4 border-b border-gray-800 flex justify-between items-center shrink-0">
      <h3 class="font-bold text-sm">Edit Teks</h3>
      <button onclick="closeAllSheets()" class="p-1 bg-gray-800 rounded-full"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>
    <div class="p-5 overflow-y-auto space-y-4">
      <div>
        <label class="text-[10px] text-gray-400 uppercase font-bold mb-1 block">Isi Teks</label>
        <textarea id="inp-text-content" rows="2" class="w-full bg-gray-950 border border-gray-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-brand-500" oninput="updateSelected('text', this.value)"></textarea>
      </div>
      <div>
        <label class="text-[10px] text-gray-400 uppercase font-bold mb-2 block">Pilih Font</label>
        <div class="grid grid-cols-2 gap-2 max-h-40 overflow-y-auto pr-1" id="font-list-container">
          <!-- Populated by JS -->
        </div>
      </div>
      <div>
        <label class="text-[10px] text-gray-400 uppercase font-bold mb-2 block">Warna Teks</label>
        <div class="flex gap-3">
          <input type="color" id="inp-text-color" class="w-10 h-10 rounded-lg cursor-pointer bg-transparent border-0 p-0" onchange="updateSelected('color', this.value)">
          <div class="flex-1 flex gap-2 overflow-x-auto no-scrollbar items-center">
            <button onclick="updateSelected('color', '#ffffff')" class="w-8 h-8 rounded-full bg-white border border-gray-600 flex-none"></button>
            <button onclick="updateSelected('color', '#000000')" class="w-8 h-8 rounded-full bg-black border border-gray-600 flex-none"></button>
            <button onclick="updateSelected('color', '#ef4444')" class="w-8 h-8 rounded-full bg-red-500 flex-none"></button>
            <button onclick="updateSelected('color', '#3b82f6')" class="w-8 h-8 rounded-full bg-blue-500 flex-none"></button>
            <button onclick="updateSelected('color', '#10b981')" class="w-8 h-8 rounded-full bg-emerald-500 flex-none"></button>
            <button onclick="updateSelected('color', '#f59e0b')" class="w-8 h-8 rounded-full bg-amber-500 flex-none"></button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Sheet: Shape Color -->
  <div id="sheet-shape-edit" class="fixed inset-x-0 bottom-0 bg-gray-900 border-t border-gray-800 rounded-t-3xl z-50 bottom-sheet pb-safe">
    <div class="p-4 border-b border-gray-800 flex justify-between items-center">
      <h3 class="font-bold text-sm">Warna Bentuk</h3>
      <button onclick="closeAllSheets()" class="p-1 bg-gray-800 rounded-full"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>
    <div class="p-5">
      <div class="flex gap-3 mb-4">
        <input type="color" id="inp-shape-color" class="w-12 h-12 rounded-lg cursor-pointer bg-transparent border-0 p-0" onchange="updateSelected('color', this.value)">
        <div class="flex-1 grid grid-cols-6 gap-2">
          <button onclick="updateSelected('color', '#ffffff')" class="h-12 rounded-lg bg-white border border-gray-600"></button>
          <button onclick="updateSelected('color', '#000000')" class="h-12 rounded-lg bg-black border border-gray-600"></button>
          <button onclick="updateSelected('color', '#ef4444')" class="h-12 rounded-lg bg-red-500"></button>
          <button onclick="updateSelected('color', '#3b82f6')" class="h-12 rounded-lg bg-blue-500"></button>
          <button onclick="updateSelected('color', '#10b981')" class="h-12 rounded-lg bg-emerald-500"></button>
          <button onclick="updateSelected('color', '#f59e0b')" class="h-12 rounded-lg bg-amber-500"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Sheet: Opacity / Kejelasan -->
  <div id="sheet-opacity" class="fixed inset-x-0 bottom-0 bg-gray-900 border-t border-gray-800 rounded-t-3xl z-50 bottom-sheet pb-safe">
    <div class="p-4 border-b border-gray-800 flex justify-between items-center">
      <h3 class="font-bold text-sm">Kejelasan (Opacity)</h3>
      <button onclick="closeAllSheets()" class="p-1 bg-gray-800 rounded-full"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>
    <div class="p-6">
      <div class="flex items-center gap-4">
        <i data-lucide="moon" class="w-5 h-5 text-gray-500"></i>
        <input type="range" id="inp-opacity" min="0" max="1" step="0.05" class="flex-1 accent-brand-500 h-2 bg-gray-700 rounded-lg appearance-none" oninput="updateSelected('opacity', this.value)">
        <span id="val-opacity" class="text-xs font-bold w-8 text-right">100%</span>
      </div>
    </div>
  </div>

  <!-- Sheet: Lapisan (Layers) -->
  <div id="sheet-layers" class="fixed inset-x-0 bottom-0 bg-gray-900 border-t border-gray-800 rounded-t-3xl z-50 bottom-sheet pb-safe flex flex-col max-h-[70vh]">
    <div class="p-4 border-b border-gray-800 flex justify-between items-center shrink-0">
      <h3 class="font-bold text-sm">Panel Lapisan</h3>
      <button onclick="closeAllSheets()" class="p-1 bg-gray-800 rounded-full"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>
    <div class="p-4 overflow-y-auto space-y-2" id="layers-list-container">
      <!-- Populated by JS -->
    </div>
  </div>

  <!-- Sheet: Add Shape -->
  <div id="sheet-shape" class="fixed inset-x-0 bottom-0 bg-gray-900 border-t border-gray-800 rounded-t-3xl z-50 bottom-sheet pb-safe">
    <div class="p-4 border-b border-gray-800 flex justify-between items-center">
      <h3 class="font-bold text-sm">Pilih Bentuk</h3>
      <button onclick="closeAllSheets()" class="p-1 bg-gray-800 rounded-full"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>
    <div class="p-5 grid grid-cols-4 gap-4">
      <button onclick="addShape('rect')" class="aspect-square bg-gray-800 rounded-xl flex items-center justify-center hover:bg-brand-600 transition"><div class="w-8 h-8 bg-white rounded-sm"></div></button>
      <button onclick="addShape('circle')" class="aspect-square bg-gray-800 rounded-xl flex items-center justify-center hover:bg-brand-600 transition"><div class="w-8 h-8 bg-white rounded-full"></div></button>
      <button onclick="addShape('triangle')" class="aspect-square bg-gray-800 rounded-xl flex items-center justify-center hover:bg-brand-600 transition"><div class="w-0 h-0 border-l-[16px] border-l-transparent border-r-[16px] border-r-transparent border-b-[28px] border-b-white"></div></button>
    </div>
  </div>

  <!-- Sheet: Background Edit -->
  <div id="sheet-bg" class="fixed inset-x-0 bottom-0 bg-gray-900 border-t border-gray-800 rounded-t-3xl z-50 bottom-sheet pb-safe">
    <div class="p-4 border-b border-gray-800 flex justify-between items-center">
      <h3 class="font-bold text-sm">Latar Belakang</h3>
      <button onclick="closeAllSheets()" class="p-1 bg-gray-800 rounded-full"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>
    <div class="p-5">
      <label class="text-[10px] text-gray-400 uppercase font-bold mb-2 block">Warna Solid</label>
      <div class="flex gap-3 mb-4">
        <input type="color" id="inp-bg-color" value="#ffffff" class="w-12 h-12 rounded-lg cursor-pointer bg-transparent border-0 p-0" onchange="updateBackground(this.value)">
        <div class="flex-1 grid grid-cols-6 gap-2">
          <button onclick="updateBackground('#ffffff')" class="h-12 rounded-lg bg-white border border-gray-600"></button>
          <button onclick="updateBackground('#000000')" class="h-12 rounded-lg bg-black border border-gray-600"></button>
          <button onclick="updateBackground('#f3f4f6')" class="h-12 rounded-lg bg-gray-100"></button>
          <button onclick="updateBackground('#fca5a5')" class="h-12 rounded-lg bg-red-300"></button>
          <button onclick="updateBackground('#93c5fd')" class="h-12 rounded-lg bg-blue-300"></button>
          <button onclick="updateBackground('transparent')" class="h-12 rounded-lg bg-gray-800 flex items-center justify-center"><i data-lucide="ban" class="w-5 h-5 text-gray-500"></i></button>
        </div>
      </div>
    </div>
  </div>

  <!-- SCRIPT -->
  <script>
    /* ================= APP STATE ================= */
    const state = {
      project: { w: 1080, h: 1080, name: 'Desain Baru', bg: '#ffffff' },
      objects: [], // { id, type, x, y, w, h, rotation, opacity, color, text, font, src }
      selectedId: null,
      history: [],
      historyIndex: -1,
      zoom: 1.0,
      pan: { x: 0, y: 0 }
    };

    const FONTS = [
      { name: 'Inter', type: 'Sans Serif' }, { name: 'Montserrat', type: 'Modern' },
      { name: 'Bebas Neue', type: 'Display' }, { name: 'Anton', type: 'Heavy' },
      { name: 'Playfair Display', type: 'Serif' }, { name: 'Righteous', type: 'Retro' },
      { name: 'Dancing Script', type: 'Script' }, { name: 'Oswald', type: 'Tall' },
      { name: 'Lobster', type: 'Brush' }
    ];

    /* ================= INITIALIZATION ================= */
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      initFontList();
      setupTouchGestures();
    });

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = msg;
      toast.classList.remove('hidden', 'toast-anim');
      void toast.offsetWidth; // trigger reflow
      toast.classList.add('toast-anim');
      setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    /* ================= NAVIGATION ================= */
    function openNewProjectModal() {
      document.getElementById('modal-new-project').classList.remove('hidden');
      setTimeout(() => {
        document.getElementById('modal-new-project-content').classList.remove('translate-y-full');
      }, 10);
    }

    function closeNewProjectModal() {
      document.getElementById('modal-new-project-content').classList.add('translate-y-full');
      setTimeout(() => {
        document.getElementById('modal-new-project').classList.add('hidden');
      }, 300);
    }

    function startProject(w, h, name) {
      state.project = { w, h, name, bg: '#ffffff' };
      state.objects = [];
      state.selectedId = null;
      state.history = [];
      state.historyIndex = -1;
      
      closeNewProjectModal();
      document.getElementById('screen-home').classList.add('opacity-0', 'pointer-events-none');
      
      const editor = document.getElementById('screen-editor');
      editor.classList.remove('hidden');
      setTimeout(() => {
        editor.classList.remove('opacity-0');
        initEditor();
      }, 50);
    }

    function startCustomProject() {
      const w = parseInt(document.getElementById('custom-w').value) || 1080;
      const h = parseInt(document.getElementById('custom-h').value) || 1080;
      startProject(w, h, 'Kustom');
    }

    function closeEditor() {
      document.getElementById('screen-editor').classList.add('opacity-0');
      setTimeout(() => {
        document.getElementById('screen-editor').classList.add('hidden');
        document.getElementById('screen-home').classList.remove('opacity-0', 'pointer-events-none');
      }, 300);
    }

    /* ================= EDITOR CORE ================= */
    function initEditor() {
      document.getElementById('project-title').innerText = state.project.name;
      document.getElementById('project-size-label').innerText = `${state.project.w} x ${state.project.h} px`;
      
      const artboard = document.getElementById('artboard');
      artboard.style.width = `${state.project.w}px`;
      artboard.style.height = `${state.project.h}px`;
      updateBackground(state.project.bg);
      
      fitCanvas();
      saveHistory();
      renderCanvas();
    }

    function fitCanvas() {
      const container = document.getElementById('canvas-container');
      const cw = container.clientWidth - 40;
      const ch = container.clientHeight - 40;
      const scaleX = cw / state.project.w;
      const scaleY = ch / state.project.h;
      state.zoom = Math.min(scaleX, scaleY, 1);
      state.pan = { x: 0, y: 0 };
      applyCanvasTransform();
    }

    function adjustCanvasZoom(delta) {
      state.zoom = Math.max(0.1, Math.min(3, state.zoom + delta));
      applyCanvasTransform();
    }

    function applyCanvasTransform() {
      const workspace = document.getElementById('canvas-workspace');
      workspace.style.transform = `translate(${state.pan.x}px, ${state.pan.y}px) scale(${state.zoom})`;
      document.getElementById('zoom-label').innerText = `${Math.round(state.zoom * 100)}%`;
    }

    function updateBackground(color) {
      state.project.bg = color;
      document.getElementById('artboard').style.backgroundColor = color === 'transparent' ? '' : color;
      if (color === 'transparent') {
        document.getElementById('artboard').style.backgroundImage = 'linear-gradient(45deg, #ccc 25%, transparent 25%), linear-gradient(135deg, #ccc 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #ccc 75%), linear-gradient(135deg, transparent 75%, #ccc 75%)';
        document.getElementById('artboard').style.backgroundSize = '20px 20px';
        document.getElementById('artboard').style.backgroundPosition = '0 0, 10px 0, 10px -10px, 0px 10px';
      } else {
        document.getElementById('artboard').style.backgroundImage = 'none';
      }
      document.getElementById('inp-bg-color').value = color !== 'transparent' ? color : '#ffffff';
      saveHistory();
    }

    /* ================= OBJECT MANAGEMENT ================= */
    function generateId() { return 'obj_' + Math.random().toString(36).substr(2, 9); }

    function addText() {
      const obj = {
        id: generateId(), type: 'text',
        text: 'KETIK DISINI', font: 'Bebas Neue', color: '#000000',
        x: state.project.w/2 - 150, y: state.project.h/2 - 50,
        w: 300, h: 100, rotation: 0, opacity: 1
      };
      state.objects.push(obj);
      selectObject(obj.id);
      renderCanvas();
      saveHistory();
      openSheet('sheet-text-edit');
    }

    function addShape(shapeType) {
      const obj = {
        id: generateId(), type: 'shape', shapeType: shapeType,
        color: '#0ea5e9', x: state.project.w/2 - 100, y: state.project.h/2 - 100,
        w: 200, h: 200, rotation: 0, opacity: 1
      };
      state.objects.push(obj);
      selectObject(obj.id);
      renderCanvas();
      saveHistory();
      closeAllSheets();
    }

    function addImage(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          const max = 800; // auto downscale for canvas fit
          if (w > max || h > max) {
            const ratio = Math.min(max/w, max/h);
            w *= ratio; h *= ratio;
          }
          const obj = {
            id: generateId(), type: 'image', src: ev.target.result,
            x: state.project.w/2 - w/2, y: state.project.h/2 - h/2,
            w: w, h: h, rotation: 0, opacity: 1
          };
          state.objects.push(obj);
          selectObject(obj.id);
          renderCanvas();
          saveHistory();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
      e.target.value = ''; // reset
    }

    function deleteSelected() {
      if (!state.selectedId) return;
      state.objects = state.objects.filter(o => o.id !== state.selectedId);
      selectObject(null);
      renderCanvas();
      saveHistory();
      showToast("Objek dihapus");
    }

    function duplicateSelected() {
      if (!state.selectedId) return;
      const obj = state.objects.find(o => o.id === state.selectedId);
      const clone = JSON.parse(JSON.stringify(obj));
      clone.id = generateId();
      clone.x += 40; clone.y += 40;
      state.objects.push(clone);
      selectObject(clone.id);
      renderCanvas();
      saveHistory();
      showToast("Objek diduplikat");
    }

    function updateSelected(key, val) {
      if (!state.selectedId) return;
      const obj = state.objects.find(o => o.id === state.selectedId);
      if (obj) {
        obj[key] = val;
        renderCanvas();
        // Debounce history save for sliders/inputs
        clearTimeout(window.saveTimer);
        window.saveTimer = setTimeout(saveHistory, 500);
      }
    }

    /* ================= RENDERING ================= */
    function renderCanvas() {
      const artboard = document.getElementById('artboard');
      // Keep only selection box, remove old objects
      Array.from(artboard.children).forEach(child => {
        if (child.id !== 'selection-overlay') artboard.removeChild(child);
      });

      state.objects.forEach(obj => {
        const el = document.createElement('div');
        el.className = 'canvas-object';
        el.id = `el_${obj.id}`;
        el.style.width = `${obj.w}px`;
        el.style.height = `${obj.h}px`;
        el.style.transform = `translate(${obj.x}px, ${obj.y}px) rotate(${obj.rotation}deg)`;
        el.style.opacity = obj.opacity;
        
        // Touch events for selection/dragging
        el.addEventListener('pointerdown', (e) => initObjectDrag(e, obj.id));

        if (obj.type === 'text') {
          el.innerText = obj.text;
          el.style.fontFamily = `'${obj.font}', sans-serif`;
          el.style.color = obj.color;
          el.style.fontSize = `${obj.h * 0.8}px`; // simple scale
          el.style.lineHeight = '1';
          el.style.display = 'flex';
          el.style.alignItems = 'center';
          el.style.justifyContent = 'center';
          el.style.textAlign = 'center';
        } 
        else if (obj.type === 'shape') {
          if (obj.shapeType === 'rect') {
            el.style.backgroundColor = obj.color;
          } else if (obj.shapeType === 'circle') {
            el.style.backgroundColor = obj.color;
            el.style.borderRadius = '50%';
          } else if (obj.shapeType === 'triangle') {
            el.innerHTML = `<svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none"><polygon points="50,0 100,100 0,100" fill="${obj.color}"/></svg>`;
          }
        }
        else if (obj.type === 'image') {
          el.innerHTML = `<img src="${obj.src}" style="width:100%; height:100%; object-fit:contain; pointer-events:none;">`;
        }
        
        artboard.appendChild(el);
      });
      
      updateSelectionUI();
    }

    function selectObject(id) {
      state.selectedId = id;
      updateSelectionUI();
      updateToolbar();
      if (id) syncSheetInputs(id);
    }

    function updateSelectionUI() {
      const selBox = document.getElementById('selection-overlay');
      if (!state.selectedId) {
        selBox.classList.add('hidden');
        return;
      }
      
      const obj = state.objects.find(o => o.id === state.selectedId);
      if (obj) {
        selBox.classList.remove('hidden');
        selBox.style.width = `${obj.w}px`;
        selBox.style.height = `${obj.h}px`;
        selBox.style.transform = `translate(${obj.x}px, ${obj.y}px) rotate(${obj.rotation}deg)`;
        
        // Move selection box to end of DOM so handles are on top
        document.getElementById('artboard').appendChild(selBox);
      }
    }

    function updateToolbar() {
      const tbDefault = document.getElementById('toolbar-default');
      const tbSelected = document.getElementById('toolbar-selected');
      const tbDynamic = document.getElementById('tool-options-dynamic');
      
      if (!state.selectedId) {
        tbDefault.classList.remove('hidden');
        tbSelected.classList.add('hidden');
      } else {
        tbDefault.classList.add('hidden');
        tbSelected.classList.remove('hidden');
        
        const obj = state.objects.find(o => o.id === state.selectedId);
        let dynHTML = '';
        if (obj.type === 'text') {
          dynHTML = `
            <button onclick="openSheet('sheet-text-edit')" class="flex-none flex flex-col items-center justify-center w-16 h-14 bg-gray-800 rounded-xl text-brand-400">
              <i data-lucide="edit-2" class="w-5 h-5 mb-1"></i><span class="text-[9px] font-medium">Edit Teks</span>
            </button>`;
        } else if (obj.type === 'shape') {
          dynHTML = `
            <button onclick="openSheet('sheet-shape-edit')" class="flex-none flex flex-col items-center justify-center w-16 h-14 bg-gray-800 rounded-xl text-brand-400">
              <i data-lucide="palette" class="w-5 h-5 mb-1"></i><span class="text-[9px] font-medium">Warna</span>
            </button>`;
        }
        tbDynamic.innerHTML = dynHTML;
        lucide.createIcons();
      }
    }

    function syncSheetInputs(id) {
      const obj = state.objects.find(o => o.id === id);
      if (!obj) return;
      document.getElementById('inp-opacity').value = obj.opacity;
      document.getElementById('val-opacity').innerText = Math.round(obj.opacity * 100) + '%';
      
      if (obj.type === 'text') {
        document.getElementById('inp-text-content').value = obj.text;
        document.getElementById('inp-text-color').value = obj.color;
      } else if (obj.type === 'shape') {
        document.getElementById('inp-shape-color').value = obj.color;
      }
    }

    /* ================= TOUCH & GESTURES ================= */
    let dragData = null;

    function getPos(e) {
      if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      return { x: e.clientX, y: e.clientY };
    }

    function setupTouchGestures() {
      const workspace = document.getElementById('canvas-workspace');
      
      // Tap on empty space to deselect
      document.getElementById('canvas-container').addEventListener('pointerdown', (e) => {
        if (e.target.id === 'canvas-container' || e.target.id === 'canvas-workspace' || e.target.id === 'artboard') {
          selectObject(null);
        }
      });

      // Handle Transform/Resize points
      document.querySelectorAll('.handle').forEach(handle => {
        handle.addEventListener('pointerdown', initTransform);
      });
    }

    function initObjectDrag(e, id) {
      e.stopPropagation();
      selectObject(id);
      const obj = state.objects.find(o => o.id === id);
      const startPos = getPos(e);
      dragData = { type: 'move', obj, startX: startPos.x, startY: startPos.y, origX: obj.x, origY: obj.y };
      
      window.addEventListener('pointermove', doDrag);
      window.addEventListener('pointerup', stopDrag);
    }

    function initTransform(e) {
      e.stopPropagation();
      const dir = e.target.dataset.dir;
      const obj = state.objects.find(o => o.id === state.selectedId);
      if(!obj) return;
      
      const startPos = getPos(e);
      
      // Calculate center for rotation
      const selBox = document.getElementById('selection-overlay').getBoundingClientRect();
      const centerX = selBox.left + selBox.width / 2;
      const centerY = selBox.top + selBox.height / 2;

      dragData = { 
        type: dir === 'rot' ? 'rotate' : 'resize', dir, obj, 
        startX: startPos.x, startY: startPos.y, 
        origX: obj.x, origY: obj.y, origW: obj.w, origH: obj.h, origRot: obj.rotation,
        centerX, centerY
      };
      
      window.addEventListener('pointermove', doDrag);
      window.addEventListener('pointerup', stopDrag);
    }

    function doDrag(e) {
      if (!dragData) return;
      e.preventDefault();
      const pos = getPos(e);
      const dx = (pos.x - dragData.startX) / state.zoom;
      const dy = (pos.y - dragData.startY) / state.zoom;
      
      if (dragData.type === 'move') {
        dragData.obj.x = dragData.origX + dx;
        dragData.obj.y = dragData.origY + dy;
      } 
      else if (dragData.type === 'resize') {
        // Simple uniform scale based on dx for touch friendliness (can be improved)
        let scaleDelta = dx; 
        if (dragData.dir.includes('l')) scaleDelta = -dx;
        
        const aspect = dragData.origH / dragData.origW;
        const newW = Math.max(20, dragData.origW + scaleDelta);
        const newH = dragData.obj.type === 'text' ? newW * aspect : Math.max(20, dragData.origH + (scaleDelta * aspect));
        
        dragData.obj.w = newW;
        dragData.obj.h = newH;
        
        // Adjust X/Y so it scales from opposite corner (simplified for v1)
      }
      else if (dragData.type === 'rotate') {
        const rad = Math.atan2(pos.y - dragData.centerY, pos.x - dragData.centerX);
        let deg = rad * (180 / Math.PI) + 90; // +90 because handle is at top
        dragData.obj.rotation = Math.round(deg);
      }
      
      renderCanvas();
    }

    function stopDrag() {
      if (dragData) saveHistory();
      dragData = null;
      window.removeEventListener('pointermove', doDrag);
      window.removeEventListener('pointerup', stopDrag);
    }

    /* ================= BOTTOM SHEETS ================= */
    function openSheet(id) {
      closeAllSheets();
      document.getElementById('global-backdrop').classList.add('open');
      document.getElementById(id).classList.add('open');
      
      if (id === 'sheet-layers') buildLayersList();
    }

    function closeAllSheets() {
      document.getElementById('global-backdrop').classList.remove('open');
      document.querySelectorAll('.bottom-sheet').forEach(el => el.classList.remove('open'));
    }

    /* ================= FONTS & LAYERS ================= */
    function initFontList() {
      const container = document.getElementById('font-list-container');
      container.innerHTML = FONTS.map(f => `
        <button onclick="updateSelected('font', '${f.name}')" class="p-3 bg-gray-800 rounded-xl text-left border border-gray-700 hover:border-brand-500 transition focus:border-brand-500">
          <span style="font-family: '${f.name}', sans-serif;" class="text-sm text-white block mb-1">${f.name}</span>
          <span class="text-[9px] text-gray-500 uppercase tracking-widest">${f.type}</span>
        </button>
      `).join('');
    }

    function buildLayersList() {
      const container = document.getElementById('layers-list-container');
      if (state.objects.length === 0) {
        container.innerHTML = `<p class="text-xs text-gray-500 text-center py-4">Belum ada objek.</p>`;
        return;
      }
      
      container.innerHTML = [...state.objects].reverse().map((obj, i) => {
        const trueIndex = state.objects.length - 1 - i;
        const isSel = obj.id === state.selectedId;
        const icon = obj.type === 'text' ? 'type' : (obj.type === 'image' ? 'image' : 'square');
        const label = obj.type === 'text' ? obj.text.substring(0,10) : obj.type;
        return `
          <div class="flex items-center justify-between bg-gray-800 p-3 rounded-xl border ${isSel ? 'border-brand-500' : 'border-gray-700'}">
            <div class="flex items-center gap-3 cursor-pointer flex-1" onclick="selectObject('${obj.id}')">
              <i data-lucide="${icon}" class="w-4 h-4 text-gray-400"></i>
              <span class="text-xs font-medium">${label}</span>
            </div>
            <div class="flex items-center gap-1">
              <button onclick="moveLayer(${trueIndex}, 1)" class="p-1.5 text-gray-400 hover:text-white" ${trueIndex === state.objects.length-1 ? 'disabled opacity-30' : ''}><i data-lucide="chevron-up" class="w-4 h-4"></i></button>
              <button onclick="moveLayer(${trueIndex}, -1)" class="p-1.5 text-gray-400 hover:text-white" ${trueIndex === 0 ? 'disabled opacity-30' : ''}><i data-lucide="chevron-down" class="w-4 h-4"></i></button>
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    function moveLayer(index, dir) {
      if (index + dir < 0 || index + dir >= state.objects.length) return;
      const temp = state.objects[index];
      state.objects[index] = state.objects[index + dir];
      state.objects[index + dir] = temp;
      renderCanvas();
      saveHistory();
      buildLayersList(); // refresh sheet
    }

    /* ================= HISTORY & EXPORT ================= */
    function saveHistory() {
      // Basic immutability using stringify
      const snap = {
        objects: JSON.parse(JSON.stringify(state.objects)),
        bg: state.project.bg
      };
      // Trim future history if we're in middle of undo tree
      if (state.historyIndex < state.history.length - 1) {
        state.history = state.history.slice(0, state.historyIndex + 1);
      }
      state.history.push(snap);
      state.historyIndex = state.history.length - 1;
      
      // Limit history size for mobile memory
      if (state.history.length > 30) {
        state.history.shift();
        state.historyIndex--;
      }
    }

    function undo() {
      if (state.historyIndex > 0) {
        state.historyIndex--;
        restoreState(state.history[state.historyIndex]);
      } else {
        showToast("Tidak bisa batalkan lagi");
      }
    }

    function redo() {
      if (state.historyIndex < state.history.length - 1) {
        state.historyIndex++;
        restoreState(state.history[state.historyIndex]);
      }
    }

    function restoreState(snap) {
      state.objects = JSON.parse(JSON.stringify(snap.objects));
      selectObject(null);
      updateBackground(snap.bg);
      renderCanvas();
    }

    function exportDesign() {
      showToast("Menyiapkan ekspor...");
      selectObject(null); // Hide selection box
      
      const artboard = document.getElementById('artboard');
      
      // Temporarily reset transform for clean export
      const workspace = document.getElementById('canvas-workspace');
      const oldTransform = workspace.style.transform;
      workspace.style.transform = `scale(1) translate(0,0)`;
      
      html2canvas(artboard, {
        scale: 2, // High quality
        useCORS: true,
        backgroundColor: state.project.bg === 'transparent' ? null : state.project.bg
      }).then(canvas => {
        // Restore transform
        workspace.style.transform = oldTransform;
        
        const link = document.createElement('a');
        link.download = `KREAVIO_${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        showToast("Berhasil diekspor!");
      }).catch(err => {
        workspace.style.transform = oldTransform;
        showToast("Gagal mengekspor.");
        console.error(err);
      });
    }

  </script>
</body>
</html>
