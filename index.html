<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Board Game Collection - 1888</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="icon" type="image/png" href="1000041752.png">
    <link rel="apple-touch-icon" href="1000041752.png">

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Special+Elite&display=swap');

        :root {
            --wood-dark: #3d2b1f; --wood-light: #5d4037; --brass: #b7950b;
            --paper: #d7ccc8; --gold-fire: linear-gradient(90deg, #ff4500, #ffd700, #ffffff, #ffd700, #ff4500);
            --shadow-out: 4px 4px 8px rgba(0,0,0,0.4); --shadow-in: inset 4px 4px 8px rgba(0,0,0,0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: radial-gradient(circle, #2c1e16 0%, #1a0f0a 100%);
            color: var(--paper); font-family: 'Special Elite', cursive;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow: hidden;
        }

        /* --- UI ELEMENTS --- */
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(8px); }
        .card-vintage { background: var(--wood-light); padding: 25px; border: 8px double var(--brass); border-radius: 5px; text-align: center; width: 90%; max-width: 400px; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
        .app-logo { width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--brass); margin-bottom: 10px; object-fit: cover; }
        
        .name-input { width: 100%; padding: 12px; background: #2a1b12; color: var(--paper); border: none; margin-bottom: 15px; text-align: center; font-family: 'Special Elite'; box-shadow: var(--shadow-in); outline: none; }
        .btn-choice { padding: 12px 15px; border: 1px solid var(--brass); background: var(--wood-light); color: var(--brass); font-weight: bold; cursor: pointer; border-radius: 8px; font-family: 'Cinzel'; width: 100%; margin-top: 10px; transition: 0.2s; box-shadow: var(--shadow-out); }
        .btn-choice:disabled { background: #333 !important; color: #666 !important; cursor: not-allowed; opacity: 0.6; box-shadow: none; }
        
        /* Layout Tombol X/O agar Sejajar */
        .role-container { display: flex; gap: 10px; margin-top: 10px; }
        .role-container button { flex: 1; }

        /* Tombol Refresh Melayang */
        #btn-refresh { 
            position: fixed; top: 20px; right: 20px; width: 45px; height: 45px; 
            background: var(--wood-light); border: 2px solid var(--brass); color: var(--brass);
            border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center;
            box-shadow: var(--shadow-out); z-index: 100; font-size: 20px;
        }
        #btn-refresh:active { transform: rotate(90deg); transition: 0.2s; }

        /* --- BOARD --- */
        .board-wrapper { transform: rotateX(20deg); perspective: 1200px; background: var(--wood-dark); padding: 10px; border-radius: 8px; box-shadow: 0 15px 35px rgba(0,0,0,0.8); margin-top: 5px; }
        .board-xoxo { display: grid; grid-template-columns: repeat(10, 8.5vw); grid-template-rows: repeat(10, 8.5vw); gap: 2px; }
        .block { width: 100%; height: 100%; background: var(--wood-light); display: flex; justify-content: center; align-items: center; font-family: 'Cinzel'; cursor: pointer; box-shadow: var(--shadow-out); }
        .x-icon { color: #d32f2f; font-size: 5vw; font-weight: bold; } 
        .o-icon { color: var(--brass); font-size: 5vw; font-weight: bold; }
        #status { margin: 20px 0 10px 0; font-size: 0.8rem; text-transform: uppercase; color: var(--brass); font-weight: bold; }
    </style>
</head>
<body>

    <button id="btn-refresh" onclick="resetGame()" title="Reset Papan">↻</button>

    <div id="overlay">
        <div class="card-vintage">
            <img src="1000041752.png" alt="Logo" class="app-logo">
            <h1 style="color: var(--brass); margin-bottom: 15px; font-family: 'Cinzel';">GRAND LOBBY</h1>
            <input type="text" id="inputNama" class="name-input" placeholder="GELAR ANDA..." maxlength="10">
            
            <button class="btn-choice" id="main-select-btn" onclick="selectGame('XOXO')">MASUK TIC-TAC-TOE</button>
            
            <div id="role-select" style="display:none; margin-top: 15px; border-top: 2px solid var(--brass); padding-top: 15px;">
                <p style="font-size: 0.7rem; color: var(--brass); margin-bottom: 5px;">PILIH KUBURAN ANDA:</p>
                <div class="role-container">
                    <button id="btn1" class="btn-choice" onclick="confirmStart(1)">PIHAK X</button>
                    <button id="btn2" class="btn-choice" onclick="confirmStart(2)">PIHAK O</button>
                </div>
            </div>
        </div>
    </div>

    <div id="status">PILIH PERAN DI LOBBY</div>

    <div class="board-wrapper">
        <div id="main-board" class="board-xoxo"></div>
    </div>

    <script>
        // PWA Setup
        if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); }); }

        const firebaseConfig = {
            apiKey: "AIzaSyBlL2HCkJYw_wNTMvJpDUpmJzw1-plQTm0",
            databaseURL: "https://tic-tac-toe-api-5a2c0-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "tic-tac-toe-api-5a2c0",
        };
        firebase.initializeApp(firebaseConfig);
        let db = null;

        // --- AUDIO ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, duration, type = 'sine') {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        // --- GAME LOGIC ---
        let myRole = "", turn = "", myName = "", isGameOver = false;

        function selectGame(game) {
            const n = document.getElementById('inputNama').value;
            if(!n) return alert("MASUKKAN NAMA!");
            myName = n;
            db = firebase.database().ref('multi_game_v1/' + game);
            
            document.getElementById('main-select-btn').style.display = 'none';
            document.getElementById('role-select').style.display = 'block';

            // Sinkronisasi tombol peran agar tidak tabrakan
            db.child('names').on('value', s => {
                const names = s.val() || {};
                document.getElementById('btn1').disabled = !!names.X;
                document.getElementById('btn2').disabled = !!names.O;
            });
        }

        function confirmStart(choice) {
            myRole = choice === 1 ? 'X' : 'O';
            db.child('names/' + myRole).set(myName);
            document.getElementById('overlay').style.display = 'none';
            initBoard();
            syncGame();
            playSound(440, 0.2);
        }

        function initBoard() {
            const board = document.getElementById('main-board');
            board.innerHTML = "";
            for(let i=0; i<100; i++) {
                const b = document.createElement('div'); 
                b.className = 'block'; b.id = `block-${i}`;
                b.onclick = () => {
                    if(turn === myRole && !isGameOver) {
                        db.child('cells/' + i).once('value', snapshot => {
                            if(!snapshot.exists()) {
                                db.child('cells/' + i).set(myRole);
                                db.child('turn').set(myRole === 'X' ? 'O' : 'X');
                                playSound(600, 0.1);
                            }
                        });
                    }
                };
                board.appendChild(b);
            }
        }

        function resetGame() {
            if(!db) return;
            if(confirm("BERSIHKAN PAPAN PERMAINAN?")) {
                db.child('cells').remove();
                db.child('winner').remove();
                db.child('turn').set('X');
                isGameOver = false;
                playSound(300, 0.3);
            }
        }

        function syncGame() {
            db.child('cells').on('value', s => {
                const cells = s.val() || {};
                // Reset semua visual sebelum update
                document.querySelectorAll('.block').forEach(b => b.innerHTML = "");
                Object.keys(cells).forEach(idx => {
                    const el = document.getElementById(`block-${idx}`);
                    if(el) el.innerHTML = `<span class="${cells[idx]==='X'?'x-icon':'o-icon'}">${cells[idx]}</span>`;
                });
            });

            db.child('turn').on('value', s => {
                turn = s.val() || 'X';
                document.getElementById('status').innerText = (turn === myRole) ? "GILIRAN ANDA" : "LAWAN BERPIKIR...";
            });

            db.child('winner').on('value', s => {
                if(s.exists()) {
                    isGameOver = true;
                    document.getElementById('status').innerHTML = `<b style="color:gold">${s.val().name.toUpperCase()} MENANG!</b>`;
                }
            });
        }
    </script>
</body>
</html>
