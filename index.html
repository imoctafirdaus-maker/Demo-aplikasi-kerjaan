<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-color=1.0, user-scalable=no">
    <title>Chess Multiplayer - Okta Edition</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <!-- Library Game Catur -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <style>
        ::-webkit-scrollbar { width: 0; background: transparent; }
        
        .page { display: none; height: 100%; flex-direction: column; }
        .page.active { display: flex; }
        
        /* CSS KHUSUS GAME CATUR */
        .chess-container { width: 100%; max-width: 450px; aspect-ratio: 1; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); box-sizing: border-box; margin: 0 auto; border: 4px solid #4a2e1b; border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); background-color: #4a2e1b; overflow: hidden; position: relative; }
        .chess-sq { position: relative; display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; user-select: none; box-sizing: border-box; }
        .chess-light { background-color: #f0d9b5; color: #b58863; }
        .chess-dark { background-color: #b58863; color: #f0d9b5; }
        .chess-piece { width: 95%; height: 95%; z-index: 10; cursor: pointer; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.3)); transition: transform 0.15s ease-out; object-fit: contain; }
        .chess-piece.dragging { transform: scale(1.2); z-index: 100; cursor: grabbing; filter: drop-shadow(0 15px 20px rgba(0,0,0,0.5)); }
        .chess-hl { position: absolute; inset: 0; background-color: rgba(246, 246, 105, 0.5); z-index: 5; }
        .chess-last-move { position: absolute; inset: 0; background-color: rgba(255, 255, 51, 0.4); z-index: 4; }
        .chess-legal-dot { position: absolute; width: 25%; height: 25%; background-color: rgba(0,0,0,0.2); border-radius: 50%; z-index: 6; pointer-events: none; }
        .chess-legal-cap { position: absolute; width: 90%; height: 90%; border: 6px solid rgba(0,0,0,0.2); border-radius: 50%; z-index: 6; pointer-events: none; }
        .chess-check-hl { position: absolute; inset: 0; background: radial-gradient(circle, rgba(255,0,0,0.8) 0%, rgba(255,0,0,0) 80%); z-index: 4; }
        
        .timer-active { background-color: #ffffff !important; color: #16a34a !important; box-shadow: 0 0 15px rgba(22, 163, 74, 0.5); }
        .timer-inactive { background-color: #374151 !important; color: #9ca3af !important; }

        .checkbox-custom { appearance: none; -webkit-appearance: none; width: 20px; height: 20px; border: 2px solid #a855f7; border-radius: 4px; background-color: white; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; position: relative; }
        .checkbox-custom:checked::after { content: "\f00c"; font-family: "Font Awesome 5 Free"; font-weight: 900; color: #a855f7; font-size: 12px; }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #4b5563; border-radius: 4px; }
        .chess-anim-piece { position: absolute; z-index: 999; transition: transform 0.2s ease-in-out; pointer-events: none; }
    </style>
</head>
<body class="bg-[#161512] h-screen font-sans text-gray-200 flex flex-col overflow-hidden">

    <!-- AUDIO CATUR -->
    <audio id="snd-move" src="https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/move-self.mp3" preload="auto"></audio>
    <audio id="snd-capture" src="https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/capture.mp3" preload="auto"></audio>
    <audio id="snd-check" src="https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/check.mp3" preload="auto"></audio>
    <audio id="snd-end" src="https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/game-end.mp3" preload="auto"></audio>
    <audio id="snd-promote" src="https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/promote.mp3" preload="auto"></audio>
    <audio id="snd-castle" src="https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/castle.mp3" preload="auto"></audio>

    <!-- MODAL CATUR -->
    <div id="promoModal" class="fixed inset-0 bg-black/80 z-[10020] hidden flex-col items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-gray-800 p-6 rounded-3xl text-center w-64 shadow-2xl border border-gray-700">
            <h3 class="font-black text-white uppercase mb-4 text-sm tracking-widest">Promosi Bidak</h3>
            <div class="grid grid-cols-2 gap-4" id="promoOptions"></div>
        </div>
    </div>

    <div id="challengeModal" class="fixed inset-0 bg-black/80 z-[10020] hidden flex-col items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-gray-900 p-8 rounded-3xl text-center shadow-2xl border border-emerald-700">
            <i class="fa fa-chess-knight text-5xl text-emerald-500 mb-4 animate-bounce"></i>
            <h3 class="font-black text-white uppercase text-xl" id="challengerName">User</h3>
            <p class="text-xs font-bold text-gray-400 mb-6 tracking-widest">MENANTANG ANDA BERMAIN CATUR</p>
            <div class="flex gap-3">
                <button onclick="acceptChallenge()" class="flex-1 bg-emerald-600 text-white py-3 rounded-xl font-black uppercase shadow-lg hover:bg-emerald-500">Terima</button>
                <button onclick="rejectChallenge()" class="flex-1 bg-red-600 text-white py-3 rounded-xl font-black uppercase shadow-lg hover:bg-red-500">Tolak</button>
            </div>
        </div>
    </div>

    <div id="chessAlert" class="fixed top-10 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-8 py-4 rounded-2xl font-black uppercase text-sm shadow-2xl z-[10030] hidden transition-all duration-300 border-2 border-emerald-500 flex items-center gap-3"></div>

    <!-- HALAMAN LOGIN -->
    <div id="page-login" class="page active p-6 flex flex-col items-center justify-center relative">
        <div class="text-center mb-8">
            <i class="fa fa-chess text-6xl text-emerald-500 mb-4 drop-shadow-[0_0_15px_rgba(16,185,129,0.5)]"></i>
            <h1 class="font-black italic text-4xl text-white uppercase">Chess <span class="text-emerald-500">Pro</span></h1>
            <p class="text-gray-400 font-bold uppercase tracking-widest text-xs mt-2">Multiplayer Engine</p>
        </div>
        <div class="bg-gray-800 p-8 rounded-[2.5rem] shadow-2xl w-full max-w-sm text-center border border-gray-700">
            <p class="text-xs text-gray-400 mb-4 font-bold uppercase">Masukkan Nama Anda</p>
            <input type="text" id="inputUsername" placeholder="Contoh: Okta, Budi, dsb..." class="w-full text-center text-lg font-black p-4 bg-gray-900 text-white rounded-2xl mb-6 outline-none border border-gray-600 focus:border-emerald-500 transition-colors">
            <button onclick="prosesLogin()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-4 rounded-2xl font-black uppercase shadow-[0_0_20px_rgba(16,185,129,0.3)] transition-all">Mulai Bermain</button>
        </div>
    </div>

    <!-- HALAMAN LOBBY -->
    <div id="page-lobby" class="page p-6 overflow-y-auto">
        <div class="flex justify-between items-center mb-8">
            <div class="flex items-center gap-3">
                <img id="navUserAvatar" src="" class="w-10 h-10 rounded-full border-2 border-emerald-500 object-cover shadow-lg">
                <div class="flex flex-col">
                    <span id="userDisplay" class="font-black text-white uppercase text-lg">User</span>
                    <span class="text-[9px] text-emerald-400 font-bold tracking-widest uppercase">Online</span>
                </div>
            </div>
            <button onclick="handleLogout()" class="bg-red-600/20 text-red-500 border border-red-500/50 w-10 h-10 rounded-xl flex items-center justify-center hover:bg-red-600 hover:text-white transition-colors"><i class="fa fa-power-off"></i></button>
        </div>
        
        <h3 class="text-xs font-black text-gray-400 uppercase mb-3 px-1 tracking-widest flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span> Pertandingan Live</h3>
        <div id="chessLiveList" class="space-y-3 mb-8"></div>

        <h3 class="text-xs font-black text-gray-400 uppercase mb-3 px-1 tracking-widest">Daftar Pemain Online</h3>
        <div class="bg-gray-800 p-5 rounded-3xl shadow-xl border border-gray-700">
            <div id="chessOnlineList" class="space-y-3"></div>
        </div>
    </div>

    <!-- HALAMAN GAME CATUR -->
    <div id="page-game" class="page flex-col pb-6 pt-4 overflow-y-auto justify-start">
        <div class="flex flex-col justify-start items-center px-4 max-w-lg mx-auto w-full relative h-max">
            
            <!-- Header Lawan -->
            <div class="w-full flex justify-between items-center mb-3">
                <button onclick="keluarGame()" class="absolute -top-2 -left-2 bg-gray-800 text-gray-400 w-10 h-10 rounded-full flex items-center justify-center hover:text-white border border-gray-700 z-10" title="Keluar ke Lobby"><i class="fa fa-arrow-left"></i></button>
                
                <div class="flex items-center gap-3 ml-10">
                    <img id="chessOpponentAvatar" class="w-10 h-10 rounded bg-gray-700 object-cover border border-gray-600">
                    <div class="flex flex-col">
                        <span id="chessOpponentName" class="font-black text-gray-200 text-sm">Opponent</span>
                        <span id="chessOpponentScore" class="text-[9px] text-yellow-400 font-bold">🏆 Win : 0 ❌ Lose : 0 🤝 Draw : 0</span>
                    </div>
                </div>
                <div id="chessOpponentTimerBox" class="timer-inactive px-4 py-2 rounded font-mono font-bold text-lg">
                    <span id="chessOpponentTime">10:00</span>
                </div>
            </div>

            <!-- Papan Catur -->
            <div id="chessBoard" class="chess-container shadow-2xl"></div>

            <!-- Header Pemain Sendiri -->
            <div class="w-full flex justify-between items-center mt-3">
                <div class="flex items-center gap-3">
                    <img id="chessMyAvatar" class="w-10 h-10 rounded bg-emerald-600 object-cover border-2 border-emerald-500">
                    <div class="flex flex-col">
                        <span class="font-black text-white text-sm" id="myChessNameDisplay">Anda</span>
                        <div class="flex items-center gap-2">
                            <span class="text-[9px] text-gray-400 font-bold bg-gray-800 px-1.5 py-0.5 rounded" id="myChessColorLabel">White</span>
                            <span id="myChessScore" class="text-[9px] text-yellow-400 font-bold">🏆 Win : 0 ❌ Lose : 0 🤝 Draw : 0</span>
                        </div>
                    </div>
                </div>
                <div id="chessMyTimerBox" class="timer-inactive px-4 py-2 rounded font-mono font-bold text-lg">
                    <span id="chessMyTime">10:00</span>
                </div>
            </div>
            
            <!-- Bot Toggle (Hanya Muncul Jika Login Sebagai "Okta") -->
            <div id="oktaBotContainer" class="w-full mt-3 hidden flex justify-between items-center bg-purple-900/30 p-3 rounded-xl border border-purple-500/50 shadow-md">
                <span class="text-xs font-bold text-purple-300 uppercase tracking-widest"><i class="fa fa-robot mr-2"></i>Aktifkan Bot GM</span>
                <input type="checkbox" id="oktaBotToggle" class="checkbox-custom !border-purple-500">
            </div>

            <!-- Reset Game Button -->
            <div id="chessResetContainer" class="w-full flex justify-center mt-4 hidden">
                <button onclick="resetChessGame()" id="btnResetGame" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-xl font-black uppercase shadow-lg text-sm w-full transition-all border border-blue-400/50">Reset Game</button>
            </div>
            
            <!-- Chat Box -->
            <div class="w-full mt-4 bg-gray-800 rounded-xl p-3 flex flex-col shadow-xl border border-gray-700" style="height: 180px;">
                <div id="chessChatHistory" class="flex-1 overflow-y-auto space-y-2 mb-2 pr-1 custom-scrollbar text-[11px]"></div>
                <div class="flex gap-2">
                    <input type="text" id="chessChatInput" placeholder="Ketik pesan..." class="flex-1 bg-gray-900 text-white px-3 py-2 rounded-lg outline-none text-xs border border-gray-600 font-bold focus:border-emerald-500" onkeypress="if(event.key==='Enter') sendChessChat()">
                    <button onclick="sendChessChat()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg font-bold shadow-md transition-colors"><i class="fa fa-paper-plane text-xs"></i></button>
                </div>
            </div>
            
        </div>
    </div>

    <script>
        // Konfigurasi Database Utama Firebase (Sesuai source asli)
        const firebaseConfig = { 
            apiKey: "AIzaSyAZ7twf8SbcK-HqniDmVqT6k8IM3ehFtgc", 
            databaseURL: "https://trackcust-jtm-default-rtdb.asia-southeast1.firebasedatabase.app", 
            projectId: "trackcust-jtm" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        let currentUser = localStorage.getItem('chess_pro_user') || "";
        let sessionID = Math.random().toString(36).substring(2, 15);
        
        // VARIABEL GAME CATUR
        const pieceIcons = {
            'w': { 
                'p': 'https://chessboardjs.com/img/chesspieces/wikipedia/wP.png', 
                'n': 'https://chessboardjs.com/img/chesspieces/wikipedia/wN.png', 
                'b': 'https://chessboardjs.com/img/chesspieces/wikipedia/wB.png', 
                'r': 'https://chessboardjs.com/img/chesspieces/wikipedia/wR.png', 
                'q': 'https://chessboardjs.com/img/chesspieces/wikipedia/wQ.png', 
                'k': 'https://chessboardjs.com/img/chesspieces/wikipedia/wK.png' 
            },
            'b': { 
                'p': 'https://chessboardjs.com/img/chesspieces/wikipedia/bP.png', 
                'n': 'https://chessboardjs.com/img/chesspieces/wikipedia/bN.png', 
                'b': 'https://chessboardjs.com/img/chesspieces/wikipedia/bB.png', 
                'r': 'https://chessboardjs.com/img/chesspieces/wikipedia/bR.png', 
                'q': 'https://chessboardjs.com/img/chesspieces/wikipedia/bQ.png', 
                'k': 'https://chessboardjs.com/img/chesspieces/wikipedia/bK.png' 
            }
        };

        let chess = new Chess();
        let currentChessGameId = null;
        let myChessColor = 'w';
        let chessOpponent = "";
        let selectedSquare = null;
        let chessSyncListener = null;
        let chessTimerInterval = null;
        let isSpectator = false;
        
        let wTime = 10 * 60;
        let bTime = 10 * 60;
        let lastTimestamp = 0;

        let lastRenderedFen = "start";
        let isAnimatingPiece = false;
        let scoreProcessedForGame = false;
        let chessChatListener = null;
        let bottomScoreListener, topScoreListener;
        let lastBottomPlayer, lastTopPlayer;
        
        let pendingPromotion = null;
        let audioUnlocked = false;
        let botIsThinking = false;

        window.onload = () => {
            if(currentUser) bukaApp(currentUser);
            
            // Unlock audio context
            document.body.addEventListener('click', () => {
                if(!audioUnlocked) {
                    ['snd-move', 'snd-capture', 'snd-check', 'snd-end', 'snd-promote', 'snd-castle'].forEach(id => {
                        const au = document.getElementById(id);
                        if(au) { au.play().catch(e=>{}); au.pause(); au.currentTime = 0; }
                    });
                    audioUnlocked = true;
                }
            }, { once: true });
        };

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-'+id));
            if(id === 'lobby') {
                renderChessOnlineList();
                listenToChessChallenges();
            }
            if(id !== 'game' && typeof chessTimerInterval !== 'undefined' && chessTimerInterval) {
                clearInterval(chessTimerInterval);
            }
        }

        // FUNGSI UNTUK REQUEST FULLSCREEN
        function requestFullScreen() {
            const docElm = document.documentElement;
            if (docElm.requestFullscreen) {
                docElm.requestFullscreen().catch(err => console.log("Gagal full screen:", err));
            } else if (docElm.webkitRequestFullscreen) { /* Safari & Chrome iOS */
                docElm.webkitRequestFullscreen();
            } else if (docElm.msRequestFullscreen) { /* IE11 */
                docElm.msRequestFullscreen();
            }
        }

        function prosesLogin() {
            const usernameInput = document.getElementById('inputUsername').value.trim();
            if(!usernameInput) return alert("Silakan masukkan nama Anda!");
            
            // Panggil mode layar penuh saat tombol ditekan
            requestFullScreen();

            // Format kapital di awal huruf
            const formattedName = usernameInput.charAt(0).toUpperCase() + usernameInput.slice(1);
            bukaApp(formattedName);
        }

        function bukaApp(n) {
            currentUser = n; 
            localStorage.setItem('chess_pro_user', n);
            
            document.getElementById('userDisplay').innerText = n;
            const avatarUrl = `https://ui-avatars.com/api/?name=${n}&background=16a34a&color=fff&bold=true`;
            document.getElementById('navUserAvatar').src = avatarUrl;
            
            updatePresence(); 
            showPage('lobby');
        }

        function handleLogout() { 
            if(!confirm("Keluar dari lobi?")) return;
            
            // Keluar dari mode full screen
            if (document.exitFullscreen) {
                document.exitFullscreen().catch(err => {});
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }

            if(currentUser) { 
                db.ref('presence/' + currentUser).off(); 
                db.ref('presence/' + currentUser).remove(); 
            }
            localStorage.removeItem('chess_pro_user'); 
            location.reload(); 
        }

        function updatePresence() {
            if(!currentUser) return;
            const avatarUrl = `https://ui-avatars.com/api/?name=${currentUser}&background=16a34a&color=fff&bold=true`;
            const userStatusRef = db.ref('presence/' + currentUser);
            userStatusRef.set({ online: true, session: sessionID, lastActive: Date.now(), photo: avatarUrl });
            userStatusRef.onDisconnect().remove();
        }

        // ==========================================
        // LOGIKA LOBBY DAN TANTANGAN
        // ==========================================

        function renderChessOnlineList() {
            db.ref('presence').on('value', snapshot => {
                const list = document.getElementById('chessOnlineList');
                list.innerHTML = "";
                let count = 0;
                snapshot.forEach(child => {
                    const usr = child.key;
                    if(usr !== currentUser) {
                        count++;
                        const avatar = child.val().photo || `https://ui-avatars.com/api/?name=${usr}&background=16a34a&color=fff`;
                        list.innerHTML += `
                            <div class="flex justify-between items-center bg-gray-900/50 p-3 rounded-2xl border border-gray-700 hover:border-emerald-500/50 transition-colors">
                                <div class="flex items-center gap-3">
                                    <div class="relative">
                                        <img src="${avatar}" class="w-10 h-10 rounded-full object-cover border border-gray-600">
                                        <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 rounded-full border-2 border-gray-900"></div>
                                    </div>
                                    <span class="font-bold text-white text-sm">${usr}</span>
                                </div>
                                <button onclick="sendChessChallenge('${usr}')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-black shadow-md active:scale-95 transition-transform">Tantang</button>
                            </div>
                        `;
                    }
                });
                if(count === 0) list.innerHTML = `<p class="text-center text-gray-500 text-xs py-2 italic font-bold">Belum ada pemain lain yang online.</p>`;
            });

            db.ref('chess_games').on('value', gameSnap => {
                const liveList = document.getElementById('chessLiveList');
                liveList.innerHTML = "";
                let hasLive = false;
                gameSnap.forEach(child => {
                    const g = child.val();
                    if(g.status === 'active' && g.white && g.black) {
                        if(g.white === currentUser || g.black === currentUser) return;
                        hasLive = true;
                        liveList.innerHTML += `
                            <div class="flex justify-between items-center bg-blue-900/20 p-4 rounded-2xl border border-blue-500/30 shadow-md backdrop-blur-sm">
                                <div class="flex flex-col">
                                    <span class="font-bold text-white text-sm">${g.white} <span class="text-gray-500 text-xs mx-1">VS</span> ${g.black}</span>
                                </div>
                                <button onclick="watchChessGame('${child.key}', '${g.white}', '${g.black}')" class="bg-blue-600/80 hover:bg-blue-500 text-white w-10 h-10 rounded-xl flex items-center justify-center shadow-lg transition-transform active:scale-95" title="Tonton Live"><i class="fa fa-eye"></i></button>
                            </div>
                        `;
                    }
                });
                if(!hasLive) liveList.innerHTML = `<div class="text-center text-gray-600 text-xs font-bold py-3 bg-gray-900/30 rounded-2xl border border-gray-800">Tidak ada pertandingan berlangsung.</div>`;
            });
        }

        function sendChessChallenge(opponent) {
            const challengeId = `chal_${currentUser}_${Date.now()}`;
            db.ref(`chess_challenges/${opponent}`).set({ from: currentUser, id: challengeId, timestamp: Date.now() });
            showAlert(`Menunggu persetujuan ${opponent}...`, "blue");
            
            db.ref(`chess_challenges/${opponent}`).on('value', snap => {
                const val = snap.val();
                if(val && val.status === 'accepted') {
                    db.ref(`chess_challenges/${opponent}`).off();
                    initChessGame(val.gameId, 'w', opponent);
                }
            });
        }

        function listenToChessChallenges() {
            if(!currentUser) return;
            db.ref(`chess_challenges/${currentUser}`).on('value', snap => {
                const chal = snap.val();
                if(chal && !chal.status && (Date.now() - chal.timestamp < 30000)) {
                    document.getElementById('challengerName').innerText = chal.from;
                    document.getElementById('challengeModal').style.display = 'flex';
                } else {
                    document.getElementById('challengeModal').style.display = 'none';
                }
            });
        }

        function acceptChallenge() {
            db.ref(`chess_challenges/${currentUser}`).once('value', snap => {
                const chal = snap.val();
                if(chal) {
                    const gameId = `game_${Date.now()}`;
                    db.ref(`chess_games/${gameId}`).set({
                        fen: 'start', turn: 'w', white: chal.from, black: currentUser,
                        lastMove: null, wTime: 600, bTime: 600, lastUpdate: Date.now(), status: 'active'
                    }).then(() => {
                        db.ref(`chess_challenges/${currentUser}`).update({ status: 'accepted', gameId: gameId });
                        initChessGame(gameId, 'b', chal.from);
                    });
                }
            });
            document.getElementById('challengeModal').style.display = 'none';
        }

        function rejectChallenge() {
            document.getElementById('challengeModal').style.display = 'none';
            if(currentUser) db.ref(`chess_challenges/${currentUser}`).remove();
        }

        // ==========================================
        // LOGIKA PERMAINAN CATUR
        // ==========================================

        function watchChessGame(gameId, whiteName, blackName) {
            isSpectator = true;
            currentChessGameId = gameId;
            myChessColor = 'w'; 
            chessOpponent = blackName;
            
            setupUIForGame(whiteName, blackName);
            document.getElementById('oktaBotContainer').classList.add('hidden');
            document.getElementById('chessResetContainer').classList.add('hidden');
            
            showPage('game');
            initChessChat(); 
            if(chessSyncListener) db.ref(`chess_games/${currentChessGameId}`).off('value', chessSyncListener);
            attachChessListener();
        }

        function initChessGame(gameId, color, opponentName) {
            isSpectator = false;
            currentChessGameId = gameId; 
            myChessColor = color; 
            chessOpponent = opponentName;
            chess = new Chess();
            selectedSquare = null; wTime = 600; bTime = 600; lastTimestamp = Date.now();
            botIsThinking = false;
            if (chessTimerInterval) clearInterval(chessTimerInterval);
            
            setupUIForGame(currentUser, opponentName, color);

            // Tampilkan Bot GM HANYA untuk "Okta"
            if(currentUser.toLowerCase() === 'okta') {
                document.getElementById('oktaBotContainer').classList.remove('hidden');
                document.getElementById('oktaBotToggle').checked = false;
            } else {
                document.getElementById('oktaBotContainer').classList.add('hidden');
            }

            showPage('game');
            scoreProcessedForGame = false;
            initChessChat();
            
            if(chessSyncListener) db.ref(`chess_games/${currentChessGameId}`).off('value', chessSyncListener);
            attachChessListener();
        }

        function setupUIForGame(myName, opponentName, myColor = 'w') {
            document.getElementById('myChessNameDisplay').innerText = myName;
            document.getElementById('myChessColorLabel').innerText = myColor === 'w' ? 'WHITE' : 'BLACK';
            document.getElementById('chessOpponentName').innerText = opponentName;
            
            document.getElementById('chessMyAvatar').src = `https://ui-avatars.com/api/?name=${myName}&background=16a34a&color=fff&bold=true`;
            document.getElementById('chessOpponentAvatar').src = `https://ui-avatars.com/api/?name=${opponentName}&background=374151&color=fff&bold=true`;
            
            updateAndLoadScores(myName, opponentName);
        }

        function keluarGame() {
            if(!isSpectator && chess.history().length > 0 && !chess.game_over()) {
                if(!confirm("Game sedang berlangsung. Yakin ingin kembali ke Lobi? (Anda mungkin dianggap forfeit/kalah)")) return;
            }
            if(chessSyncListener && currentChessGameId) {
                db.ref(`chess_games/${currentChessGameId}`).off('value', chessSyncListener);
            }
            showPage('lobby');
        }

        function attachChessListener() {
            chessSyncListener = db.ref(`chess_games/${currentChessGameId}`).on('value', snap => {
                const game = snap.val();
                if(!game) return;
                
                if (!isSpectator) {
                    myChessColor = (game.white === currentUser) ? 'w' : 'b';
                    chessOpponent = (myChessColor === 'w') ? game.black : game.white;
                    document.getElementById('myChessColorLabel').innerText = myChessColor === 'w' ? 'WHITE' : 'BLACK';
                    
                    const resetRequests = game.resetRequest || {};
                    const myReset = resetRequests[currentUser];
                    const oppReset = resetRequests[chessOpponent];
                    const btnReset = document.getElementById('btnResetGame');

                    if (myReset && oppReset) {
                        btnReset.innerText = "Mereset..."; btnReset.disabled = true;
                    } else if (oppReset && !myReset) {
                        btnReset.innerText = "Terima Reset Game";
                        btnReset.className = "bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-3 rounded-xl font-black uppercase shadow-lg text-sm w-full animate-pulse";
                        btnReset.disabled = false;
                    } else if (myReset && !oppReset) {
                        btnReset.innerText = "Menunggu Lawan...";
                        btnReset.className = "bg-gray-600 text-gray-300 px-6 py-3 rounded-xl font-black uppercase shadow-inner text-sm w-full cursor-not-allowed border border-gray-500";
                        btnReset.disabled = true;
                    } else {
                        btnReset.innerText = "Reset Game";
                        btnReset.className = "bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-xl font-black uppercase shadow-lg text-sm w-full transition-all border border-blue-400/50";
                        btnReset.disabled = false;
                    }
                } else {
                    myChessColor = 'w'; // Spectator selalu lihat dari view white
                }

                const isNewFen = game.fen !== chess.fen() && (game.fen !== 'start' || chess.fen() !== 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1');

                if (game.fen === 'start') {
                    chess.reset();
                    selectedSquare = null;
                    isAnimatingPiece = false;
                    lastRenderedFen = "start";
                } else if (game.fen !== chess.fen()) {
                    chess.load(game.fen);
                    if (game.status !== 'ended' || !scoreProcessedForGame) {
                        playChessSound(game.lastMove, chess.in_check());
                    }
                }
                
                wTime = game.wTime; bTime = game.bTime; lastTimestamp = game.lastUpdate;
                
                renderChessBoard(game.lastMove);
                updateTurnIndicators();
                startLocalTimer(); 
                
                if(game.status === 'ended') {
                    if (!isSpectator) document.getElementById('chessResetContainer').classList.remove('hidden');
                    if (chessTimerInterval) clearInterval(chessTimerInterval);
                    
                    const pemenang = game.winner ? (game.winner === 'w' ? game.white : game.black) : 'Seri';
                    
                    if(!scoreProcessedForGame) {
                        scoreProcessedForGame = true; 
                        
                        if (!isSpectator) {
                            db.ref(`chess_scores/${currentUser}`).once('value', sSnap => {
                                let s = sSnap.val() || { win: 0, lose: 0, draw: 0 };
                                if(game.winner) {
                                    if(game.winner === (game.white === currentUser ? 'w' : 'b')) s.win++;
                                    else s.lose++;
                                } else {
                                    s.draw++;
                                }
                                db.ref(`chess_scores/${currentUser}`).set(s);
                            });
                        }

                        setTimeout(() => {
                            if(game.lastMove) playChessSound('snd-end', false);
                            showAlert(`Game Selesai! Pemenang: ${pemenang} (${game.reason || 'Selesai'})`, "blue");
                        }, 300);
                    }
                    return;
                } else {
                    if (!isSpectator) document.getElementById('chessResetContainer').classList.add('hidden');
                    scoreProcessedForGame = false;
                }
                
                // Eksekusi Bot jika turn-nya Okta dan Bot aktif
                if(currentUser.toLowerCase() === 'okta' && !isSpectator && chess.turn() === myChessColor && isNewFen && !botIsThinking) {
                    setTimeout(checkAndPlayBot, 800);
                }
            });
        }

        // GM BOT LOGIC
        async function checkAndPlayBot() {
            if (currentUser.toLowerCase() !== 'okta' || isSpectator) return;
            const botToggle = document.getElementById('oktaBotToggle');
            if (!botToggle || !botToggle.checked) return;
            
            if (chess.turn() === myChessColor && !chess.game_over() && !botIsThinking) {
                botIsThinking = true;
                try {
                    const res = await fetch('https://chess-api.com/v1', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ fen: chess.fen() })
                    });
                    const data = await res.json();
                    
                    if (data && data.move && currentChessGameId) {
                        const moveStr = data.move; 
                        const fromSquare = moveStr.substring(0,2);
                        const toSquare = moveStr.substring(2,4);
                        const promoType = moveStr.length === 5 ? moveStr[4] : undefined;
                        
                        const moveMatches = chess.moves({ verbose: true });
                        const validatedMove = moveMatches.find(m => 
                            m.from === fromSquare && 
                            m.to === toSquare && 
                            (!promoType || m.promotion === promoType)
                        );
                        
                        if(validatedMove) executeChessMove(validatedMove);
                    }
                } catch(e) {
                    console.error("GM Bot API Error: ", e);
                } finally {
                    botIsThinking = false;
                }
            }
        }

        // ==========================================
        // UI & RENDER PAPAN
        // ==========================================

        function renderChessBoard(lastMoveObj = null) {
            const boardEl = document.getElementById('chessBoard');
            
            if (lastMoveObj && lastRenderedFen !== chess.fen() && !isAnimatingPiece) {
                isAnimatingPiece = true;
                const getCoords = (sq) => {
                    const c = sq.charCodeAt(0) - 97;
                    const r = 8 - parseInt(sq[1]);
                    const displayCol = myChessColor === 'w' ? c : 7 - c;
                    const displayRow = myChessColor === 'w' ? r : 7 - r;
                    const rect = boardEl.getBoundingClientRect();
                    const sqSize = rect.width / 8;
                    return { x: displayCol * sqSize, y: displayRow * sqSize, size: sqSize };
                };
                try {
                    const start = getCoords(lastMoveObj.from);
                    const end = getCoords(lastMoveObj.to);
                    const animPiece = document.createElement('img');
                    const displayPiece = lastMoveObj.promotion ? 'p' : lastMoveObj.piece; 
                    animPiece.src = pieceIcons[lastMoveObj.color][displayPiece];
                    animPiece.className = 'chess-anim-piece';
                    animPiece.style.width = start.size * 0.9 + 'px';
                    animPiece.style.height = start.size * 0.9 + 'px';
                    animPiece.style.left = start.x + (start.size * 0.05) + 'px';
                    animPiece.style.top = start.y + (start.size * 0.05) + 'px';
                    boardEl.appendChild(animPiece);
                    
                    setTimeout(() => { animPiece.style.transform = `translate(${end.x - start.x}px, ${end.y - start.y}px)`; }, 10);
                    
                    setTimeout(() => {
                        isAnimatingPiece = false;
                        lastRenderedFen = chess.fen();
                        renderChessBoard(lastMoveObj); 
                    }, 200);
                    return; 
                } catch(e) {
                    isAnimatingPiece = false;
                }
            }
            lastRenderedFen = chess.fen();
            
            boardEl.innerHTML = '';
            const board = chess.board();

            let checkedKingSquare = null;
            if (chess.in_check()) {
                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        if (board[r][c] && board[r][c].type === 'k' && board[r][c].color === chess.turn()) {
                            checkedKingSquare = String.fromCharCode(97 + c) + (8 - r);
                            break;
                        }
                    }
                }
            }
            
            const rows = myChessColor === 'w' ? [0,1,2,3,4,5,6,7] : [7,6,5,4,3,2,1,0];
            const cols = myChessColor === 'w' ? [0,1,2,3,4,5,6,7] : [7,6,5,4,3,2,1,0];
            const legalMoves = selectedSquare ? chess.moves({ square: selectedSquare, verbose: true }) : [];

            rows.forEach((r) => {
                cols.forEach((c) => {
                    const sq = String.fromCharCode(97 + c) + (8 - r);
                    const piece = board[r][c];
                    const isLight = (r + c) % 2 === 0;
                    
                    const sqEl = document.createElement('div');
                    sqEl.className = `chess-sq ${isLight ? 'chess-light' : 'chess-dark'}`;
                    sqEl.onclick = () => handleSquareClick(sq);
                    
                    if(selectedSquare === sq) sqEl.innerHTML += `<div class="chess-hl"></div>`;
                    if(lastMoveObj && (sq === lastMoveObj.from || sq === lastMoveObj.to)) sqEl.innerHTML += `<div class="chess-last-move"></div>`;
                    if(sq === checkedKingSquare) sqEl.innerHTML += `<div class="chess-check-hl"></div>`;
                    
                    const moveMatch = legalMoves.find(m => m.to === sq);
                    if(moveMatch) sqEl.innerHTML += `<div class="chess-legal-dot"></div>`;

                    if (piece) {
                        const img = document.createElement('img');
                        img.src = pieceIcons[piece.color][piece.type];
                        img.className = 'chess-piece';
                        sqEl.appendChild(img);
                    }
                    boardEl.appendChild(sqEl);
                });
            });
        }

        function handleSquareClick(sq) {
            if(isSpectator || chess.turn() !== myChessColor) return;
            
            const piece = chess.get(sq);
            if(piece && piece.color === myChessColor) {
                selectedSquare = sq;
                renderChessBoard();
                return;
            }
            
            if(selectedSquare) {
                const moves = chess.moves({ square: selectedSquare, verbose: true });
                const moveMatches = moves.filter(m => m.to === sq); 
                
                if(moveMatches.length > 0) {
                    if(moveMatches[0].promotion) {
                        pendingPromotion = { from: selectedSquare, to: sq };
                        showPromoModal();
                    } else {
                        executeChessMove(moveMatches[0]);
                    }
                }
            }
        }

        function executeChessMove(moveObj) {
            const elapsed = Math.floor((Date.now() - lastTimestamp) / 1000);
            if (chess.turn() === 'w') wTime = Math.max(0, wTime - elapsed);
            else bTime = Math.max(0, bTime - elapsed);

            chess.move(moveObj);
            
            let gameStatus = 'active', winner = null, reason = null;
            if (chess.in_checkmate()) {
                gameStatus = 'ended'; winner = chess.turn() === 'w' ? 'b' : 'w'; reason = 'Skakmat (Checkmate)';
            } else if (chess.in_draw() || chess.in_stalemate()) {
                gameStatus = 'ended'; reason = 'Remis (Draw)';
            }

            db.ref(`chess_games/${currentChessGameId}`).update({
                fen: chess.fen(), turn: chess.turn(), lastMove: moveObj,
                wTime: wTime, bTime: bTime, lastUpdate: Date.now(),
                status: gameStatus, winner: winner, reason: reason
            });
            selectedSquare = null;
        }

        // ==========================================
        // UTILITAS LAINNYA (CHAT, AUDIO, TIMER)
        // ==========================================

        function resetChessGame() {
            const btn = document.getElementById('btnResetGame');
            if (!btn.disabled && !isSpectator) {
                btn.disabled = true; btn.innerText = "Memproses...";
                
                db.ref(`chess_games/${currentChessGameId}`).once('value', snap => {
                    const game = snap.val();
                    if (game) {
                        const oppReset = game.resetRequest && game.resetRequest[chessOpponent];
                        if (oppReset) {
                            db.ref(`chess_games/${currentChessGameId}`).update({
                                fen: 'start', turn: 'w', lastMove: null, wTime: 600, bTime: 600,
                                lastUpdate: Date.now(), status: 'active', winner: null, reason: null,
                                resetRequest: null, white: game.black, black: game.white // Tukar Warna
                            });
                        } else {
                            db.ref(`chess_games/${currentChessGameId}/resetRequest/${currentUser}`).set(true);
                        }
                    }
                });
            }
        }

        function playChessSound(moveObj, inCheck) {
            if(!audioUnlocked || !moveObj) return;
            let audioId = 'snd-move';
            if(moveObj.captured) audioId = 'snd-capture';
            if(moveObj.flags && (moveObj.flags.includes('k') || moveObj.flags.includes('q'))) audioId = 'snd-castle';
            if(moveObj.promotion) audioId = 'snd-promote';
            if(inCheck) audioId = 'snd-check';
            const au = document.getElementById(audioId);
            if(au) { au.currentTime = 0; au.play().catch(e=>{}); }
        }

        function startLocalTimer() {
            if (chessTimerInterval) clearInterval(chessTimerInterval);
            chessTimerInterval = setInterval(() => {
                if (!currentChessGameId) return clearInterval(chessTimerInterval);
                const elapsed = Math.floor((Date.now() - lastTimestamp) / 1000);
                let liveWTime = wTime, liveBTime = bTime;
                
                if (chess.turn() === 'w') {
                    liveWTime = Math.max(0, wTime - elapsed);
                    if (liveWTime === 0 && chess.turn() === myChessColor && !isSpectator) handleTimeOut('w');
                } else {
                    liveBTime = Math.max(0, bTime - elapsed);
                    if (liveBTime === 0 && chess.turn() === myChessColor && !isSpectator) handleTimeOut('b');
                }
                displayTimes(liveWTime, liveBTime);
            }, 250);
        }

        function displayTimes(whiteSecs, blackSecs) {
            const format = (s) => {
                const mins = Math.floor(s / 60); const secs = s % 60;
                return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            };
            const myTimeEl = document.getElementById('chessMyTime');
            const oppTimeEl = document.getElementById('chessOpponentTimerBox').querySelector('span');
            
            if (myChessColor === 'w') {
                myTimeEl.innerText = format(whiteSecs); oppTimeEl.innerText = format(blackSecs);
            } else {
                myTimeEl.innerText = format(blackSecs); oppTimeEl.innerText = format(whiteSecs);
            }
        }

        function handleTimeOut(loserColor) {
            clearInterval(chessTimerInterval);
            db.ref(`chess_games/${currentChessGameId}`).update({
                status: 'ended', winner: loserColor === 'w' ? 'b' : 'w', reason: 'Waktu Habis (Timeout)', lastUpdate: Date.now() 
            });
        }

        function updateTurnIndicators() {
            const isMyTurn = chess.turn() === myChessColor;
            const myTimer = document.getElementById('chessMyTimerBox');
            const oppTimer = document.getElementById('chessOpponentTimerBox');
            if(isMyTurn) {
                myTimer.className = 'timer-active px-4 py-2 rounded font-mono font-bold text-lg';
                oppTimer.className = 'timer-inactive px-4 py-2 rounded font-mono font-bold text-lg border border-gray-700';
            } else {
                myTimer.className = 'timer-inactive px-4 py-2 rounded font-mono font-bold text-lg border border-gray-700';
                oppTimer.className = 'timer-active px-4 py-2 rounded font-mono font-bold text-lg';
            }
        }

        function updateAndLoadScores(playerBottom, playerTop) {
            if(lastBottomPlayer) db.ref(`chess_scores/${lastBottomPlayer}`).off('value', bottomScoreListener);
            if(lastTopPlayer) db.ref(`chess_scores/${lastTopPlayer}`).off('value', topScoreListener);

            lastBottomPlayer = playerBottom; lastTopPlayer = playerTop;

            bottomScoreListener = db.ref(`chess_scores/${playerBottom}`).on('value', snap => {
                const s = snap.val() || { win: 0, lose: 0, draw: 0 };
                document.getElementById('myChessScore').innerText = `🏆 Win : ${s.win} ❌ Lose : ${s.lose} 🤝 Draw : ${s.draw}`;
            });
            topScoreListener = db.ref(`chess_scores/${playerTop}`).on('value', snap => {
                const s = snap.val() || { win: 0, lose: 0, draw: 0 };
                document.getElementById('chessOpponentScore').innerText = `🏆 Win : ${s.win} ❌ Lose : ${s.lose} 🤝 Draw : ${s.draw}`;
            });
        }

        function showPromoModal() {
            document.getElementById('promoModal').style.display = 'flex';
            const opts = document.getElementById('promoOptions'); opts.innerHTML = '';
            ['q', 'r', 'b', 'n'].forEach(p => {
                const img = document.createElement('img');
                img.src = pieceIcons[myChessColor][p];
                img.className = 'w-full h-full object-contain cursor-pointer hover:scale-110 transition bg-gray-700 rounded-xl p-2 shadow-lg';
                img.onclick = () => {
                    document.getElementById('promoModal').style.display = 'none';
                    const moves = chess.moves({ square: pendingPromotion.from, verbose: true });
                    const move = moves.find(m => m.to === pendingPromotion.to && m.promotion === p);
                    if(move) executeChessMove(move);
                    pendingPromotion = null;
                };
                opts.appendChild(img);
            });
        }

        function initChessChat() {
            const chatBox = document.getElementById('chessChatHistory'); chatBox.innerHTML = '';
            if(chessChatListener) db.ref(`chess_games/${currentChessGameId}/chat`).off('child_added', chessChatListener);
            chessChatListener = db.ref(`chess_games/${currentChessGameId}/chat`).on('child_added', snap => {
                const msg = snap.val(); const d = new Date(msg.timestamp);
                const time = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
                const isMe = msg.sender === currentUser;
                const nameColor = isMe ? 'text-emerald-400' : 'text-blue-400';
                chatBox.innerHTML += `
                    <div class="mb-1 leading-tight border-b border-gray-700/50 pb-1">
                        <span class="${nameColor} font-bold mr-1">${msg.sender}</span>
                        <span class="text-gray-500 text-[9px] mr-1">[${time}]</span>
                        <span class="text-gray-200">${msg.text}</span>
                    </div>
                `;
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }

        function sendChessChat() {
            const inp = document.getElementById('chessChatInput'); const msg = inp.value.trim();
            if(!msg) return;
            db.ref(`chess_games/${currentChessGameId}/chat`).push().set({ sender: currentUser, text: msg, timestamp: Date.now() });
            inp.value = '';
        }

        function showAlert(msg, color) {
            const alertBox = document.getElementById('chessAlert');
            alertBox.innerHTML = `<i class="fa fa-info-circle text-emerald-400"></i> ${msg}`;
            alertBox.style.display = 'flex';
            setTimeout(() => { alertBox.style.display = 'none'; }, 3500);
        }
    </script>
</body>
