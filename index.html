<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Mega 3D - Gold Edition</title>
    <style>
        :root {
            --bg-color: #e0e5ec;
            --text-color: #444;
            --shadow-dark: #b8c1cc;
            --shadow-light: #ffffff;
            --x-color: #ff4757;
            --o-color: #2ed573;
            --gold: linear-gradient(45deg, #ffd700, #fff5b1, #ffae00, #f8e45c);
            --grid-size: 10; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .header { text-align: center; margin-bottom: 20px; }
        
        .card {
            background: var(--bg-color);
            padding: 15px 25px;
            border-radius: 15px;
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            text-align: center;
            margin-bottom: 30px;
        }

        /* Board 3D Wrapper */
        .board-wrapper {
            perspective: 1500px;
            position: relative; /* Penting untuk posisi garis emas */
        }

        .board {
            display: grid;
            grid-template-columns: repeat(var(--grid-size), 1fr);
            gap: 8px;
            padding: 20px;
            background: var(--bg-color);
            border-radius: 20px;
            box-shadow: inset 8px 8px 15px var(--shadow-dark), inset -8px -8px 15px var(--shadow-light);
            transform: rotateX(15deg);
            transition: transform 0.5s ease;
            position: relative;
        }

        .board:hover { transform: rotateX(0deg); }

        .block {
            width: 45px;
            height: 45px;
            background: var(--bg-color);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: 900;
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            transition: all 0.2s ease;
            z-index: 2;
        }

        .block.taken { box-shadow: inset 2px 2px 5px var(--shadow-dark); }
        .x-color { color: var(--x-color); text-shadow: 1px 1px 0px white; }
        .o-color { color: var(--o-color); text-shadow: 1px 1px 0px white; }

        /* --- Efek Garis Emas --- */
        .win-line {
            position: absolute;
            z-index: 10;
            background: var(--gold);
            height: 8px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.8), 0 0 5px rgba(255, 255, 255, 1);
            transform-origin: left center;
            animation: growGold 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards,
                       shimmer 2s infinite linear;
            background-size: 200% auto;
            pointer-events: none;
        }

        @keyframes growGold {
            from { scale: 0 1; opacity: 0; }
            to { scale: 1 1; opacity: 1; }
        }

        @keyframes shimmer {
            to { background-position: 200% center; }
        }

        /* Efek Berkilau pada Kotak Pemenang */
        .block.winner-cell {
            animation: pulseGold 1.5s infinite;
            background: #fffbe6;
            z-index: 11;
        }

        @keyframes pulseGold {
            50% { box-shadow: 0 0 20px #ffd700; transform: scale(1.1); }
        }

        /* Controls */
        .controls { margin-top: 30px; }
        button {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            background: var(--bg-color);
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            cursor: pointer;
            font-weight: bold;
            color: var(--text-color);
        }

        button:active { box-shadow: inset 3px 3px 6px var(--shadow-dark); }
    </style>
</head>
<body>

    <div class="header">
        <h1>Mega Tic-Tac-Toe <span style="color: #b8860b;">Gold</span></h1>
        <p>Hubungkan 5 kotak untuk mendapatkan garis emas!</p>
    </div>

    <div class="card">
        <h2 id="status">Giliran: <span class="x-color">X</span></h2>
    </div>

    <div class="board-wrapper">
        <div class="board" id="game-board">
            </div>
        <div id="line-container"></div>
    </div>

    <div class="controls">
        <button onclick="initGame()">Reset Permainan</button>
    </div>

    <script>
        const GRID_SIZE = 10;
        const WIN_COUNT = 5;
        let currentPlayer = 'X';
        let gameState = [];
        let gameActive = true;

        const boardElement = document.getElementById('game-board');
        const statusDisplay = document.getElementById('status');
        const lineContainer = document.getElementById('line-container');

        document.documentElement.style.setProperty('--grid-size', GRID_SIZE);

        function initGame() {
            gameActive = true;
            currentPlayer = 'X';
            gameState = Array(GRID_SIZE * GRID_SIZE).fill("");
            statusDisplay.innerHTML = `Giliran: <span class="x-color">X</span>`;
            lineContainer.innerHTML = "";
            
            boardElement.innerHTML = "";
            for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
                const block = document.createElement('div');
                block.classList.add('block');
                block.setAttribute('data-index', i);
                block.addEventListener('click', handleCellClick);
                boardElement.appendChild(block);
            }
        }

        function handleCellClick(e) {
            const index = parseInt(e.target.getAttribute('data-index'));
            if (gameState[index] !== "" || !gameActive) return;

            gameState[index] = currentPlayer;
            e.target.textContent = currentPlayer;
            e.target.classList.add('taken', currentPlayer === 'X' ? 'x-color' : 'o-color');

            const winData = checkWin(index);
            if (winData) {
                drawGoldLine(winData.cells);
                statusDisplay.innerHTML = `<span style="color:#b8860b">PEMENANG: ${currentPlayer}!</span>`;
                gameActive = false;
                return;
            }

            if (!gameState.includes("")) {
                statusDisplay.textContent = "Hasil: Seri!";
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            statusDisplay.innerHTML = `Giliran: <span class="${currentPlayer === 'X' ? 'x-color' : 'o-color'}">${currentPlayer}</span>`;
        }

        function checkWin(index) {
            const row = Math.floor(index / GRID_SIZE);
            const col = index % GRID_SIZE;
            const directions = [
                { x: 1, y: 0 }, { x: 0, y: 1 }, { x: 1, y: 1 }, { x: 1, y: -1 }
            ];

            for (let dir of directions) {
                let winningCells = [index];
                
                // Cek maju
                let r = row + dir.y, c = col + dir.x;
                while (r >= 0 && r < GRID_SIZE && c >= 0 && c < GRID_SIZE && gameState[r * GRID_SIZE + c] === currentPlayer) {
                    winningCells.push(r * GRID_SIZE + c);
                    r += dir.y; c += dir.x;
                }
                
                // Cek mundur
                r = row - dir.y; c = col - dir.x;
                while (r >= 0 && r < GRID_SIZE && c >= 0 && c < GRID_SIZE && gameState[r * GRID_SIZE + c] === currentPlayer) {
                    winningCells.push(r * GRID_SIZE + c);
                    r -= dir.y; c -= dir.x;
                }

                if (winningCells.length >= WIN_COUNT) {
                    return { cells: winningCells };
                }
            }
            return null;
        }

        function drawGoldLine(cells) {
            // Sort cells untuk menentukan ujung ke ujung
            cells.sort((a, b) => a - b);
            const first = cells[0];
            const last = cells[cells.length - 1];

            const firstEl = document.querySelector(`[data-index="${first}"]`);
            const lastEl = document.querySelector(`[data-index="${last}"]`);
            
            // Tambahkan kelas animasi ke kotak pemenang
            cells.forEach(idx => document.querySelector(`[data-index="${idx}"]`).classList.add('winner-cell'));

            // Hitung posisi koordinat
            const rectStart = firstEl.getBoundingClientRect();
            const rectEnd = lastEl.getBoundingClientRect();
            const boardRect = boardElement.getBoundingClientRect();

            const x1 = rectStart.left + rectStart.width / 2 - boardRect.left;
            const y1 = rectStart.top + rectStart.height / 2 - boardRect.top;
            const x2 = rectEnd.left + rectEnd.width / 2 - boardRect.left;
            const y2 = rectEnd.top + rectEnd.height / 2 - boardRect.top;

            const distance = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
            const angle = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;

            const line = document.createElement('div');
            line.className = 'win-line';
            line.style.width = `${distance}px`;
            line.style.left = `${x1}px`;
            line.style.top = `${y1}px`;
            line.style.transform = `rotate(${angle}deg)`;

            lineContainer.appendChild(line);
        }

        initGame();
    </script>
</body>
</html>
