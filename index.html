<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TrackCust JTM - Official</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    
    <style>
        .dominos-blue { background-color: #006491; }
        .dominos-red { background-color: #e31837; }
        
        /* Fixed CSS for Chess Board */
        .chess-container { 
            display: grid; 
            grid-template-columns: repeat(8, 1fr); 
            grid-template-rows: repeat(8, 1fr); 
            width: 100%; 
            max-width: 500px; /* Batas maksimal agar tidak terlalu besar di desktop */
            aspect-ratio: 1 / 1; /* PENTING: Menjaga papan tetap kotak sempurna */
            border: 4px solid #2c3e50; 
            border-radius: 4px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.4); 
            background-color: #2c3e50; 
            overflow: hidden; 
            margin: 0 auto; /* Tengah */
        }
        .chess-sq { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        .chess-light { background-color: #ebecd0; }
        .chess-dark { background-color: #739552; }
        .chess-piece { width: 80%; height: 80%; z-index: 10; cursor: pointer; }
        
        /* Layout Mobile Fix */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; align-items: center; padding: 10px 0; border-top: 2px solid #f1f5f9; z-index: 1000; height: 70px; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #94a3b8; font-size: 10px; font-weight: 800; text-transform: uppercase; width: 20%; cursor: pointer; }
        .nav-item.active { color: #006491; }
        .nav-add { background: #006491 !important; color: white !important; width: 55px !important; height: 55px !important; border-radius: 50% !important; margin-top: -35px; border: 4px solid white; box-shadow: 0 4px 15px rgba(0,100,145,0.3); }
        
        .page { display: none; height: 100%; flex-direction: column; }
        .page.active { display: flex; }
        .timer-active { background-color: #ffffff !important; color: #16a34a !important; box-shadow: 0 0 15px rgba(22, 163, 74, 0.5); }
        .timer-inactive { background-color: #374151 !important; color: #9ca3af !important; }
    </style>
</head>
<body class="bg-gray-50 h-screen font-sans">

    <!-- Konten Utama -->
    <div id="mainContent" class="flex flex-col h-full">
        <main class="flex-1 overflow-y-auto pb-20">
            <!-- CHESS GAME PAGE -->
            <div id="page-chess-game" class="page active p-4">
                <div class="flex-1 flex flex-col items-center justify-center w-full max-w-lg mx-auto">
                    <!-- Opponent Timer -->
                    <div class="w-full flex justify-between items-center mb-2 px-2">
                        <span class="font-bold text-gray-700">Lawan</span>
                        <div id="chessOpponentTimerBox" class="timer-inactive px-4 py-1 rounded font-mono font-bold">10:00</div>
                    </div>

                    <!-- BOARD CONTAINER - FIXED -->
                    <div id="chessBoard" class="chess-container"></div>

                    <!-- My Timer -->
                    <div class="w-full flex justify-between items-center mt-2 px-2">
                        <span class="font-bold text-gray-700">Anda</span>
                        <div id="chessMyTimerBox" class="timer-inactive px-4 py-1 rounded font-mono font-bold">10:00</div>
                    </div>
                </div>
            </div>
        </main>

        <div class="bottom-nav">
            <div onclick="showPage('list')" class="nav-item" id="nav-list"><i class="fa fa-motorcycle text-xl"></i><span>Antaran</span></div>
            <div onclick="showPage('history')" class="nav-item" id="nav-history"><i class="fa fa-history text-xl"></i><span>History</span></div>
            <div onclick="showPage('add')" class="nav-item nav-add" id="nav-add"><i class="fa fa-plus text-2xl"></i></div>
            <div onclick="showPage('chat')" class="nav-item" id="nav-chat"><i class="fab fa-whatsapp text-xl"></i><span>WA</span></div>
            <div onclick="showPage('home')" class="nav-item active" id="nav-home"><i class="fa fa-user text-xl"></i><span>Profil</span></div>
        </div>
    </div>

    <script>
        // Setup Logic
        const pieceIcons = {
            'w': { 'p': 'https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg', 'n': 'https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg', 'b': 'https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg', 'r': 'https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg', 'q': 'https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg', 'k': 'https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg' },
            'b': { 'p': 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg', 'n': 'https://upload.wikimedia.org/wikipedia/commons/f/f4/Chess_ndt45.svg', 'b': 'https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg', 'r': 'https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg', 'q': 'https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg', 'k': 'https://upload.wikimedia.org/wikipedia/commons/e/e3/Chess_kdt45.svg' }
        };

        let chess = new Chess();
        
        function renderChessBoard() {
            const boardEl = document.getElementById('chessBoard');
            boardEl.innerHTML = '';
            const board = chess.board();
            
            // Loop 8x8
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const piece = board[r][c];
                    const sqEl = document.createElement('div');
                    sqEl.className = `chess-sq ${(r + c) % 2 === 0 ? 'chess-light' : 'chess-dark'}`;
                    
                    if (piece) {
                        const img = document.createElement('img');
                        img.src = pieceIcons[piece.color][piece.type];
                        img.className = 'chess-piece';
                        sqEl.appendChild(img);
                    }
                    boardEl.appendChild(sqEl);
                }
            }
        }

        // Jalankan saat load
        window.onload = () => {
            renderChessBoard();
        };
    </script>
</body>
</html>
