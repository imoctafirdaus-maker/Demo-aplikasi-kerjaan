<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TrackCust JTM - Official</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src='https://unpkg.com/tesseract.js@v4.0.1/dist/tesseract.min.js'></script>
    
    <style>
        .dominos-blue { background-color: #006491; }
        .dominos-red { background-color: #e31837; }
        ::-webkit-scrollbar { width: 0; background: transparent; }
        
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; align-items: center; padding: 10px 0; border-top: 2px solid #f1f5f9; z-index: 1000; padding-bottom: env(safe-area-inset-bottom); height: 70px; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #94a3b8; font-size: 10px; font-weight: 800; text-transform: uppercase; width: 20%; cursor: pointer; transition: all 0.2s; }
        .nav-item.active { color: #006491; }
        .nav-add { background: #006491 !important; color: white !important; width: 55px !important; height: 55px !important; border-radius: 50% !important; margin-top: -35px; justify-content: center; border: 4px solid white; box-shadow: 0 4px 15px rgba(0,100,145,0.3); position: relative; z-index: 1001; }
        
        .page { display: none; height: 100%; flex-direction: column; }
        .page.active { display: flex; }
        
        .wa-card { background: white; padding: 1.5rem; border-radius: 2rem; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 350px; text-align: center; }
        
        .scanner-container { position: relative; width: 100%; height: 200px; background: black; border-radius: 1.5rem; overflow: hidden; margin-bottom: 1rem; border: 4px solid #006491; }
        #scannerVideo { width: 100%; height: 100%; object-fit: cover; }
        .scanner-overlay { position: absolute; inset: 0; border: 30px solid rgba(0,0,0,0.5); pointer-events: none; display: none; }
        .scanner-box { width: 100%; height: 100%; border: 2px solid #e31837; position: relative; }
        .laser { position: absolute; width: 100%; height: 2px; background: #e31837; box-shadow: 0 0 10px #e31837; top: 50%; animation: scanAnim 2s infinite; }
        @keyframes scanAnim { 0% { top: 0%; } 100% { top: 100%; } }

        .cam-controls { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; background: #f8fafc; padding: 10px; border-radius: 15px; border: 1px solid #e2e8f0; }
        .btn-mode { padding: 4px 8px; border-radius: 6px; font-size: 8px; font-weight: 900; border: 1px solid #cbd5e1; background: white; color: #64748b; }
        .btn-mode.active { background: #e31837; color: white; border-color: #e31837; }
        
        .admin-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 20000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .admin-content { background: white; border-radius: 2rem; padding: 25px; width: 100%; max-width: 400px; max-height: 80vh; overflow-y: auto; }
        
        /* BW Effect untuk Preview Scan jika diperlukan */
        .bw-filter { filter: grayscale(100%) contrast(150%); }
    </style>
</head>
<body class="bg-gray-50 h-screen font-sans text-gray-800 flex flex-col overflow-hidden">

    <div id="imgModal" class="fixed inset-0 bg-black/95 z-[10001] hidden flex-col items-center justify-center p-4" onclick="this.style.display='none'">
        <div id="modalContent" class="flex flex-col items-center">
             <img id="fullImg" class="max-w-full max-h-[80vh] rounded-lg shadow-2xl object-contain">
             <p id="modalCaption" class="text-white mt-4 font-black italic uppercase tracking-widest text-center"></p>
        </div>
    </div>

    <div id="adminCrewModal" class="admin-modal">
        <div class="admin-content">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-black text-blue-900 uppercase">Manage Crew</h3>
                <button onclick="closeAdminModal()" class="text-red-500 font-bold">TUTUP</button>
            </div>
            <div class="space-y-3 mb-6 bg-blue-50 p-4 rounded-2xl">
                <input type="text" id="newCrewName" placeholder="Nama Crew" class="w-full p-3 rounded-xl border text-sm font-bold uppercase">
                <input type="password" id="newCrewPin" maxlength="4" placeholder="PIN 4 Digit" class="w-full p-3 rounded-xl border text-sm font-bold">
                <button onclick="saveCrew()" class="w-full dominos-blue text-white py-3 rounded-xl font-black text-xs uppercase">Simpan Crew Baru</button>
            </div>
            <div id="crewListAdmin" class="space-y-2"></div>
        </div>
    </div>

    <div id="pinOverlay" class="fixed inset-0 dominos-blue z-[10000] flex flex-col items-center justify-center p-6">
        <div class="text-center mb-8 text-white">
            <h1 class="font-black italic text-4xl uppercase">Domino's</h1>
            <p class="text-red-400 font-bold uppercase tracking-widest text-sm">JTM Track System</p>
        </div>
        <div class="bg-white p-8 rounded-[2.5rem] shadow-2xl w-full max-w-sm text-center">
            <select id="selectUser" class="w-full p-4 bg-gray-100 rounded-2xl mb-4 font-bold text-blue-900 outline-none uppercase text-xs"></select>
            <input type="password" id="inputPin" maxlength="4" placeholder="PIN 4 DIGIT" inputmode="numeric" class="w-full text-center text-2xl font-black p-4 bg-gray-100 rounded-2xl mb-6 outline-none">
            <button onclick="prosesLogin()" class="w-full dominos-red text-white py-4 rounded-2xl font-black uppercase shadow-lg">Masuk</button>
        </div>
    </div>

    <div id="mainContent" style="display:none;" class="flex flex-col h-full">
        <nav class="dominos-blue p-4 text-white shadow-md flex justify-between items-center">
            <h1 class="font-black italic uppercase text-lg">Domino's <span class="text-red-400">JTM</span></h1>
            <div class="flex items-center gap-2">
                <span id="userDisplay" class="bg-white text-blue-900 px-3 py-1 rounded-full text-[10px] font-black uppercase">User</span>
                <button onclick="location.reload()" class="bg-red-500 w-7 h-7 rounded-full flex items-center justify-center shadow-inner"><i class="fa fa-sync-alt text-[10px]"></i></button>
            </div>
        </nav>

        <div id="deliveryStatusBar" class="bg-white px-4 flex flex-col text-[9px] font-black text-blue-900 uppercase italic" style="max-height: 60px; overflow-y: auto; border-bottom: 1px solid #e2e8f0;"></div>

        <main class="flex-1 overflow-hidden relative">
            <div id="page-list" class="page active p-4 overflow-y-auto">
                <div class="flex justify-between items-center mb-3">
                    <input type="text" id="searchInput" oninput="debounceRender()" placeholder="Cari Antaran..." class="w-2/3 p-3 rounded-xl shadow-sm outline-none font-bold italic text-sm">
                    <div id="countActive" class="bg-red-500 text-white px-3 py-2 rounded-xl text-[10px] font-black italic">0 AKTIF</div>
                </div>
                <div id="activeList" class="space-y-4 pb-32"></div>
            </div>

            <div id="page-history" class="page p-4 overflow-y-auto">
                <div id="historyList" class="space-y-4 pb-32"></div>
            </div>

            <div id="page-add" class="page p-4 overflow-y-auto">
                <div class="bg-white rounded-[2rem] p-6 shadow-xl border-b-4 border-blue-900 space-y-3">
                    <h2 class="font-black text-blue-900 text-center uppercase text-xs">Tambah Antaran</h2>
                    <input type="hidden" id="editId">
                    <input type="text" id="custArea" placeholder="KODE AREA" class="w-full bg-yellow-50 p-4 rounded-xl text-sm font-bold uppercase outline-none">
                    <input type="text" id="custName" placeholder="Nama Pelanggan" class="w-full bg-gray-50 p-4 rounded-xl text-sm outline-none font-bold">
                    <input type="tel" id="custPhone" placeholder="Nomor HP" class="w-full bg-gray-50 p-4 rounded-xl text-sm outline-none font-bold">
                    <input type="text" id="custMaps" placeholder="Link Google Maps" class="w-full bg-gray-50 p-4 rounded-xl text-sm outline-none">
                    <button onclick="saveData()" class="w-full dominos-red text-white py-4 rounded-2xl font-black uppercase text-sm">Simpan</button>
                </div>
            </div>

            <div id="page-chat" class="page h-full items-center p-4 bg-gray-100 overflow-y-auto">
                <div class="wa-card mb-20 mx-auto">
                    <h2 class="font-black text-blue-900 uppercase italic text-[12px] mb-3">Scanner Kamera</h2>
                    <div class="scanner-container">
                        <video id="scannerVideo" autoplay playsinline></video>
                        <div id="scannerOverlay" class="scanner-overlay"><div class="scanner-box"><div class="laser"></div></div></div>
                    </div>
                    
                    <div class="flex gap-2 mb-3">
                        <button id="btnStartCam" onclick="startCamera()" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-black uppercase text-[10px]">Buka Kamera</button>
                        <button id="btnStopCam" onclick="stopCamera()" class="hidden flex-1 bg-gray-500 text-white py-3 rounded-xl font-black uppercase text-[10px]">Tutup</button>
                    </div>

                    <input type="tel" id="waDirectNumber" placeholder="Input Nomor Manual" class="w-full p-3 bg-gray-50 rounded-xl border-2 border-gray-100 outline-none font-black text-center text-blue-900 text-sm mb-3">
                    <button onclick="openWaDirect()" class="w-full bg-green-500 text-white py-3 rounded-xl font-black uppercase text-xs shadow-md">Chat WhatsApp</button>
                    
                    <div id="scanResultArea" class="hidden mt-4">
                        <table class="w-full text-[10px] bg-white rounded-lg border">
                            <tbody id="addressTableBody" class="divide-y"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div id="page-home" class="page p-6 overflow-y-auto bg-gray-50">
                <div id="adminFeature" class="hidden mb-4">
                    <button onclick="openAdminModal()" class="w-full bg-red-600 text-white p-4 rounded-2xl font-black uppercase italic">DATABASE CREW</button>
                </div>
                <button onclick="handleLogout()" class="w-full bg-gray-200 text-gray-600 p-4 rounded-2xl font-black uppercase italic">KELUAR SISTEM</button>
            </div>
        </main>

        <div class="bottom-nav">
            <div onclick="showPage('list')" class="nav-item active" id="nav-list"><i class="fa fa-motorcycle mb-1 text-xl"></i><span>Antaran</span></div>
            <div onclick="showPage('history')" class="nav-item" id="nav-history"><i class="fa fa-history mb-1 text-xl"></i><span>History</span></div>
            <div onclick="showPage('add')" class="nav-item nav-add" id="nav-add"><i class="fa fa-plus text-2xl"></i></div>
            <div onclick="showPage('chat')" class="nav-item" id="nav-chat"><i class="fab fa-whatsapp mb-1 text-xl"></i><span>Scanner</span></div>
            <div onclick="showPage('home')" class="nav-item" id="nav-home"><i class="fa fa-user mb-1 text-xl"></i><span>Admin</span></div>
        </div>
    </div>

    <script>
        // Data & Firebase
        let userPins = { "Okta": "1410" }; 
        const firebaseConfig = { 
            apiKey: "AIzaSyAZ7twf8SbcK-HqniDmVqT6k8IM3ehFtgc", 
            databaseURL: "https://trackcust-jtm-default-rtdb.asia-southeast1.firebasedatabase.app", 
            projectId: "trackcust-jtm" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        let currentUser = localStorage.getItem('jtm_user') || "";
        let allData = {};
        let stream = null;
        let isScanning = false;
        let autoScanInterval = null;

        // --- Logika Kamera & Mode BW untuk Scan ---
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                const v = document.getElementById('scannerVideo');
                v.srcObject = stream;
                document.getElementById('btnStartCam').classList.add('hidden');
                document.getElementById('btnStopCam').classList.remove('hidden');
                document.getElementById('scannerOverlay').style.display = 'block';
                startAutoScan();
            } catch (err) { alert("Izin kamera ditolak."); }
        }

        function stopCamera() {
            if (stream) stream.getTracks().forEach(t => t.stop());
            document.getElementById('btnStartCam').classList.remove('hidden');
            document.getElementById('btnStopCam').classList.add('hidden');
            document.getElementById('scannerOverlay').style.display = 'none';
            clearInterval(autoScanInterval);
        }

        function startAutoScan() {
            autoScanInterval = setInterval(async () => {
                if (isScanning || !stream) return;
                isScanning = true;
                
                const v = document.getElementById('scannerVideo');
                const c = document.createElement('canvas');
                c.width = v.videoWidth;
                c.height = v.videoHeight;
                const ctx = c.getContext('2d');
                
                // Menerapkan "Mode BW" (Grayscale + High Contrast) pada canvas sebelum dibaca Tesseract
                ctx.filter = 'grayscale(100%) contrast(150%)';
                ctx.drawImage(v, 0, 0, c.width, c.height);
                
                try {
                    const res = await Tesseract.recognize(c.toDataURL(), 'eng');
                    const matches = res.data.text.match(/(?:\+62|62|08)[0-9\-\s]{8,15}/g);
                    if (matches) {
                        let n = matches[0].replace(/\D/g, '');
                        if (n.length >= 10) {
                            document.getElementById('waDirectNumber').value = n;
                            // Opsional: Getar atau Bunyi jika nomor ditemukan
                            if (window.navigator.vibrate) window.navigator.vibrate(100);
                        }
                    }
                } catch (e) {} finally { isScanning = false; }
            }, 3000);
        }

        // --- Fungsi Auth & Dasar ---
        function prosesLogin() {
            const u = document.getElementById('selectUser').value;
            const p = document.getElementById('inputPin').value;
            if(userPins[u] === p) bukaApp(u); else alert("PIN SALAH!");
        }

        function bukaApp(n) {
            currentUser = n; localStorage.setItem('jtm_user', n);
            document.getElementById('userDisplay').innerText = n;
            document.getElementById('pinOverlay').style.display = "none";
            document.getElementById('mainContent').style.display = "flex";
            if(n === "Okta") document.getElementById('adminFeature').classList.remove('hidden');
            db.ref('customers').on('value', s => { allData = s.val() || {}; render(); });
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-'+id));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.id === 'nav-'+id));
            if(id !== 'chat') stopCamera();
        }

        function render() {
            const list = document.getElementById('activeList');
            const hist = document.getElementById('historyList');
            let listHTML = ""; let histHTML = "";
            let activeCount = 0;

            Object.keys(allData).reverse().forEach(id => {
                const i = allData[id];
                const card = `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border-l-4 ${i.status === 'done' ? 'border-gray-300' : 'border-red-600'}">
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="text-[10px] font-black text-red-600 uppercase">${i.area || 'AREA'}</p>
                                <h3 class="font-black text-blue-900">${i.name}</h3>
                                <p class="text-[10px] text-gray-400 font-bold">${i.phone || '-'}</p>
                            </div>
                            <div class="flex gap-2">
                                ${i.status !== 'done' ? 
                                `<button onclick="setStatus('${id}','done')" class="bg-green-500 text-white w-8 h-8 rounded-lg"><i class="fa fa-check"></i></button>` : 
                                `<button onclick="setStatus('${id}','active')" class="bg-gray-200 text-gray-500 w-8 h-8 rounded-lg"><i class="fa fa-undo"></i></button>`}
                            </div>
                        </div>
                    </div>
                `;
                if(i.status === 'done') histHTML += card;
                else { listHTML += card; activeCount++; }
            });

            list.innerHTML = listHTML;
            hist.innerHTML = histHTML;
            document.getElementById('countActive').innerText = activeCount + " AKTIF";
        }

        function saveData() {
            const d = {
                area: document.getElementById('custArea').value.toUpperCase(),
                name: document.getElementById('custName').value,
                phone: document.getElementById('custPhone').value,
                maps: document.getElementById('custMaps').value,
                status: 'active',
                timestamp: Date.now()
            };
            db.ref('customers').push(d).then(() => {
                showPage('list');
                document.getElementById('custArea').value = "";
                document.getElementById('custName').value = "";
            });
        }

        function setStatus(id, stat) { db.ref('customers/'+id).update({ status: stat }); }

        function openWaDirect() {
            let n = document.getElementById('waDirectNumber').value.replace(/\D/g, '');
            if(!n) return alert("Nomor kosong!");
            let wa = n.startsWith('0') ? '62' + n.slice(1) : n;
            window.open(`https://wa.me/${wa}`, '_blank');
        }

        function handleLogout() { localStorage.clear(); location.reload(); }

        // Init database crew & dropdown
        db.ref('crew_list').on('value', snap => {
            const data = snap.val(); if(data) userPins = data;
            const logSel = document.getElementById('selectUser');
            logSel.innerHTML = '<option value="">PILIH CREW</option>';
            Object.keys(userPins).forEach(n => logSel.innerHTML += `<option value="${n}">${n}</option>`);
        });

        // Placeholder untuk update timer dsb (bisa ditambah sesuai kebutuhan)
        function updateTimers() {}
        function startDeliveryStatusListener() {}
        function debounceRender() { render(); }
    </script>
</body>
</html>
