<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1888 Grand Chess - Fixed</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Special+Elite&display=swap');

        body { 
            background: #1a0f0a; color: #d7ccc8; font-family: 'Special Elite', cursive;
            margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        /* Overlay */
        #overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; 
            display: flex; justify-content: center; align-items: center;
        }
        .card {
            background: #5d4037; padding: 30px; border: 5px double #b7950b;
            text-align: center; width: 300px;
        }

        /* Board 3D */
        .scene { perspective: 1200px; margin: 40px 0; }
        .board-wrapper { 
            transform-style: preserve-3d; transition: transform 1s;
            border: 10px solid #3d2b1f; background: #000;
        }
        .angle-white { transform: rotateX(45deg) rotateZ(0deg); }
        .angle-black { transform: rotateX(45deg) rotateZ(180deg); }

        .board { display: grid; grid-template-columns: repeat(8, 11vw); grid-template-rows: repeat(8, 11vw); }
        @media (min-width: 600px) { .board { grid-template-columns: repeat(8, 60px); grid-template-rows: repeat(8, 60px); } }

        .tile { 
            display: flex; justify-content: center; align-items: center; font-size: 2.5rem; 
            cursor: pointer; position: relative;
        }
        .tile-light { background: #ecd9b9; }
        .tile-dark { background: #7d5a44; }
        .tile-selected { background: #f1c40f !important; }

        .piece { 
            user-select: none; pointer-events: none; 
            filter: drop-shadow(0 3px 2px rgba(0,0,0,0.5));
        }
        .piece.white { color: #fff; text-shadow: 1px 1px 3px #000; }
        .piece.black { color: #000; }
        .flipped { transform: rotate(180deg); }

        .status { color: #b7950b; font-weight: bold; margin: 10px; height: 20px; }
        .btn { 
            background: #3d2b1f; color: #b7950b; border: 1px solid #b7950b;
            padding: 10px; cursor: pointer; font-family: 'Cinzel'; width: 100%; margin: 5px 0;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="card">
            <h2 style="font-family: 'Cinzel'; margin-top:0;">CHESS 1888</h2>
            <input type="text" id="playerName" placeholder="Nama..." style="width:90%; padding:8px; margin-bottom:10px;">
            <button class="btn" onclick="join('white')">MAIN PUTIH</button>
            <button class="btn" onclick="join('black')">MAIN HITAM</button>
        </div>
    </div>

    <div class="status" id="status">MENGHUBUNGKAN...</div>
    
    <div class="scene">
        <div id="board-rotator" class="board-wrapper">
            <div id="main-board" class="board"></div>
        </div>
    </div>

    <button onclick="hardReset()" style="font-size: 10px; opacity: 0.5;">RESET PAKSA PAPAN</button>

    <script>
        // Firebase Init
        const firebaseConfig = {
            apiKey: "AIzaSyBlL2HCkJYw_wNTMvJpDUpmJzw1-plQTm0",
            authDomain: "tic-tac-toe-api-5a2c0.firebaseapp.com",
            databaseURL: "https://tic-tac-toe-api-5a2c0-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "tic-tac-toe-api-5a2c0",
            storageBucket: "tic-tac-toe-api-5a2c0.firebasestorage.app",
            messagingSenderId: "820709850876",
            appId: "1:820709850876:web:e07700750b3faccb412179"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref('game_v3_fixed');

        let myRole = ""; let turn = "white"; let boardData = {}; let selected = null;
        const pieces = {
            white: { p: '♙', r: '♖', n: '♘', b: '♗', q: '♕', k: '♔' },
            black: { p: '♟', r: '♜', n: '♞', b: '♝', q: '♛', k: '♚' }
        };

        function join(role) {
            const name = document.getElementById('playerName').value || "Guest";
            myRole = role;
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('board-rotator').className = 'board-wrapper angle-' + role;
            
            initGrid();
            listen();
        }

        function initGrid() {
            const grid = document.getElementById('main-board');
            grid.innerHTML = "";
            for(let i=0; i<64; i++) {
                const t = document.createElement('div');
                const isDark = (Math.floor(i/8) + (i%8)) % 2 !== 0;
                t.className = `tile ${isDark ? 'tile-dark' : 'tile-light'}`;
                t.id = `t-${i}`;
                t.onclick = () => clickTile(i);
                grid.appendChild(t);
            }
        }

        function listen() {
            db.child('cells').on('value', s => {
                boardData = s.val() || {};
                // JIKA DATA KOSONG, ISI OTOMATIS
                if (Object.keys(boardData).length === 0) hardReset();
                draw();
            });
            db.child('turn').on('value', s => {
                turn = s.val() || 'white';
                document.getElementById('status').innerText = (turn === myRole) ? "GILIRAN ANDA" : "TUNGGU LAWAN...";
            });
        }

        function draw() {
            for(let i=0; i<64; i++) {
                const t = document.getElementById(`t-${i}`);
                const p = boardData[i];
                if(p) {
                    const flip = (myRole === 'black') ? 'flipped' : '';
                    t.innerHTML = `<span class="piece ${p.color} ${flip}">${pieces[p.color][p.type]}</span>`;
                } else {
                    t.innerHTML = "";
                }
            }
        }

        function clickTile(i) {
            if(turn !== myRole) return;
            const p = boardData[i];

            if(selected === null) {
                if(p && p.color === myRole) {
                    selected = i;
                    document.getElementById(`t-${i}`).classList.add('tile-selected');
                }
            } else {
                if(i !== selected) move(selected, i);
                document.getElementById(`t-${selected}`).classList.remove('tile-selected');
                selected = null;
            }
        }

        function move(from, to) {
            // Logika Gerak Sederhana (Bisa ditambah validasi per bidak di sini)
            const p = boardData[from];
            const updates = {};
            updates[`cells/${from}`] = null;
            updates[`cells/${to}`] = p;
            updates[`turn`] = (myRole === 'white' ? 'black' : 'white');
            db.update(updates);
        }

        function hardReset() {
            const start = {};
            const layout = ['r','n','b','q','k','b','n','r'];
            for(let i=0; i<8; i++) {
                start[i] = { type: layout[i], color: 'black' };
                start[8+i] = { type: 'p', color: 'black' };
                start[48+i] = { type: 'p', color: 'white' };
                start[56+i] = { type: layout[i], color: 'white' };
            }
            db.child('cells').set(start);
            db.child('turn').set('white');
        }
    </script>
</body>
</html>
