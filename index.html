<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tic-Tac-Toe: Harvest Moon Edition</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Special+Elite&display=swap');

        :root {
            --wood-dark: #3d2b1f;
            --wood-light: #5d4037;
            --brass: #b7950b;
            --brass-dark: #7d6608;
            --paper: #d7ccc8;
            --gold-fire: linear-gradient(90deg, #ff4500, #ffd700, #ffffff, #ffd700, #ff4500);
            --shadow-out: 4px 4px 8px rgba(0,0,0,0.4), -1px -1px 2px rgba(255,255,255,0.1);
            --shadow-in: inset 4px 4px 8px rgba(0,0,0,0.5), inset -1px -1px 2px rgba(255,255,255,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: radial-gradient(circle, #2c1e16 0%, #1a0f0a 100%);
            color: var(--paper);
            font-family: 'Special Elite', cursive;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding: 10px;
            overflow-x: hidden;
        }

        /* --- VINTAGE OVERLAY --- */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 1000; 
            display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }
        .card-vintage {
            background: var(--wood-light);
            padding: 30px; border: 8px double var(--brass);
            border-radius: 5px; text-align: center; width: 90%; max-width: 400px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,0,0,0.5);
        }

        input.name-input {
            width: 100%; padding: 12px; border: none;
            background: #2a1b12; color: var(--paper); margin-bottom: 20px;
            box-shadow: var(--shadow-in); outline: none; text-align: center;
        }

        .btn-choice {
            padding: 15px; border: 1px solid var(--brass-dark);
            background: var(--wood-light); color: var(--brass);
            font-weight: bold; cursor: pointer; border-radius: 8px;
            box-shadow: var(--shadow-out); transition: 0.2s; width: 110px;
        }
        .btn-choice:active { transform: scale(0.95); box-shadow: var(--shadow-in); }

        /* --- UI COMPONENTS --- */
        .scoreboard { 
            display: flex; gap: 15px; margin-bottom: 20px; width: 100%; max-width: 450px; 
            padding: 10px; border-bottom: 2px solid var(--brass-dark);
        }
        .score-box { 
            flex: 1; text-align: center; padding: 10px; 
            background: var(--wood-dark); border-radius: 10px;
            box-shadow: var(--shadow-in);
        }
        .score-box b { font-size: 1.8rem; color: var(--brass); font-family: 'Cinzel', serif; }

        .viewport-container { width: 100%; overflow-x: auto; display: flex; justify-content: center; padding: 15px 0; }
        
        .board-wrapper { 
            position: relative; padding: 20px; 
            background: var(--wood-dark); 
            border: 10px solid #2a1b12; 
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), var(--shadow-out);
        }

        .board { 
            display: grid; grid-template-columns: repeat(10, 42px); gap: 8px; 
            background: transparent;
        }

        .block { 
            width: 42px; height: 42px; 
            background: var(--wood-light);
            border-radius: 6px;
            display: flex; justify-content: center; align-items: center; 
            font-family: 'Cinzel', serif; font-weight: 900; font-size: 1.2rem;
            cursor: pointer; transition: all 0.2s ease;
            box-shadow: var(--shadow-out);
        }
        
        .block:active { transform: scale(0.9); box-shadow: var(--shadow-in); }

        .block.taken {
            box-shadow: var(--shadow-in);
            background: #463028;
        }

        .x-icon { color: #d32f2f; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }
        .o-icon { color: var(--brass); text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }

        .win-line { position: absolute; z-index: 100; background: var(--gold-fire); height: 8px; border-radius: 10px; pointer-events: none; animation: draw 0.6s forwards; box-shadow: 0 0 15px #ff4500; }
        @keyframes draw { from { width: 0; } }

        #status { font-family: 'Cinzel', serif; color: var(--brass); margin-bottom: 15px; letter-spacing: 1px; }
        
        #music-toggle {
            position: fixed; bottom: 15px; right: 15px; background: rgba(0,0,0,0.6);
            border: 1px solid var(--brass); color: var(--brass); padding: 8px 15px;
            border-radius: 30px; font-size: 0.7rem; cursor: pointer; box-shadow: var(--shadow-out);
        }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="card-vintage">
            <h2 style="font-family: 'Cinzel'; color: var(--brass);">BOARD GAME - 1888</h2>
            <input type="text" id="inputNama" class="name-input" placeholder="NAMA ANDA..." maxlength="10">
            <div style="display: flex; gap: 20px; justify-content: center;">
                <button id="btnX" class="btn-choice" onclick="pickRole('X')">X</button>
                <button id="btnO" class="btn-choice" onclick="pickRole('O')">O</button>
            </div>
        </div>
    </div>

    <div class="scoreboard">
        <div class="score-box"><span id="nameX" style="font-size:0.7rem;">PEMAIN X</span><br><b id="scoreX">0</b></div>
        <div class="score-box" style="background:transparent; box-shadow:none; flex:0.2;">VS</div>
        <div class="score-box"><span id="nameO" style="font-size:0.7rem;">PEMAIN O</span><br><b id="scoreO">0</b></div>
    </div>

    <div id="status">SINKRONISASI...</div>

    <div class="viewport-container">
        <div class="board-wrapper">
            <div class="board" id="game-board"></div>
            <div id="line-container"></div>
        </div>
    </div>

    <button class="btn-choice" onclick="resetBoard()" style="width: auto; padding: 10px 25px; margin-top: 15px; border-radius: 30px; color: #d32f2f;">RESET PAPAN</button>
    <button id="music-toggle" onclick="toggleMusic()">🎵 MUSIK: ON</button>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBlL2HCkJYw_wNTMvJpDUpmJzw1-plQTm0",
            authDomain: "tic-tac-toe-api-5a2c0.firebaseapp.com",
            databaseURL: "https://tic-tac-toe-api-5a2c0-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "tic-tac-toe-api-5a2c0",
            storageBucket: "tic-tac-toe-api-5a2c0.firebasestorage.app",
            messagingSenderId: "820709850876",
            appId: "1:820709850876:web:e07700750b3faccb412179"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref('game_musical_v1');

        // --- HARVEST MOON TOWN THEME LOGIC ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let musicPlaying = true;

        const notes = {
            'C4': 261.63, 'D4': 293.66, 'E4': 329.63, 'F4': 349.23, 'G4': 392.00, 'A4': 440.00, 'B4': 493.88,
            'C5': 523.25, 'D5': 587.33, 'E5': 659.25, 'F5': 698.46, 'G5': 783.99, 'A5': 880.00, 'B5': 987.77
        };

        // Simplified Town Theme Melody
        const townMelody = [
            'G4', 'E5', 'D5', 'C5', 'B4', 'C5', 'D5', 'G4',
            'G4', 'E5', 'D5', 'C5', 'B4', 'C5', 'A4', 'G4',
            'F4', 'A4', 'C5', 'E5', 'D5', 'C5', 'B4', 'G4'
        ];

        function playNote(freq, type, duration, volume) {
            if (!musicPlaying && type === 'square') return; 
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        let melodyIndex = 0;
        function playTownTheme() {
            if (musicPlaying) {
                const noteName = townMelody[melodyIndex];
                playNote(notes[noteName], 'square', 0.4, 0.02);
                melodyIndex = (melodyIndex + 1) % townMelody.length;
            }
            setTimeout(playTownTheme, 400); // Tempo
        }

        const sfx = {
            click: () => playNote(600, 'sine', 0.1, 0.1),
            win: () => {
                const winNotes = [523, 659, 783, 1046];
                winNotes.forEach((n, i) => setTimeout(() => playNote(n, 'square', 0.6, 0.05), i * 150));
            }
        };

        function toggleMusic() {
            musicPlaying = !musicPlaying;
            document.getElementById('music-toggle').innerText = musicPlaying ? "🎵 MUSIK: ON" : "🔇 MUSIK: OFF";
        }

        // --- GAME LOGIC ---
        let myRole = null, myName = "", currentTurn = 'X', gameActive = true, grid = Array(100).fill("");

        function pickRole(role) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const nameIn = document.getElementById('inputNama').value;
            if(!nameIn) { alert("MASUKKAN NAMA!"); return; }
            myName = nameIn; myRole = role;
            db.child('names/' + role).set(myName);
            document.getElementById('overlay').style.display = 'none';
            initUI(); startSync();
            playTownTheme();
        }

        function initUI() {
            const board = document.getElementById('game-board');
            board.innerHTML = "";
            for (let i = 0; i < 100; i++) {
                const b = document.createElement('div');
                b.className = 'block'; b.id = `b-${i}`;
                b.onclick = () => {
                    if(gameActive && currentTurn === myRole && grid[i] === "") {
                        sfx.click();
                        db.child('cells/' + i).set(myRole);
                        db.child('turn').set(myRole === 'X' ? 'O' : 'X');
                    }
                };
                board.appendChild(b);
            }
        }

        function startSync() {
            db.child('turn').on('value', s => {
                currentTurn = s.val() || 'X';
                document.getElementById('status').innerText = currentTurn === myRole ? "GILIRAN ANDA" : "LAWAN BERPIKIR...";
            });
            db.child('names').on('value', s => {
                const names = s.val() || {};
                document.getElementById('nameX').innerText = names.X || "X";
                document.getElementById('nameO').innerText = names.O || "O";
            });
            db.child('scores').on('value', s => {
                const sc = s.val() || {X:0, O:0};
                document.getElementById('scoreX').innerText = sc.X;
                document.getElementById('scoreO').innerText = sc.O;
            });
            db.child('cells').on('value', s => {
                const data = s.val() || {};
                grid = Array(100).fill("");
                Object.keys(data).forEach(i => {
                    grid[i] = data[i];
                    const el = document.getElementById(`b-${i}`);
                    if(el) {
                        el.innerHTML = `<span class="${grid[i]==='X'?'x-icon':'o-icon'}">${grid[i]}</span>`;
                        el.classList.add('taken');
                    }
                });
                checkWin();
            });
            db.on('value', s => { if(!s.hasChild('cells')) { gameActive = true; document.getElementById('line-container').innerHTML = ""; initUI(); } });
        }

        function checkWin() {
            for (let i = 0; i < 100; i++) {
                if (grid[i] === "") continue;
                const win = getCombo(i);
                if (win) {
                    gameActive = false;
                    sfx.win();
                    drawWinLine(win.cells, grid[i]);
                    if(myRole === grid[i]) db.child('scores/' + grid[i]).transaction(c => (c || 0) + 1);
                    break;
                }
            }
        }

        function getCombo(i) {
            const r = Math.floor(i / 10), c = i % 10, char = grid[i];
            const dirs = [{x:1,y:0}, {x:0,y:1}, {x:1,y:1}, {x:1,y:-1}];
            for (let d of dirs) {
                let combo = [i];
                [1, -1].forEach(s => {
                    let nr = r+d.y*s, nc = c+d.x*s;
                    while(nr>=0 && nr<10 && nc>=0 && nc<10 && grid[nr*10+nc] === char) {
                        combo.push(nr*10+nc); nr += d.y*s; nc += d.x*s;
                    }
                });
                if (combo.length >= 5) return { cells: combo };
            }
            return null;
        }

        function drawWinLine(cells, p) {
            cells.sort((a,b) => a-b);
            const b = document.getElementById('game-board').getBoundingClientRect();
            const s = document.getElementById(`b-${cells[0]}`).getBoundingClientRect();
            const e = document.getElementById(`b-${cells[cells.length-1]}`).getBoundingClientRect();
            const x1 = (s.left+s.width/2)-b.left, y1 = (s.top+s.height/2)-b.top;
            const x2 = (e.left+e.width/2)-b.left, y2 = (e.top+e.height/2)-b.top;
            const dist = Math.sqrt(Math.pow(x2-x1, 2) + Math.pow(y2-y1, 2));
            const angle = Math.atan2(y2-y1, x2-x1) * 180 / Math.PI;
            const line = document.createElement('div');
            line.className = 'win-line';
            line.style.cssText = `left:${x1}px; top:${y1}px; width:${dist}px; transform:rotate(${angle}deg); transform-origin: 0 50%;`;
            document.getElementById('line-container').appendChild(line);
            document.getElementById('status').innerHTML = `${p} MENANG! 🔥`;
        }

        function resetBoard() { if(confirm("RESET PAPAN?")) db.child('cells').remove(); }
    </script>
</body>
</html>
